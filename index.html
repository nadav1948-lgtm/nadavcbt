<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>CBT בבית הספר</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232f6f62'/><text x='50' y='68' font-size='56' text-anchor='middle'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Dark-first, matching the library site (Artlist-inspired): near-black grounds, bold white type, one yellow accent. */
:root{
  color-scheme: dark;
  --bg:#0d0d0d; --bg2:#171717; --panel:#1c1c1c; --ink:#ffffff; --muted:#9a9a9a; --line:#2c2c2c;
  --brand:#ffda2a; --brand-2:#e6c21f; --brand-soft:rgba(255,218,42,.13); --brand-ink:#171717; --brand-text:#ffda2a;
  --accent:#f2a93b; --danger:#ff6b61; --ok:#3fb56c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --shadow-hi:0 14px 40px rgba(0,0,0,.55);
  --r:14px; --soft-s:35%; --soft-l:20%; --sat:60%; --lt:62%;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ffffff; --bg2:#f4f4f4; --panel:#ffffff; --ink:#171717; --muted:#6b6b6b; --line:#e7e7e7;
  --brand:#ffda2a; --brand-2:#e6c21f; --brand-soft:rgba(255,218,42,.25); --brand-ink:#171717; --brand-text:#8a6a00;
  --danger:#c8423b; --ok:#2f9a5a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
  --shadow-hi:0 14px 36px rgba(0,0,0,.14);
  --soft-s:70%; --soft-l:93%; --sat:58%; --lt:42%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Heebo,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;text-wrap:balance;font-weight:800}

/* layout */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 18px;text-decoration:none}
.brand .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-size:20px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.nav a .i{font-size:19px;width:24px;text-align:center}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding:0 28px 90px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:66px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.topbar .title{font-weight:700;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px}
.who select{border:0;background:none;max-width:170px;outline:none;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--bg2);cursor:pointer;border:0;text-align:start}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#aaa;flex:0 0 auto}
.sync.ok .dot{background:var(--ok)} .sync.warn .dot{background:var(--accent)} .sync.err .dot{background:var(--danger)}
.tabbar{display:none}

/* common */
.page{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:44px 40px;color:#fff;margin:6px 0 22px;isolation:isolate;background:#0a0a0a;border:1px solid #222}
.hero::before{content:'';position:absolute;inset:-40%;z-index:-1;background:radial-gradient(40% 50% at 80% 25%,rgba(255,218,42,.20),transparent 70%),radial-gradient(35% 45% at 15% 75%,rgba(74,156,138,.30),transparent 70%),radial-gradient(30% 40% at 55% 115%,rgba(120,90,255,.22),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.05)}}
@media (prefers-reduced-motion: reduce){.hero::before{animation:none}}
.hero h1{margin:0 0 10px;font-size:clamp(30px,4.6vw,54px);font-weight:900;letter-spacing:-1px;line-height:1.05}
.hero p{margin:0;opacity:.92;max-width:640px}
.hero .actions{margin-top:20px}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.hero .btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
h2.sec{font-size:20px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec small{font-size:14px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.card{--h:160;position:relative;display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;cursor:pointer;overflow:hidden;min-width:0}
.card.accent::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:hsl(var(--h) var(--sat) var(--lt))}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.card .emoji{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:hsl(var(--h) var(--soft-s) var(--soft-l))}
.card .name{font-weight:600;font-size:16.5px}
.card .sub{font-size:13.5px;color:var(--muted)}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel + .panel{margin-top:14px}
.panel h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--bg2);border-radius:30px;padding:8px 16px;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .12s,border-color .12s,background .12s;white-space:nowrap}
.btn:hover{border-color:var(--brand-text);transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand-text);color:#fff;font-weight:500}

.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand-text);color:#fff}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 18px;scrollbar-width:thin}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--brand-text);border-bottom-color:var(--brand-text)}
ul.clean{margin:0;padding:0 18px 0 0}
ul.clean li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:46px;display:block;margin-bottom:6px}
.banner{--h:160;position:relative;overflow:hidden;isolation:isolate;border-radius:18px;padding:30px 30px;color:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 18px;background:#0a0a0a;border:1px solid #222}`n.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 100% at 85% 0%,hsl(var(--h) 60% 35% / .75),transparent 70%),radial-gradient(40% 80% at 10% 100%,hsl(calc(var(--h) + 40) 60% 30% / .5),transparent 70%)}`n.banner h1{font-weight:900;letter-spacing:-.5px}
.banner .emoji{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:32px;flex:0 0 auto}
.banner h1{margin:0;font-size:clamp(21px,3vw,29px)}
.banner p{margin:4px 0 0;opacity:.9}
.banner .actions{margin-inline-start:auto}
.banner .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.back{display:inline-flex;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-top:4px}
.back:hover{color:var(--brand-text)}
.note{background:var(--brand-soft);border-radius:14px;padding:12px 16px;font-size:14.5px}
.note.warn{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.note.danger{background:color-mix(in srgb,var(--danger) 14%,var(--panel))}

/* model diagram */
.model{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.model .box{border-radius:14px;padding:12px 14px;background:var(--bg2);font-size:14px}
.model .box b{display:block;margin-bottom:6px;font-size:14.5px}
.model .box.t{background:hsl(210 var(--soft-s) var(--soft-l))}
.model .box.f{background:hsl(0 var(--soft-s) var(--soft-l))}
.model .box.b{background:hsl(35 var(--soft-s) var(--soft-l))}
.model .box.a{background:hsl(145 var(--soft-s) var(--soft-l))}
.model .trig{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line)}

/* sessions */
.sess{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.sess summary{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;font-weight:600;list-style:none}
.sess summary::-webkit-details-marker{display:none}
.sess summary .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:14px;flex:0 0 auto}
.sess summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--muted)}
.sess[open] summary .chev{transform:rotate(-90deg)}
.sess .body{padding:0 16px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sess .body h4{margin:4px 0;font-size:13.5px;color:var(--muted)}
.sess.done summary .n{background:var(--ok);color:#fff}

/* forms */
.form{display:grid;gap:12px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:15px;outline:none;width:100%}
label.f textarea,.inp.ta{min-height:80px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{border-color:var(--brand-text)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--brand-text)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:20px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .2s ease}
.modal.big .box{width:min(1100px,100%);height:92vh;padding:0;display:flex;flex-direction:column;overflow:hidden}
.modal .mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal.big .mhead{padding:10px 14px;margin:0;border-bottom:1px solid var(--line)}
.modal .mhead h3{margin:0;flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal iframe{flex:1;border:0;width:100%;background:#fff}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

/* student */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.li .grow{flex:1;min-width:0}
.li .date{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:190px}
.chart .axis{stroke:var(--line)}
.chart .lbl{fill:var(--muted);font-size:11px}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5}
.chart .pt{fill:var(--panel);stroke:var(--brand);stroke-width:2.5}

/* kid tools */
.toolstage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);min-height:420px}
.kid{font-size:19px}
.kid h2{font-size:26px;margin:0 0 6px;text-align:center}
.kid .lead{text-align:center;color:var(--muted);margin:0 0 18px}
.thermo{display:flex;gap:26px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.thermo .bar{display:flex;flex-direction:column-reverse;gap:4px;width:120px}
.thermo .lvl{height:36px;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer;font-weight:700;color:#fff;transition:transform .12s;opacity:.45}
.thermo .lvl.on{opacity:1;transform:scale(1.06);border-color:var(--ink)}
.thermo .lvl.fill{opacity:1}
.thermo .face{font-size:90px;text-align:center;line-height:1}
.emos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.emos button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 14px;font-size:17px;cursor:pointer}
.emos button.on{border-color:var(--brand-text);background:var(--brand-soft)}
/* the living scene: a Hardal boy in a park next to a big thermometer; everything follows data-emo + --k (0–1) */
.scenewrap{position:relative;max-width:640px;margin:0 auto}
.scene{width:100%;height:auto;display:block;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.25);touch-action:none;user-select:none}
.scene .thermo{cursor:pointer}
.scene .thtick:hover text{fill:#2563eb}
#thMerc{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s cubic-bezier(.34,1.56,.64,1),fill .7s}
#thBulb{transition:fill .7s}
.bubble{position:relative;display:table;margin:0 auto 14px;max-width:92%;z-index:2;background:#fff;color:#1f2937;border:2px solid #e2e8f0;border-radius:18px;padding:9px 13px;font-size:16px;line-height:1.45;text-align:center;box-shadow:0 6px 18px rgba(15,23,42,.18)}
.bubble:after{content:'';position:absolute;bottom:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.pop{animation:k-pop .45s ease}
.emos button{transition:transform .15s}
.emos button:active{transform:scale(.94)}
.emos button .em{display:inline-block}
.emos button.on .em{animation:k-pop .5s ease}
/* poses: arm angles, head tilt */
.scene{--aR:-6deg;--aL:6deg;--hy:0px;--ht:0deg}
.scene .armL,.scene .armR,.scene .headg,.scene .kidmove{transform-box:view-box}
.scene .armR{transform-origin:0 0;transform:rotate(var(--aR));transition:transform .8s cubic-bezier(.34,1.3,.64,1)}
.scene .armL{transform-origin:0 0;transform:rotate(var(--aL));transition:transform .8s cubic-bezier(.34,1.3,.64,1)}
.scene .headg{transform-origin:0 -112px;transform:translateY(var(--hy)) rotate(var(--ht));transition:transform .8s ease}
.scene .kidmove{transform-origin:0 0;animation:k-idle 3.2s ease-in-out infinite}
.scene[data-emo="שמחה"]{--aR:calc(-35deg - 115deg * var(--k));--aL:calc(35deg + 115deg * var(--k));--ht:calc(-4deg * var(--k))}
.scene[data-emo="רוגע"]{--aR:-16deg;--aL:16deg}
.scene[data-emo="פחד"]{--aR:calc(30deg + 128deg * var(--k));--aL:calc(-30deg - 128deg * var(--k));--hy:calc(4px * var(--k))}
.scene[data-emo="דאגה"]{--aR:calc(18deg + 28deg * var(--k));--aL:calc(-18deg - 28deg * var(--k));--ht:calc(-7deg * var(--k))}
.scene[data-emo="כעס"]{--aR:calc(-8deg - 22deg * var(--k));--aL:calc(8deg + 22deg * var(--k))}
.scene[data-emo="עצב"]{--aR:4deg;--aL:-4deg;--hy:calc(8px * var(--k));--ht:calc(10deg * var(--k))}
.scene[data-emo="בושה"]{--aR:calc(50deg + 115deg * var(--k));--aL:-8deg;--hy:calc(6px * var(--k));--ht:calc(-12deg * var(--k))}
.scene[data-emo="תסכול"]{--aR:calc(-30deg - 75deg * var(--k));--aL:calc(30deg + 75deg * var(--k));--ht:calc(5deg * var(--k))}
/* movement: the stronger the feeling, the bigger the motion */
.scene[data-emo="שמחה"] .kidmove{animation:k-jump .75s ease-in-out infinite}
.scene[data-emo="רוגע"] .kidmove{animation:k-breathe 4.5s ease-in-out infinite}
.scene[data-emo="פחד"] .kidmove{animation:k-tremble .11s linear infinite alternate}
.scene[data-emo="דאגה"] .kidmove{animation:k-pace 3s ease-in-out infinite}
.scene[data-emo="כעס"] .kidmove{animation:k-stomp .55s ease-in-out infinite}
.scene[data-emo="עצב"] .kidmove{animation:k-slump 4s ease-in-out infinite}
.scene[data-emo="בושה"] .kidmove{animation:k-shrink 3s ease-in-out infinite}
.scene[data-emo="תסכול"] .kidmove{animation:k-stomp .9s ease-in-out infinite}
@keyframes k-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(calc(1 - .05 * var(--k)))}50%{transform:translateY(calc(-30px * var(--k))) scaleY(1.02)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,1.035)}}
@keyframes k-tremble{from{transform:translateX(calc(-3px * var(--k)))}to{transform:translateX(calc(3px * var(--k)))}}
@keyframes k-pace{0%,100%{transform:translateX(calc(-20px * var(--k)))}50%{transform:translateX(calc(20px * var(--k)))}}
@keyframes k-stomp{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(calc(-9px * var(--k))) rotate(calc(-3deg * var(--k)))}60%{transform:translateY(0) rotate(calc(3deg * var(--k)))}}
@keyframes k-slump{0%,100%{transform:translateY(calc(5px * var(--k))) rotate(-1.5deg)}50%{transform:translateY(calc(7px * var(--k))) rotate(1.5deg)}}
@keyframes k-shrink{0%,100%{transform:scale(calc(1 - .07 * var(--k)))}50%{transform:scale(calc(1 - .09 * var(--k))) translateX(-2px)}}
/* face life: blinking and looking around */
.scene .k-eyes{transform-box:fill-box;transform-origin:center;animation:k-blink 4.2s infinite}
.scene .k-look{animation:k-look 6s ease-in-out infinite}
.scene .k-tear{animation:k-fall 1.6s ease-in infinite}
.scene .k-sweat{animation:k-fall 2s ease-in infinite}
.scene .k-d2{animation-delay:.8s}
.scene .k-steam circle{animation:k-rise 1.4s ease-out infinite}
.scene .k-steam circle:nth-child(even){animation-delay:.7s}
.scene .k-stars path{transform-box:fill-box;transform-origin:center;animation:k-twinkle 1.2s ease-in-out infinite}
.scene .k-stars path:nth-child(2n){animation-delay:.6s}
.scene .tzitzit{animation:k-swing 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
/* weather and background */
.scene .sky-gray,.scene .sky-hot,.scene .sky-night,.scene .sky-dim,.scene .night,.scene .darkclouds,.scene .rain,.scene .heat,.scene .storm,.scene .birds,.scene .rainbow{opacity:0;transition:opacity 1.1s}
.scene .sun{transition:opacity 1.1s;opacity:1}
.scene .rays{transform-box:fill-box;transform-origin:center;animation:k-spin 24s linear infinite}
.scene .cloud{animation:k-drift 26s ease-in-out infinite alternate}
.scene .c2{animation-duration:34s;animation-direction:alternate-reverse}
.scene .rain line{animation:k-rain .6s linear infinite}
.scene .tw{animation:k-twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .bolt{animation:k-flash 2.4s infinite}
.scene .birds path{animation:k-fly 9s linear infinite}
.scene .flower .fl{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.45);transition:transform 1s cubic-bezier(.34,1.56,.64,1)}
.scene .tree{transform-box:fill-box;transform-origin:50% 100%}
.scene[data-emo="שמחה"] .rainbow{opacity:calc(var(--k) * 1.2 - .15)}
.scene[data-emo="שמחה"] .birds{opacity:calc(var(--k) * 1.5 - .3)}
.scene[data-emo="שמחה"] .flower .fl{transform:scale(calc(.5 + .8 * var(--k)))}
.scene[data-emo="רוגע"] .flower .fl{transform:scale(.8)}
.scene[data-emo="עצב"] .sky-gray{opacity:calc(.15 + .7 * var(--k))}
.scene[data-emo="עצב"] .darkclouds{opacity:calc(var(--k) * 1.3)}
.scene[data-emo="עצב"] .rain{opacity:calc((var(--k) - .3) * 1.7)}
.scene[data-emo="עצב"] .sun{opacity:calc(1 - 1.2 * var(--k))}
.scene[data-emo="עצב"] .flower .fl{transform:scale(.35) rotate(18deg)}
.scene[data-emo="דאגה"] .sky-gray{opacity:calc(.1 + .45 * var(--k))}
.scene[data-emo="דאגה"] .darkclouds{opacity:calc(var(--k) * .8)}
.scene[data-emo="דאגה"] .sun{opacity:calc(1 - .8 * var(--k))}
.scene[data-emo="דאגה"] .tree{animation:k-wind 1.5s ease-in-out infinite}
.scene[data-emo="פחד"] .sky-night{opacity:calc(.2 + .75 * var(--k))}
.scene[data-emo="פחד"] .night{opacity:calc(var(--k) * 1.4)}
.scene[data-emo="פחד"] .sun{opacity:calc(1 - 1.4 * var(--k))}
.scene[data-emo="פחד"] .tree{animation:k-wind 2.4s ease-in-out infinite}
.scene[data-emo="כעס"] .sky-hot{opacity:calc(.1 + .65 * var(--k))}
.scene[data-emo="כעס"] .heat{opacity:calc(var(--k) - .25)}
.scene[data-emo="כעס"] .flower .fl{transform:scale(.4)}
.scene[data-emo="בושה"] .sky-dim{opacity:calc(.1 + .8 * var(--k))}
.scene[data-emo="תסכול"] .storm{opacity:calc(var(--k) * 1.3 - .1)}
.scene[data-emo="תסכול"] .sky-gray{opacity:calc(.35 * var(--k))}
@keyframes k-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

@keyframes k-rise{0%{transform:translateY(8px) scale(.6);opacity:0}30%{opacity:.95}100%{transform:translateY(-26px) scale(1.2);opacity:0}}
@keyframes k-twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.6}50%{transform:scale(1.2) rotate(20deg);opacity:1}}

const ArtSync = {
  db: null, uid: null, status: 'connecting', err: '', last: 0, timer: null, sent: {}, unsub: null, busy: false,
  async init(){
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { this.status = 'none'; return ui(); }
      this.db = db; this.uid = uid;
      await this.pull();
      this.unsub = this.col().onSnapshot(snap => this.onRemote(snap), e => { if (e && e.code === 'revoked') { this.status = 'none'; ui(); } });
    } catch(e){ this.status = 'error'; this.err = (e && (e.message || e.code)) || String(e); }
    ui(); render();
  },
  col(){ return this.db.collection('data/users/' + this.uid); },
  fromDocs(docs){
    const meta = docs.find(d => d.id === 'meta'); if (!meta) return null;
    const m = meta.data() || {};
    const byId = Object.fromEntries(docs.filter(d => d.id.startsWith('s_')).map(d => [d.id.slice(2), d.data()]));
    const order = Array.isArray(m.order) ? m.order : Object.keys(byId);
    return {version: 1, updatedAt: m.updatedAt || 0, students: order.map(id => byId[id]).filter(Boolean).map(x => fix(JSON.parse(JSON.stringify(x))))};
  },
  adopt(remote){ S = remote; ls.set(KEY, S); this.sent = Object.fromEntries(S.students.map(s => [s.id, JSON.stringify(s)])); },
  async pull(){
    const snap = await this.col().get();
    const remote = this.fromDocs(snap.docs);
    if (remote && remote.updatedAt > (S.updatedAt || 0)) { this.adopt(remote); if (S.students.length) toast('נטענו הנתונים העדכניים'); }
    else if (!remote || remote.updatedAt < (S.updatedAt || 0)) { await this.push(); }
    else this.sent = Object.fromEntries(S.students.map(s => [s.id, JSON.stringify(s)]));
    this.status = 'ok'; this.last = Date.now(); ui();
  },
  onRemote(snap){
    if (this.busy || snap.metadata.hasPendingWrites) return;
    const remote = this.fromDocs(snap.docs);
    if (remote && remote.updatedAt > (S.updatedAt || 0)) { this.adopt(remote); this.last = Date.now(); render(); toast('עודכן ממכשיר אחר'); }
  },
  async push(){
    if (!this.db) return;
    this.busy = true;
    try {
      const col = this.col(), ids = new Set(S.students.map(s => s.id));
      for (const s of S.students) { const j = JSON.stringify(s); if (this.sent[s.id] !== j) { await col.doc('s_' + s.id).set(JSON.parse(j)); this.sent[s.id] = j; } }
      for (const id of Object.keys(this.sent)) if (!ids.has(id)) { await col.doc('s_' + id).delete(); delete this.sent[id]; }
      await col.doc('meta').set({updatedAt: S.updatedAt || Date.now(), order: S.students.map(s => s.id)});
      this.status = 'ok'; this.last = Date.now(); this.err = '';
    } catch(e){ this.status = 'error'; this.err = e.code === 'quota_exceeded' ? 'נגמר המקום לשמירה' : (e.message || e.code); }
    this.busy = false; ui();
  },
  schedule(){ if (!this.db) return ui(); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1200); }
};

function route(){ const h = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent); return {r: h[0] || 'home', id: h[1], sub: h[2], x: h[3]}; }
let timers = [];
function clearTimers(){ timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
function isLocked(){ return WEB && !ARTIFACT && !LITE && !Cloud.account; }
function lockView(){
  const nc = Cloud.status === 'noconfig';
  return {title:'כניסה', html:`<div style="min-height:70vh;display:grid;place-items:center"><div class="panel" style="max-width:420px;text-align:center;padding:34px 26px">
    <div style="width:72px;height:72px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;font-size:38px;background:#ffda2a">🧠</div>
    <h2 style="margin:0 0 8px">CBT בבית הספר</h2><p class="muted" style="margin:0 0 20px">${nc ? 'האפליקציה עדיין לא הוגדרה להתחברות.' : 'האפליקציה פרטית. נכנסים עם חשבון המיקרוסופט של הבעלים.'}</p>
    ${nc ? '' : '<button class="btn primary" data-act="cloud-login" style="width:100%;padding:12px">🔑 כניסה עם חשבון מיקרוסופט</button>'}
    ${Cloud.err ? `<p class="note danger" style="margin:14px 0 0;font-size:13px;text-align:start">הכניסה לא הושלמה: ${esc(Cloud.err)}</p>` : ''}</div></div>`};
}
function render(){
  clearTimers();
  const R = route();
  document.body.classList.toggle('locked', isLocked());
  if (isLocked()) { const o = lockView(); $('#title').textContent = ''; $('#view').innerHTML = `<div class="page">${o.html}</div>`; document.title = 'CBT בבית הספר'; return; }
  if (WEB && !ARTIFACT && !LITE && !PROBLEMS.length) { $('#title').textContent = ''; $('#view').innerHTML = `<div class="empty" style="padding-top:120px"><span class="big">⏳</span>${Cloud.status === 'error' ? esc(Cloud.err) + ' <br><br><button class="btn primary" data-act="cloud-retry">נסו שוב</button>' : 'טוען את התוכן מ-OneDrive…'}</div>`; return; }
  const views = LITE ? {home: liteHome, problems, problem: problemView, tools, tool: toolView, settings: liteSettings, ask, workflow, roles: rolesView, circ: circView, circsrc: circSrcView, libsrc: libSrcView, circask: circAskView, find: findView, more: moreView, games: gamesView, game: gameView, tracks: tracksView, track: trackView, groups: groupsView, transitions: hubView, newteachers: hubView, programs: hubView, videos: videosView} : {home, problems, problem: problemView, students, student: studentView, tools, tool: toolView, library, settings, ask, workflow, roles: rolesView, circ: circView, circsrc: circSrcView, libsrc: libSrcView, circask: circAskView, find: findView, more: moreView, games: gamesView, game: gameView, tracks: tracksView, track: trackView, groups: groupsView, transitions: hubView, newteachers: hubView, programs: hubView, videos: videosView};
  const fn = views[R.r] || home;
  const out = fn(R);
  $('#title').textContent = out.title;
  $('#view').innerHTML = `<div class="page">${out.html}</div>`;
  const navKey = {problem:'problems', student:'students', tool:'tools', circsrc:'circ', libsrc:'library', circask:'circ'}[R.r] || R.r;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));
  document.title = out.title + ' · CBT בבית הספר';
  if (out.after) out.after();
  ui();
}
window.addEventListener('hashchange', () => { aiFast = !ARTIFACT; if (aiCtl) aiCtl.abort(); render(); window.scrollTo({top:0}); });

/* ================= shared pieces ================= */
function problemCard(p, i){
  return `<a class="card accent" href="#/problem/${p.id}" style="--h:${hueOf(p.area) }">
    <span class="emoji">${p.icon}</span><span class="name">${esc(p.name)}</span>
    <span class="sub">${esc(p.summary)}</span>
    <span class="row"><span class="pill">${esc(p.area)}</span><span class="pill">${p.sessions.length} מפגשים</span></span></a>`;
}
function studentCard(s){
  const next = s.plan.find(x => !x.done);
  const probs = s.problems.map(id => P[id]).filter(Boolean);
  return `<a class="card accent" href="#/student/${s.id}" style="--h:${hueOf(s.alias)}">
    <span class="emoji">${probs[0] ? probs[0].icon : '🧒'}</span>
    <span class="name">${esc(s.alias)} <span class="muted" style="font-weight:400">· כיתה ${esc(s.grade || '?')}${s.classroom ? ' ' + esc(s.classroom) : ''}</span></span>
    <span class="sub">${probs.map(p => esc(p.name)).join(' · ') || 'לא הוגדרה בעיה'}</span>
    <span class="sub">${next ? '⏭️ הבא: ' + esc(next.title) : s.plan.length ? '✅ התוכנית הושלמה' : 'אין עדיין תוכנית טיפול'}</span>
    <span class="row"><span class="pill">${s.sessions.length} מפגשים</span>${s.sessions.length ? `<span class="pill">אחרון: ${fmtDate(s.sessions.slice().sort((a,b)=>a.date<b.date?1:-1)[0].date)}</span>` : ''}</span></a>`;
}
// a notebook page that holds a file opens the file itself, not the page printout (files outside the notebook are their own pdf)
const OPENABLE = /\.(pdf|docx?|pptx?|xlsx?|rtf|txt)$/i;
function mainFile(p){
  if (p.src === 'dropbox' || p.src === 'dnew' || p.src === 'circ') return null;
  const at = (p.attachments || []).filter(a => OPENABLE.test(a.path || a.name || ''));
  const rank = a => /\.pdf$/i.test(a.path) ? 0 : /\.docx?$/i.test(a.path) ? 1 : /\.pptx?$/i.test(a.path) ? 2 : 3;
  return at.length ? at.slice().sort((a, b) => rank(a) - rank(b))[0] : null;
}
function moreView(){
  const items = NAV.filter(n => !(LITE && ['students', 'library'].includes(n[0]))).concat([['find', '🔍', 'חיפוש באתר']]);
  return {title: 'כל האזורים', html: `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">${items.map(([k, i, l]) => `<a class="card" href="#/${k}" style="padding:14px;gap:6px;align-items:center;text-align:center"><span style="font-size:30px">${i}</span><span class="name" style="font-size:16px">${l}</span></a>`).join('')}</div>`};
}
function libItem(p){
  const first = mainFile(p) || (!p.pdf && p.attachments[0]);
  const open = first ? `data-act="attopen" data-path="${esc(first.path)}"` : p.pdf ? `data-act="libopen" data-pdf="${esc(p.pdf)}"` : '';
  return `<div class="lib-item" ${open} data-title="${esc(first ? first.name : p.title)}">
    <span style="font-size:22px">${topicIcon(p.topic)}</span>
    <div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${esc(topicName(p.topic))}${p.src ? ' · ' + esc(p.sub ? p.section + ' › ' + p.sub : p.section) : ''}</div></div>
    ${p.attachments.map(a => { const [c, l] = ftype(a.name); if (VIDEO_RX.test(a.path)) return `<a class="ft vid" href="${href(a.path)}" data-act="vplay" data-k="file" data-src="${esc(a.path)}" data-title="${esc(a.name)}" title="${esc(a.name)}">▶ וידאו</a>`; return `<a class="ft ${c}" href="${href(a.path)}" target="_blank" data-act="attopen" data-path="${esc(a.path)}" data-title="${esc(a.name)}" title="${esc(a.name)}">${l}</a>`; }).join(' ')}
    ${first && p.pdf ? `<a class="ft" href="${href(p.pdf)}" target="_blank" data-act="libopen" data-pdf="${esc(p.pdf)}" data-title="${esc(p.title)}" title="דף המחברת עצמו">📓</a>` : ''}
  </div>`;
}
function ul(arr){ return arr && arr.length ? `<ul class="clean">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted">—</p>'; }
function chart(points, max = 10, label = ''){
  if (points.length < 2) return `<p class="muted">הגרף יופיע אחרי שני רישומים לפחות.</p>`;
  const W = 600, H = 190, pad = 30, n = points.length;
  const x = i => pad + i * (W - pad * 2) / (n - 1), y = v => H - pad - (v / max) * (H - pad * 2);
  const d = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const grid = [0, max/2, max].map(v => `<line class="axis" x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${W-pad+6}" y="${y(v)+4}">${v}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${grid}<path class="ln" d="${d}"/>
    ${points.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="5"><title>${esc(p.t)}: ${p.v}</title></circle>`).join('')}
    <text class="lbl" x="${pad}" y="${H-8}">${esc(points[0].t)}</text><text class="lbl" x="${W-pad}" y="${H-8}" text-anchor="end">${esc(points[n-1].t)}</text></svg>`;
}

  const month = today().slice(0, 7);
  const sessMonth = act.reduce((n, s) => n + s.sessions.filter(x => (x.date || '').startsWith(month)).length, 0);

  let h = `<section class="hero withkid"><div class="heromascot" aria-hidden="true"><div class="hsay">שלום! בוא נתחיל 😊</div>${kidMini('שמחה', 6, 'wave')}</div><h1>שלום! במה נטפל היום? 👋</h1>

  if (a) h += `<h2 class="sec">⭐ בעבודה עכשיו</h2><div class="grid wide">${studentCard(a)}</div>`;
  h += `<h2 class="sec">🧒 התלמידים שלי <small>${act.length}</small></h2>`;
  h += act.length ? `<div class="grid">${act.slice(0, 8).map(studentCard).join('')}</div>` : `<div class="panel empty"><span class="big">🌱</span>עוד אין תלמידים. <button class="btn primary" data-act="newstudent">＋ הוספת תלמיד ראשון</button></div>`;
  h += `<h2 class="sec">🧭 מפות טיפול <small>לפי תחום</small></h2><div class="grid">${PROBLEMS.slice(0, 8).map(problemCard).join('')}</div>
    <div style="margin-top:12px"><a class="btn" href="#/problems">לכל ${PROBLEMS.length} הבעיות ←</a></div>`;
  h += `<h2 class="sec">🧰 כלים לשימוש בחדר</h2><div class="grid">${TOOLS.slice(0, 4).map(toolCard).join('')}</div>`;

let areaFilter = 'הכל', probQuery = '';
function problems(){
  const ql = probQuery.toLowerCase();
  const list = PROBLEMS.filter(p => (areaFilter === 'הכל' || p.area === areaFilter) &&
    (!ql || (p.name + ' ' + p.summary + ' ' + (p.signs || []).join(' ')).toLowerCase().includes(ql)));
  let h = `<div class="search" style="margin:4px 0 14px"><input id="probq" placeholder="חיפוש בעיה, סימן או מילת מפתח…" value="${esc(probQuery)}"><span class="ic">🔍</span></div>
    <div class="chips">${['הכל', ...AREAS].map(a => `<button class="chip ${a === areaFilter ? 'on' : ''}" data-act="area" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>`;
  if (!PROBLEMS.length) h += `<div class="panel empty"><span class="big">⏳</span>תוכן מפות הטיפול עדיין לא נטען.</div>`;
  const groups = AREAS.map(a => [a, list.filter(p => p.area === a)]).filter(g => g[1].length);
  for (const [a, ps] of groups) h += `<h2 class="sec">${esc(a)} <small>${ps.length}</small></h2><div class="grid">${ps.map(problemCard).join('')}</div>`;
  if (PROBLEMS.length && !list.length) h += `<div class="empty"><span class="big">🔎</span>לא נמצאה בעיה מתאימה</div>`;
  return {title:'מנווט בעיות', html:h, after(){ const i = $('#probq'); i.addEventListener('input', () => { probQuery = i.value; const pos = i.selectionStart; render(); const j = $('#probq'); j.focus(); j.setSelectionRange(pos, pos); }); }};
}

function sessionHTML(s, i, extra = ''){
  return `<details class="sess ${s.done ? 'done' : ''}" ${extra.includes('open') ? 'open' : ''}><summary><span class="n">${s.done ? '✓' : i + 1}</span><span>${esc(s.title)}</span>${s.date ? `<span class="pill">${fmtDate(s.date)}</span>` : ''}<span class="chev">‹</span></summary>
    <div class="body"><div><h4>🎯 מטרות</h4>${ul(s.goals)}</div><div><h4>🧩 פעילויות</h4>${ul(s.activities)}</div>
    <div><h4>🏠 משימת בית</h4><p style="margin:0">${esc(s.homework || '—')}</p></div>
    <div>${s.tool && TOOL[s.tool] ? `<h4>🧰 כלי במפגש</h4><a class="btn sm" href="#/tool/${s.tool}">${TOOL[s.tool].icon} ${TOOL[s.tool].name}</a>` : ''}</div>${extra.replace('open','')}</div></details>`;
}
function problemSections(p){
  const m = p.model || {};
  return {
    overview: `<div class="panel"><h3>📌 בקצרה</h3><p style="margin:0">${esc(p.summary)}</p></div>
      <div class="panel"><h3>👀 סימנים בבית הספר ובבית</h3>${ul(p.signs)}</div>
      <div class="panel"><h3>🧠 המשגה – המודל הקוגניטיבי-התנהגותי</h3>
        <div class="model"><div class="box trig"><b>⚡ מצבים מעוררים</b>${esc((m.triggers || []).join(' · '))}</div>
        <div class="box t"><b>💭 מחשבות</b>${ul(m.thoughts)}</div><div class="box f"><b>❤️ רגשות</b>${ul(m.feelings)}</div>
        <div class="box b"><b>🫀 גוף</b>${ul(m.body)}</div><div class="box a"><b>🏃 התנהגות</b>${ul(m.behaviors)}</div></div>
        ${m.maintaining ? `<p class="note" style="margin:12px 0 0"><b>🔁 מה משמר את הבעיה:</b> ${esc(m.maintaining)}</p>` : ''}</div>
      <div class="panel"><h3>🎯 יעדי טיפול</h3>${ul(p.goals)}</div>
      <div class="panel" style="border-color:color-mix(in srgb,var(--danger) 40%,var(--line))"><h3>🚩 מתי להפנות</h3>${ul(p.redFlags)}</div>`,
    assess: `<div class="panel"><h3>🔍 הערכה ואבחון</h3>${ul(p.assessment)}</div>`,
    sessions: `<p class="muted no-print">${p.sessions.length} מפגשים. לחיצה על מפגש פותחת את הפירוט.</p>${p.sessions.map((s, i) => sessionHTML(s, i)).join('')}`,
    techniques: `<div class="grid wide">${(p.techniques || []).map(t => `<div class="panel" style="margin:0"><h3>🛠️ ${esc(t.name)}</h3><p style="margin:0">${esc(t.how)}</p></div>`).join('')}</div>`,
    partners: `<div class="two"><div class="panel" style="margin:0"><h3>👨‍👩‍👧 עבודה עם ההורים</h3>${ul(p.parents)}</div><div class="panel" style="margin:0"><h3>🏫 הנחיות למחנכ/ת ולצוות</h3>${ul(p.teachers)}</div></div>`,
    sources: `<div class="panel"><h3>📖 מקורות ותוכניות מבוססות מחקר</h3>${ul(p.sources)}</div>`
  };
}
function problemView(R){
  const p = P[R.id]; if (!p) return {title:'לא נמצא', html:'<div class="empty">הבעיה לא נמצאה. <a href="#/problems">חזרה</a></div>'};
  const tab = R.sub || 'overview';
  const sec = problemSections(p);
  const lib = libMatches(p.libraryKeywords);
  const TABS = [['overview','סקירה'],['assess','הערכה'],['sessions','מהלך המפגשים'],['techniques','טכניקות'],['partners','הורים וצוות'],['roles','מי עושה מה'],['tools','כלים'],['library',`מהספרייה (${lib.length})`]];
  let body;
  if (tab === 'print') body = `<div class="print-only"><h1>${esc(p.name)}</h1></div>` + ['overview','assess','sessions','techniques','partners','sources'].map(k => sec[k]).join('') + `<div class="panel"><h3>👥 מי עושה מה</h3>${mapRolesHTML(p)}</div>`;
  else if (tab === 'roles') body = `<div class="panel"><h3>👥 מי עושה מה במקרה הזה</h3>${mapRolesHTML(p)}</div>`;
  else if (tab === 'tools') body = `<div class="grid">${(p.tools || []).filter(t => TOOL[t]).map(t => toolCard(TOOL[t])).join('') || '<p class="muted">—</p>'}</div>`;
  else if (tab === 'library') body = lib.length ? `<p class="muted">${lib.length} פריטים, הרלוונטיים ביותר קודם.${lib.length > 60 ? ' מוצגים 60 הראשונים.' : ''}</p><div class="list">${lib.slice(0, 60).map(libItem).join('')}</div>` : `<div class="empty">${LIBDATA.length ? 'לא נמצאו חומרים מתאימים בספרייה.' : '📚 חומרי הספרייה לנושא הזה זמינים במחשב, בקיצור הדרך ״ספריית לימודי CBT״.'}</div>`;
  else body = (tab === 'overview' && window.CYCLES && CYCLES[p.id] ? `<div class="panel"><h3>🔄 המעגל שמשמר את הבעיה – ואיך שוברים אותו</h3>${cycleHTML(CYCLES[p.id])}</div>` : '') + (sec[tab] || sec.overview) + (tab === 'overview' ? sec.sources : '');
  const h = `<a class="back no-print" href="#/problems">→ כל הבעיות</a>
    <div class="banner" style="--h:${hueOf(p.area)}"><span class="emoji">${p.icon}</span><div><div style="opacity:.85;font-size:14px">${esc(p.area)} · כיתות א–ו</div><h1>${esc(p.name)}</h1></div>
    <div class="actions no-print">${TRACK(p.id) ? `<a class="btn primary" href="#/track/${p.id}">🧭 טיפול מובנה</a>` : ''}${GAME(p.id) ? `<a class="btn primary" href="#/game/${p.id}">🎲 המשחק</a>` : ''}<button class="btn" data-act="planfor" data-id="${p.id}">📋 תוכנית לתלמיד</button><button class="btn" data-act="printproblem" data-id="${p.id}">🖨️ הדפסה</button></div></div>
    <nav class="tabs">${TABS.map(([k, l]) => `<a href="#/problem/${p.id}/${k}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('')}</nav>${body}`;
  return {title:p.name, html:h, after(){ if (tab === 'print') setTimeout(() => { window.print(); history.back(); }, 300); }};

  throw {code: 'invalid_json', message: 'no json', text: t};
}

async function aiCircOnlyRun(q){
  const box = $('#circAi'); if (!box) return;
  aiCtl = new AbortController();
  const busy = t => { box.innerHTML = `<div class="panel" style="border-inline-start:5px solid var(--brand)"><h3>🤖 Claude עונה – רק מתוך חוזרי המנכ״ל</h3><p class="muted" style="margin:0">${esc(t)}</p><div class="actions" style="margin-top:10px"><button class="btn sm" data-act="ai-stop">⏹ עצירה</button></div></div>`; };
  busy('מאתר את המצבים הרלוונטיים בחוזרים…'); box.scrollIntoView({behavior: 'smooth', block: 'start'});
  try {
    const c = await AI.ask(aiCircOnlyClassify(q), {quick: true, signal: aiCtl.signal});
    const local = circSearch(q, {nGuide: 4, nText: 10});
    let cids = Array.isArray(c && c.circIds) ? c.circIds.map(String).filter(circItem).slice(0, 4) : [];
    if (!cids.length) cids = local.guide.slice(0, 2).map(x => x.g.id);
    if (!cids.length && !local.text.length) { box.innerHTML = `<div class="panel"><h3>🤔 החוזרים לא עונים על השאלה הזו</h3><p class="muted" style="margin:0">Claude לא מצא בחוזרי המנכ״ל מענה, ולכן אין כאן ניחוש.</p></div>` + aiGeneralOfferHTML(q, true); return; }
    busy(`מצאתי: ${cids.map(id => '📜 ' + circItem(id).title).join(' · ')}. כותב תשובה מתוך החוזרים בלבד…`);
    const mat = await aiCircMaterial(q, [], false, cids, local, true);
    const ans = await AI.ask(aiCircOnlyPrompt(q, mat), {signal: aiCtl.signal});
    if (ans && typeof ans === 'object') { if (c && c.safety) ans.safety = true; ans._cids = cids; }
    box.innerHTML = aiAnswerHTML(q, ans, [], false).replace('מתוך מפות הטיפול, המדריך וחוזרי המנכ״ל שבאפליקציה בלבד', 'מתוך חוזרי המנכ״ל בלבד');
  } catch(e){
    if (e && e.code === 'cancelled') { box.innerHTML = ''; return; }
    const code = (e && e.code) || 'upstream_error';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) AI.disable(code);
    box.innerHTML = `<div class="note warn" style="margin-bottom:12px">🤖 ${esc(AI_ERR[code] || AI_ERR.upstream_error)}</div>`;
  }
}

const R_LABEL = {teacher:'מורה מקצועי/ת', homeroom:'מחנך/ת הכיתה', counselor:'יועץ/ת', management:'הנהלה ומזכירות', parents:'מי פונה להורים', escalate:'גורמי חוץ ופיקוח'};
function circlesSVG(){
  const rings = [
    {r: 58, label: 'הילד', items: []},
    {r: 118, label: '', items: ['הורים', 'מורים מקצועיים', 'מחנך/ת']},
    {r: 178, label: '', items: ['יועץ/ת', 'מזכירות']},
    {r: 238, label: '', items: ['הנהלה', 'שפ״ח וגורמי חוץ']},
    {r: 298, label: '', items: ['פיקוח']}
  ];
  const C = 310, fills = ['var(--brand)', 'hsl(160 var(--soft-s) var(--soft-l))', 'hsl(200 var(--soft-s) var(--soft-l))', 'hsl(35 var(--soft-s) var(--soft-l))', 'hsl(270 var(--soft-s) var(--soft-l))'];
  let g = '';
  for (let i = rings.length - 1; i >= 0; i--) g += `<circle cx="${C}" cy="${C}" r="${rings[i].r}" fill="${fills[i]}" stroke="var(--panel)" stroke-width="3"/>`;
  g += `<text x="${C}" y="${C + 7}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">הילד</text>`;
  rings.forEach((ring, i) => {
    if (!i) return;
    const mid = (rings[i - 1].r + ring.r) / 2, n = ring.items.length;
    ring.items.forEach((t, k) => {
      const a = -Math.PI / 2 + (k - (n - 1) / 2) * (n > 2 ? 0.95 : 1.1) + (i % 2 ? 0 : Math.PI);
      const x = C + mid * Math.cos(a), y = C + mid * Math.sin(a);
      g += `<text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)">${t}</text>`;
    });
  });
  return `<svg viewBox="0 0 620 620" style="width:100%;max-width:520px;display:block;margin:0 auto" role="img" aria-label="מעגלי הגורמים סביב הילד">${g}</svg>`;
}

    case 'libopen': if (e.target.closest('[data-act="attopen"]')) return; if (WEB) Cloud.openFile(d.pdf); else viewer(d.title, href(d.pdf), 'pdf'); break;

    case 'logfromplan': { const x = s.plan[+d.i]; sessionForm(s, null, {num:String(+d.i + 1), date:x.date || today(), content:x.title + (x.activities.length ? '\n' + x.activities.join('\n') : ''), homework:x.homework}); break; }

    case 'addmeasure': measureForm(s); break;

    case 'asker': ASKER = d.v; ls.set('cbtapp.asker', ASKER); aiFast = !ARTIFACT; render(); break;
    case 'copyq': try { navigator.clipboard.writeText(d.v).then(() => toast('השאלה הועתקה – הדביקו אותה בפרויקט של Claude'), () => {}); } catch(err){} break;
    case 'ai-stop': if (aiCtl) aiCtl.abort(); break;
    case 'ai-retry': if (lastAsk || route().id) aiAnswerRun(route().id || lastAsk); break;
    case 'ai-fast': e.preventDefault(); aiFast = true; render(); break;
    case 'ai-go': aiFast = false; render(); break;
    case 'refine': refineGo(d.v); break;
    case 'refine-back': refineGo(null); break;
    case 'askex': location.hash = '#/ask/' + encodeURIComponent(d.v); break;
    case 'stage': { const st = STAGES.find(x => x.id === d.id); s.stages = s.stages || {}; s.stages[st.id] = !stageDone(s, st); save(); render(); break; }
    // tools
    case 'th-emo': T.emotion = d.v; T.prev = T.level; thUpdate(); break;
    case 'th-lvl': T.prev = T.level; T.level = +d.v; thUpdate(); break;
    case 'br-mode': T.mode = d.v; T.running = false; T.cycles = 0; render(); break;
    case 'br-toggle': T.running = !T.running; render(); break;
    case 'dq': { const i = +d.i; T.q = el.checked ? [...T.q, i] : T.q.filter(x => x !== i); break; }
    case 'tl-add': { const i = $('#tlopt'); if (i.value.trim()) { T.options.push({t:i.value.trim(), v:0}); render(); } break; }
    case 'tl-vote': T.options[+d.i].v = +d.v; render(); break;
    case 'ld-add': { const t = $('#ldtext'); if (!t.value.trim()) return toast('כותבים את המדרגה'); T.steps.push({id:uid(), text:t.value.trim(), suds:+$('#ldsuds').value, done:false}); render(); break; }
    case 'ld-done': { const st = T.steps.find(x => x.id === d.id); st.done = !st.done; render(); if (st.done) { confetti(); if (active() && T.id) toolSave('ladder'); } break; }
    case 'ld-del': T.steps = T.steps.filter(x => x.id !== d.id); render(); break;

    case 'pmr-go': T.running = !T.running; render(); break;
    case 'pmr-reset': T.i = -1; T.phase = ''; T.running = false; render(); break;
    case 'cc-item': T.items = el.checked ? [...T.items, d.v] : T.items.filter(x => x !== d.v); render(); break;
    case 'cc-add': { const i = $('#ccown'); if (i.value.trim()) { T.items.push(i.value.trim()); render(); } break; }
    case 'cc-color': T.color = d.v; render(); break;
    // settings
    case 'sync-create': await Sync.create(); render(); break;
    case 'sync-open': await Sync.open(); render(); break;
    case 'sync-resume': await Sync.resume(); render(); break;
    case 'sync-now': await Sync.pull().catch(err => { Sync.status = 'error'; Sync.err = err.message; }); render(); toast('סונכרן'); break;
    case 'sync-off': if (await uiConfirm('לנתק את קובץ הסנכרון? הנתונים יישארו במחשב הזה.')) { await Sync.disconnect(); render(); } break;
    case 'syncbtn': if (WEB && Cloud.status === 'signedout') Cloud.login(); else if (!WEB && Sync.status === 'permission') { await Sync.resume(); render(); } else location.hash = '#/settings'; break;
    case 'export': { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'גיבוי-CBT-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); break; }
    case 'wipe': if (await uiConfirm('למחוק את כל התלמידים והרישומים מהמחשב הזה?') && await uiConfirm('בטוח? אי אפשר לבטל. אם יש קובץ סנכרון, גם הוא יתעדכן.')) { S = blank(); save(); setActive(null); render(); } break;
    case 'theme': { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'; ls.set('cbtapp.theme', r.dataset.theme); break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
  const v = el.dataset.num ? +el.value : el.value;
  if (b.startsWith('T.')) { const k = b.slice(2); T[k] = v; const lab = $('#v-' + k); if (lab) lab.textContent = v; if (el.tagName === 'SELECT' || (el.type === 'range' && false)) render(); }
  if (b.startsWith('plan.')) { const s = student(el.dataset.s); if (s) { s.plan[+el.dataset.i][b.slice(5)] = v; save(); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'who') { setActive(el.value); render(); if (el.value) toast('⭐ עבודה עם ' + active().alias); }
  if (el.dataset && el.dataset.bind && el.tagName === 'SELECT' && el.dataset.bind.startsWith('T.')) render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function addPlanFrom(s, pid){
  const p = P[pid]; if (!p || !s) return;
  if (!s.problems.includes(pid)) s.problems.push(pid);
  if (!s.goals.length) s.goals = (p.goals || []).slice();
  p.sessions.forEach(x => s.plan.push({title:x.title, goals:(x.goals || []).slice(), activities:(x.activities || []).slice(), homework:x.homework || '', tool:x.tool || null, done:false, date:'', notes:'', from:pid}));
  save();
}

/* ================= therapeutic games: one integrative game per treatment problem, each with its own link (#/game/<id>) =================
   Content lives in app/games-data.js (window.GAMES). A game = stages; each stage has a type: sort · match · story · detective · catch · ladder · wheel · board */
const GAMES = () => { const m = new Map(); (window.GAMES || []).forEach(g => m.set(g.id, g)); return [...m.values()]; };   // content may load twice on the web – one card per game
const GAME = id => GAMES().find(g => g.id === id);
let GS = {};                                   // progress per game during this visit
let GTIMERS = [];                              // running timers of the catch game – cleared whenever the view changes
const gClear = () => { GTIMERS.forEach(t => { clearTimeout(t); clearInterval(t); }); GTIMERS = []; };
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const pickOne = a => a[Math.floor(Math.random() * a.length)];
// the same Hardal boy as in the thermometer, head only – a small guide who reacts to the game
function kidMini(emotion, level, cls = ''){
  const F = kidFace(emotion, level);
  return `<svg class="kidmini ${cls}" viewBox="14 0 172 206" aria-hidden="true"><defs>${KID_DEFS}</defs>
    <path d="M30,206 Q34,176 100,170 Q166,176 170,206Z" fill="url(#kTee)"/>
    <path d="M44,206 Q48,180 90,174 L90,206Z M156,206 Q152,180 110,174 L110,206Z" fill="url(#kVest)" stroke="#cfc3ad"/>
    <path d="M44,206 Q48,180 90,174 L90,206Z M156,206 Q152,180 110,174 L110,206Z" fill="url(#kQuilt)" opacity=".8"/>
    <path d="M86,172 Q100,182 114,172" fill="none" stroke="#1b2640" stroke-width="5"/>
    <rect x="88" y="160" width="24" height="16" rx="7" fill="url(#kSkin)"/>
    ${kidHead(F)}</svg>`;
}const gGuide = (say, emo = 'שמחה', lvl = 4) => `<div class="gguide"><div class="gface">${kidMini(emo, lvl)}</div><div class="gsay pop">${say}</div></div>`;
function gConfetti(){
  const box = document.createElement('div'); box.className = 'gconf';
  box.innerHTML = Array.from({length: 26}, (_, i) => `<i style="left:${Math.random() * 100}%;animation-delay:${(Math.random() * .6).toFixed(2)}s;background:hsl(${Math.random() * 360} 85% 60%)"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 2600);
}
const gStar = g => { const s = GS[g.id]; s.stars = (s.stars || 0) + 1; };
const gDoneBox = (g, text, again = true) => `<div class="gdone pop"><div style="font-size:54px">🏆</div><h3>${text}</h3><div class="actions" style="justify-content:center">${again ? `<button class="btn" data-act="g-again">🔁 שוב</button>` : ''}${GS[g.id].stage < g.stages.length - 1 ? `<button class="btn primary" data-act="g-stage" data-v="${GS[g.id].stage + 1}">לשלב הבא ◀</button>` : ''}</div></div>`;

/* ---------- the eight game types ---------- */
const GM = {
  sort: {
    init: d => ({order: shuffle(d.cards.map((_, i) => i)), i: 0, ok: 0, fb: null}),
    render(g, d, st){
      if (st.i >= st.order.length) return gGuide(`סיימת! ${st.ok} מתוך ${st.order.length} נכון.`, 'שמחה', 8) + gDoneBox(g, 'כל הכבוד – מיינת את כל הכרטיסים!');
      const c = d.cards[st.order[st.i]];
      return `${st.fb ? gGuide(esc(st.fb.ok ? '👍 ' + (c.why || 'נכון!') : '🤔 ' + (c.why || 'כמעט…') + (st.fb.ok ? '' : ` (התשובה: ${esc(d.bins.find(b => b.id === c.bin).label)})`)), st.fb.ok ? 'שמחה' : 'דאגה', st.fb.ok ? 7 : 3) : gGuide(esc(d.prompt || 'לאן שייך הכרטיס?'), 'רוגע', 3)}
        <div class="gprog"><i style="width:${Math.round(100 * st.i / st.order.length)}%"></i></div>
        <div class="gcard ${st.fb ? (st.fb.ok ? 'ok' : 'no') : 'pop'}">${esc(c.t)}</div>
        <div class="gbins">${d.bins.map(b => `<button class="gbin" style="--c:${b.color || '#60a5fa'}" data-act="g-sort" data-v="${esc(b.id)}" ${st.fb ? 'disabled' : ''}><span>${b.icon || ''}</span>${esc(b.label)}</button>`).join('')}</div>
        ${st.fb ? `<div class="actions" style="justify-content:center"><button class="btn primary" data-act="g-next">הבא ◀</button></div>` : ''}`;
    }
  },
  match: {
    init: d => ({deck: shuffle(d.pairs.flatMap((p, k) => [{k, t: p.a, s: 'a'}, {k, t: p.b, s: 'b'}])), open: [], got: [], moves: 0}),
    render(g, d, st){
      const done = st.got.length === st.deck.length;
      return `${gGuide(done ? `מצאת את כל הזוגות ב-${st.moves} ניסיונות!` : esc(d.prompt || 'הופכים שני קלפים ומחפשים זוג שמתאים'), done ? 'שמחה' : 'רוגע', done ? 8 : 3)}
        <div class="gmem">${st.deck.map((c, i) => { const up = st.open.includes(i) || st.got.includes(i); return `<button class="gm ${up ? 'up' : ''} ${st.got.includes(i) ? 'got' : ''}" data-act="g-flip" data-i="${i}"><span class="f back">❓</span><span class="f front ${c.s}">${esc(c.t)}</span></button>`; }).join('')}</div>
        ${done ? `<div class="panel" style="margin-top:12px"><h3>🔎 מה למדנו</h3><ul class="clean">${d.pairs.map(p => `<li><b>${esc(p.a)}</b> ↔ ${esc(p.b)}${p.why ? ` – <span class="muted">${esc(p.why)}</span>` : ''}</li>`).join('')}</ul></div>${gDoneBox(g, 'זיכרון של אלופים!')}` : ''}`;
    }
  },
  story: {
    init: d => ({node: d.start, pend: null}),
    render(g, d, st){
      const n = d.nodes[st.node], m = n.mood || ['רוגע', 3];
      if (st.pend) return `${gGuide(esc(st.pend.fb || ''), st.pend.good ? 'שמחה' : 'דאגה', st.pend.good ? 6 : 5)}<div class="actions" style="justify-content:center"><button class="btn primary" data-act="g-next">המשך ◀</button></div>`;
      return `<div class="gstory pop"><div class="gface big">${kidMini(m[0], m[1])}</div><div class="gtext">${esc(n.text)}</div></div>
        ${n.end ? gDoneBox(g, esc(n.title || 'סוף הסיפור')) : `<div class="gchoices">${n.choices.map((c, i) => `<button class="gchoice" data-act="g-choice" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>`}`;
    }
  },
  detective: {
    init: d => ({phase: 'clues', order: shuffle(d.clues.map((_, i) => i)), i: 0, ok: 0, fb: null, pick: null}),
    render(g, d, st){
      const head = `<div class="gcase"><div>🗂️ <b>התיק:</b> ${esc(d.case)}</div><div class="gthought">💭 ״${esc(d.thought)}״</div></div>`;
      if (st.phase === 'clues') {
        if (st.i >= st.order.length) { st.phase = 'balance'; return GM.detective.render(g, d, st); }
        const c = d.clues[st.order[st.i]];
        return `${head}${st.fb ? gGuide(esc(st.fb.ok ? '🔍 נכון! ' + (c.why || '') : '🔍 בוא נבדוק שוב: ' + (c.why || '')), st.fb.ok ? 'שמחה' : 'דאגה', st.fb.ok ? 6 : 3) : gGuide('בלש, האם הרמז הזה <b>תומך</b> במחשבה, או <b>לא תומך</b> בה?', 'רוגע', 3)}
          <div class="gprog"><i style="width:${Math.round(100 * st.i / st.order.length)}%"></i></div>
          <div class="gcard clue ${st.fb ? (st.fb.ok ? 'ok' : 'no') : 'pop'}">🔎 ${esc(c.t)}</div>
          <div class="gbins"><button class="gbin" style="--c:#f97316" data-act="g-clue" data-v="for" ${st.fb ? 'disabled' : ''}><span>📌</span>תומך במחשבה</button><button class="gbin" style="--c:#22c55e" data-act="g-clue" data-v="against" ${st.fb ? 'disabled' : ''}><span>❌</span>לא תומך</button></div>
          ${st.fb ? `<div class="actions" style="justify-content:center"><button class="btn primary" data-act="g-next">הרמז הבא ◀</button></div>` : ''}`;
      }
      const p = st.pick != null ? d.options[st.pick] : null, lvl = p && p.good ? (d.after ?? 3) : (d.before ?? 8);
      return `${head}<div class="gdet">${gGuide(p ? esc(p.fb || '') : 'אספנו את כל הרמזים. איזו מחשבה <b>מאוזנת ונכונה יותר</b>?', d.emotion || 'דאגה', lvl)}
        <div class="gmeter"><span>${esc(d.emotion || 'הרגש')}</span><div class="bar"><i style="width:${lvl * 10}%;background:${lvlColor(lvl)}"></i></div><b>${lvl}</b></div></div>
        <div class="gchoices">${d.options.map((o, i) => `<button class="gchoice ${st.pick === i ? (o.good ? 'ok' : 'no') : ''}" data-act="g-opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
        ${p && p.good ? gDoneBox(g, 'פתרת את התיק! המחשבה החדשה הורידה את הרגש.') : ''}`;
    }
  },

const gCur = () => { const g = GAME(route().id), G0 = GS[g.id], s = g.stages[G0.stage]; return {g, G0, s, d: s.data, st: G0.st[G0.stage]}; };
function catchRun(g, d, st){
  const ar = $('#gArena'); if (!ar) return;
  let left = d.seconds || 50;
  const pool = shuffle(d.helpful.map(t => ({t, good: true})).concat(d.unhelpful.map(u => ({t: u.t, alt: u.alt, good: false}))));
  let k = 0;
  const spawn = () => {
    const it = pool[k++ % pool.length], b = document.createElement('button');
    b.className = 'gbub'; b.textContent = it.t; b.style.left = (4 + Math.random() * 58) + '%'; b.style.animationDuration = (d.speed || 11) + 's';
    b.onclick = () => {

      else { st.reframes.push({t: it.t, alt: it.alt}); b.textContent = '✨ ' + it.alt; b.classList.add('flip'); $('#gRf').textContent = st.reframes.length; setTimeout(() => b.remove(), 2600); }
    };

  };
  spawn(); GTIMERS.push(setInterval(spawn, d.every || 1700));
  GTIMERS.push(setInterval(() => { left--; const t = $('#gTm'); if (t) t.textContent = left; if (left <= 0) { gClear(); st.running = false; st.done = true; gStar(g); gConfetti(); render(); } }, 1000));
}
function gameAct(act, d, e){
  const {g, G0, s, st} = gCur(), D = s.data;
  if (act === 'g-stage') { gClear(); G0.stage = +d.v; render(); return; }
  if (act === 'g-again') { gClear(); G0.st[G0.stage] = GM[s.type].init(D); render(); return; }
  if (act === 'g-sort') { const c = D.cards[st.order[st.i]]; st.fb = {ok: c.bin === d.v}; if (st.fb.ok) st.ok++; render(); return; }
  if (act === 'g-next') {
    if (s.type === 'story') { st.node = st.pend.next; st.pend = null; if (D.nodes[st.node] && D.nodes[st.node].end) { gStar(g); gConfetti(); } render(); return; }
    st.i++; st.fb = null; if (s.type === 'sort' && st.i >= st.order.length) { gStar(g); gConfetti(); } render(); return;
  }
  if (act === 'g-flip') {
    const i = +d.i; if (st.open.length >= 2 || st.open.includes(i) || st.got.includes(i)) return;
    st.open.push(i); render();
    if (st.open.length === 2) { st.moves++; const [a, b] = st.open.map(x => st.deck[x]);
      if (a.k === b.k && a.s !== b.s) { st.got.push(...st.open); st.open = []; setTimeout(() => { if (st.got.length === st.deck.length) { gStar(g); gConfetti(); } render(); }, 450); }
      else setTimeout(() => { st.open = []; render(); }, 1100); }
    return;
  }
  if (act === 'g-choice') { st.pend = D.nodes[st.node].choices[+d.i]; render(); return; }
  if (act === 'g-clue') { const c = D.clues[st.order[st.i]]; st.fb = {ok: c.side === d.v}; if (st.fb.ok) st.ok++; render(); return; }
  if (act === 'g-opt') { st.pick = +d.i; if (D.options[st.pick].good) { gStar(g); gConfetti(); } render(); return; }
  if (act === 'g-catchgo') { st.running = true; st.score = 0; st.reframes = []; render(); return; }
  if (act === 'g-rung') { const k = d.v; st.done = st.done.includes(k) ? st.done.filter(x => x !== k) : st.done.concat(k); const total = D.steps.length + st.custom.length; if (st.done.length === total) { gStar(g); gConfetti(); } render(); return; }
  if (act === 'g-rungadd') { const t = ($('#gRungT').value || '').trim(); if (!t) return toast('כותבים מדרגה'); st.custom.push({t, suds: Math.max(0, Math.min(10, +$('#gRungS').value || 5))}); render(); return; }
  if (act === 'g-spin') {
    if (st.spinning) return; const n = D.slices.length, A = 360 / n, k = Math.floor(Math.random() * n);
    const base = st.angle - (st.angle % 360) + 360 * 5; st.angle = base + (360 - (k + .5) * A); st.spinning = true; st.pick = null;
    const w = $('#gWheel'); if (w) { w.style.transition = 'transform 3.6s cubic-bezier(.17,.67,.2,1)'; w.style.transform = `rotate(${st.angle}deg)`; }
    const b = e.target.closest('button'); if (b) b.disabled = true;
    setTimeout(() => { const sl = D.slices[k], used = st.used[k] = st.used[k] || [], fresh = sl.items.filter(x => !used.includes(x)); const item = pickOne(fresh.length ? fresh : sl.items); used.push(item); st.pick = {k, item}; st.spinning = false; render(); }, 3700);
    return;
  }
  if (act === 'g-roll') {
    if (st.busy || st.win != null) return; st.busy = true; render();
    const N = D.spaces || 24, keys = D.pattern || Object.keys(D.deck);
    setTimeout(() => {
      const n = 1 + Math.floor(Math.random() * 6); st.die = n; let steps = n;
      const walk = () => {
        if (steps <= 0 || st.pos[st.turn] >= N) {
          st.busy = false; const p = st.pos[st.turn];
          if (p >= N) { st.win = st.turn; gStar(g); gConfetti(); render(); return; }
          const k = keys[(p - 1) % keys.length], deck = D.deck[k], used = st.used[k] = st.used[k] || [], fresh = deck.items.filter(x => !used.includes(x));
          const item = pickOne(fresh.length ? fresh : deck.items); used.push(item); st.card = {k, item}; render(); return;
        }
        st.pos[st.turn]++; steps--; render(); GTIMERS.push(setTimeout(walk, 260));
      };
      walk();
    }, 700);
    return;
  }
  if (act === 'g-cardok') { st.card = null; st.turn = 1 - st.turn; render(); return; }
}

/* ================= visual formulation: the maintaining cycle (המעגל שמשמר את עצמו) and how to break it =================
   c = {title, nodes:[{k,label,t}], back, breaks:[{at,title,t,tool}], better:[{k,label,t}]} – used in maps, the אפר״ת tool and the treatment tracks */
const CYC_COLORS = {trigger: '#fde68a', thought: '#c4b5fd', feeling: '#fbcfe8', body: '#fecaca', behavior: '#a7f3d0', result: '#bae6fd'};
const CYC_ICONS = {trigger: '⚡', thought: '💭', feeling: '💗', body: '🫀', behavior: '🏃', result: '↩️'};

    <div class="note" style="margin:4px 0 16px">🧭 לכל בעיה – מסלול טיפול מובנה ואינטראקטיבי: אבחון והערכה, הסבר פסיכו-חינוכי, פורמולציה (5P ומעגל משמר), מטרות, טכניקות, תוכנית פעולה ואקטיבציה, פרוטוקול מפגשים ומניעת הישנות. ${active() ? `הכול נשמר בתיק של <b>${esc(active().alias)}</b>.` : 'בחרו תלמיד בראש המסך כדי שהמילוי יישמר בתיק שלו (בלי תלמיד – נשמר ב״כללי״).'}</div>
    ${list.length ? `<div class="grid">${list.map(t => `<a class="card" href="#/track/${t.id}"><span class="emoji">${t.icon || '🧭'}</span><span class="name">${esc(t.title)}</span><span class="sub">${esc(t.for || '')} · ${t.steps.length} שלבים</span></a>`).join('')}</div>` : '<div class="empty">⏳ המסלולים נטענים…</div>'}`};
}
function trackView(R){
  const t = TRACK(R.id); if (!t) return {title: 'טיפול מובנה', html: `<div class="empty">${TRACKS().length ? 'המסלול לא נמצא.' : '⏳ המסלולים נטענים…'} <a href="#/tracks">לכל המסלולים</a></div>`};
  const D = trData(t.id);
  if (R.sub === 'print') return {title: t.title, html: `<a class="back no-print" href="#/track/${t.id}">→ חזרה למסלול</a><h1>${esc(t.title)}</h1>${active() ? `<p>תלמיד: ${esc(active().alias)}</p>` : ''}${t.steps.map((s, i) => `<div class="panel trprint"><h3>${i + 1}. ${s.icon || ''} ${esc(s.title)}</h3>${trStepHTML(t, s, D)}</div>`).join('')}`, after(){ setTimeout(() => window.print(), 400); }};
  const i = Math.min(t.steps.length - 1, Math.max(0, R.sub ? +R.sub - 1 : 0)), s = t.steps[i];
  const done = t.steps.filter(x => trStepDone(x, D)).length;
  return {title: t.title, html: `<a class="back no-print" href="#/${HUBOF(t)[0]}">→ ${HUBOF(t)[1]}</a>
    <div class="banner" style="--h:${hueOf(t.title)}"><span class="emoji">${t.icon || '🧭'}</span><div><div style="opacity:.85;font-size:14px">${esc(t['for'] || '')}${active() ? ' · ⭐ ' + esc(active().alias) : ''}</div><h1>${esc(t.title)}</h1></div>
      <div class="actions no-print">${P[t.id] ? `<a class="btn sm" href="#/problem/${t.id}">🧭 מפת הטיפול</a>` : ''}${GAME(t.id) ? `<a class="btn sm" href="#/game/${t.id}">🎲 המשחק</a>` : ''}<a class="btn sm" href="#/track/${t.id}/print">🖨️ סיכום להדפסה</a></div></div>
    ${t.intro && i === 0 ? `<p class="lead" style="text-align:start">${esc(t.intro)}</p>` : ''}
    <div class="trlayout"><nav class="trsteps no-print"><div class="gprog"><i style="width:${Math.round(100 * done / t.steps.length)}%"></i></div>${t.steps.map((x, j) => `<a href="#/track/${t.id}/${j + 1}" class="${j === i ? 'on' : ''} ${trStepDone(x, D) ? 'ok' : ''}"><span class="n">${trStepDone(x, D) ? '✓' : j + 1}</span>${x.icon || ''} ${esc(x.title)}</a>`).join('')}</nav>
      <section class="panel trmain"><h2>${s.icon || ''} ${esc(s.title)}</h2>${trStepHTML(t, s, D)}
        <div class="actions" style="justify-content:space-between;margin-top:18px">${i > 0 ? `<a class="btn" href="#/track/${t.id}/${i}">→ הקודם</a>` : '<span></span>'}${i < t.steps.length - 1 ? `<a class="btn primary" href="#/track/${t.id}/${i + 2}">הבא ←</a>` : `<a class="btn primary" href="#/track/${t.id}/print">🖨️ סיכום המסלול</a>`}</div></section></div>`};
}
let trTimer = null;
const trSave = () => { clearTimeout(trTimer); trTimer = setTimeout(save, 500); };
function trCycleRefresh(tid, sid){ const t = TRACK(tid), s = t && t.steps.find(x => x.id === sid); if (!s || s.kind !== 'cycle') return; const D = trData(tid), d = D[sid] || {}; const b = $('#trcy-' + sid); if (b) b.innerHTML = cycleHTML({title: s.title, nodes: s.nodes.map((x, i) => ({k: x.k, label: x.label, t: d['n' + i] || '', ph: x.ph})), back: s.back, breaks: s.breaks}); }
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset) return;
  const tid = route().id;
  if (el.dataset.tr) { const [sid, f] = el.dataset.tr.split('.'); const D = trData(tid); (D[sid] = D[sid] || {})[f] = el.value; trSave(); if (/^n\d+$/.test(f)) { clearTimeout(el._t); el._t = setTimeout(() => trCycleRefresh(tid, sid), 350); } }
  if (el.dataset.trs) { const [sid, f] = el.dataset.trs.split('.'); const D = trData(tid); (D[sid] = D[sid] || {})[f] = +el.value; trSave(); const lab = $(`#trs-${sid}-${f}`); if (lab) { lab.textContent = el.value; lab.style.color = lvlColor(Math.round(10 * el.value / (+el.max || 10))); }
    const t = TRACK(tid), s = t && t.steps.find(x => x.id === sid); if (s) { const vals = s.items.map(it => D[sid][it.id]).filter(x => x != null); const a = $('#trsavg-' + sid); if (a) a.textContent = vals.length ? (vals.reduce((p, q) => p + +q, 0) / vals.length).toFixed(1) : '—'; } }
  if (el.dataset.trc) { const [sid, f] = el.dataset.trc.split('.'); const D = trData(tid); (D[sid] = D[sid] || {})[f] = el.checked; trSave(); const l = el.closest('.trcheck'); if (l) l.classList.toggle('on', el.checked); }
});
function trackAct(act, d, e){
  const tid = route().id, D = trData(tid), P0 = (D[d.st] = D[d.st] || {}), days = (P0.days = P0.days || {});
  if (act === 'tr-day') { P0.sel = d.v; }
  if (act === 'tr-idea') { const day = P0.sel || DAYS[0]; (days[day] = days[day] || []).push({t: d.v, done: false}); toast('נוסף ליום ' + day); }
  if (act === 'tr-add') { const x = $('#tradd-' + d.st), v = x && x.value.trim(); if (!v) return toast('כותבים פעילות'); const day = P0.sel || DAYS[0]; (days[day] = days[day] || []).push({t: v, done: false}); }
  if (act === 'tr-done') { const a = days[d.d][+d.i]; a.done = !a.done; }
  if (act === 'tr-del') { e.preventDefault(); days[d.d].splice(+d.i, 1); }
  save(); render();
}

/* ================= videos: every video file and video link in the materials, by topic; clicking plays it right here ================= */
const VIDEO_RX = /\.(mp4|m4v|webm|mov)$/i;
const ytIdOf = u => { const m = String(u || '').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/); return m ? m[1] : ''; };
const ytList = u => (String(u || '').match(/[?&]list=([\w-]+)/) || [])[1] || '';
const ytStart = u => { const m = String(u || '').match(/[?&](?:t|start)=(\d+)/); return m ? +m[1] : 0; };
function allVideos(){
  const out = [], seen = new Set();
  for (const p of LIBDATA) {
    for (const a of p.attachments) if (VIDEO_RX.test(a.path) && !seen.has(a.path)) { seen.add(a.path); out.push({kind: 'file', src: a.path, title: a.name.replace(/\.[^.]+$/, '').replace(/^\d{3}\s+/, ''), topic: p.topic, from: p.title}); }
    for (const l of (p.links || [])) { const id = ytIdOf(l.url), list = ytList(l.url); const key = id || list; if (!key || seen.has(key)) continue; seen.add(key);
      out.push({kind: 'yt', id, list, start: ytStart(l.url), url: l.url, title: (l.text && !/^https?:/.test(l.text) ? l.text : '') || p.title, topic: p.topic, from: p.title}); }
  }
  return out;
}
function videosView(){
  const v = allVideos();
  if (!v.length) return {title: 'סרטונים', html: `<div class="empty">${LIBDATA.length ? 'לא נמצאו סרטונים בחומרים.' : '⏳ הספרייה נטענת…'}</div>`};
  const by = {}; v.forEach(x => { const k = topicName(x.topic) || 'כללי'; (by[k] = by[k] || []).push(x); });
  const card = x => `<button type="button" class="vcard" data-act="vplay" data-k="${x.kind}" data-src="${esc(x.src || '')}" data-id="${esc(x.id || '')}" data-list="${esc(x.list || '')}" data-start="${x.start || 0}" data-title="${esc(x.title)}">
      <span class="vthumb">${x.kind === 'yt' && x.id ? `<img src="https://i.ytimg.com/vi/${esc(x.id)}/mqdefault.jpg" alt="" loading="lazy">` : `<span class="vfile">🎬</span>`}<span class="vplay">▶</span></span>
      <span class="vt">${esc(x.title)}</span><span class="vs">${x.kind === 'yt' ? (x.list && !x.id ? 'רשימת השמעה ביוטיוב' : 'יוטיוב') : 'קובץ וידאו'}${x.from && x.from !== x.title ? ' · ' + esc(x.from) : ''}</span></button>`;
  return {title: 'סרטונים', html: `${gGuide('בוא נצפה ונלמד! לוחצים על סרטון – והוא מתנגן כאן 🎬', 'שמחה', 5)}<div class="note" style="margin:4px 0 16px">🎬 ${v.length} סרטונים מכל החומרים שלך – קובצי וידאו מהספרייה וסרטוני יוטיוב מתוך הדפים – לפי נושאים. לחיצה מנגנת את הסרטון מיד, בתוך האפליקציה.</div>
    ${Object.entries(by).sort((a, b) => b[1].length - a[1].length).map(([k, xs]) => `<h2 class="sec">${esc(k)} <span class="muted" style="font-size:14px;font-weight:600">${xs.length}</span></h2><div class="vgrid">${xs.map(card).join('')}</div>`).join('')}`};
}
async function playVideo(d){
  const m = $('#modal'); m.className = 'modal open big';
  const head = `<div class="mhead"><h3>${esc(d.title || 'סרטון')}</h3><button class="iconbtn" data-act="close">✕</button></div>`;
  if (d.k === 'yt') {
    const src = d.id ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.id)}?autoplay=1&rel=0${+d.start ? '&start=' + +d.start : ''}${d.list ? '&list=' + encodeURIComponent(d.list) : ''}` : `https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(d.list)}&autoplay=1`;
    m.innerHTML = `<div class="box">${head}<div class="vwrap"><iframe src="${src}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div>`; return;
  }
  m.innerHTML = `<div class="box">${head}<div class="vwrap"><div class="empty">⏳ טוען את הסרטון…</div></div></div>`;
  const w0 = () => m.querySelector('.vwrap');
  if (!WEB) { w0().innerHTML = `<video src="${href(d.src)}" controls autoplay playsinline preload="auto"></video>`; return; }
  try {
    if (Cloud.status !== 'ok') throw new Error('צריך להתחבר עם חשבון מיקרוסופט');
    const r = await Cloud.g(Cloud.itemPath(d.src)); if (!r.ok) throw new Error('הסרטון לא נמצא ב-OneDrive'); const j = await r.json();
    // OneDrive's own player (embeddable) plays every video reliably; the direct stream is only a fallback
    const p = await Cloud.g('/me/drive/items/' + j.id + '/preview', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
    const pj = p.ok ? await p.json() : {};
    const w = w0(); if (!w) return;
    if (pj.getUrl) w.innerHTML = `<iframe src="${pj.getUrl}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    else w.innerHTML = `<video src="${j['@microsoft.graph.downloadUrl']}" controls autoplay playsinline preload="auto"></video>`;
  } catch(e){ const w = w0(); if (w) w.innerHTML = `<div class="empty">לא הצלחתי לפתוח את הסרטון: ${esc(e.message)}</div>`; }
}

{ const t = ls.get('cbtapp.theme', null); if (t) document.documentElement.dataset.theme = t; }
