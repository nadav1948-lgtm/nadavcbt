/* ===== design refresh 2026 ===== */
/* indigo-violet primary, coral/amber warmth, mint/teal support; soft mesh grounds, glass bars, rounded layered surfaces.
   dark = :root (default) · light = [data-theme="light"]. Only tokens + visual polish – no layout or content changes. */
:root{
  color-scheme:dark;
  --bg:#0f0d1a; --bg2:#181529; --panel:#1b1830; --ink:#f3f1ff; --muted:#aaa5c8; --line:#2e2a4a;
  --brand:#6d4ff0; --brand-2:#7c3aed; --brand-soft:rgba(150,130,255,.16); --brand-ink:#ffffff; --brand-text:#b6a9ff;
  --accent:#f5a524; --coral:#fb7185; --teal:#2dd4bf; --danger:#ff7a85; --ok:#2fbf8a;
  --grad:linear-gradient(135deg,#5b4df0 0%,#7c3aed 100%);
  --glow:rgba(124,92,255,.55);
  --ring:rgba(182,169,255,.85);
  --gloss:rgba(255,255,255,.14);
  --glass:rgba(27,24,48,.72);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-hi:0 2px 6px rgba(0,0,0,.35),0 24px 50px -18px rgba(0,0,0,.75);
  --r:18px; --soft-s:34%; --soft-l:21%; --sat:62%; --lt:64%;
  --display:Rubik,Heebo,"Segoe UI",Arial,sans-serif;
  --dg1:#818cf8;--dg2:#f472b6;--dg3:#2dd4bf;--dg4:#fbbf24;--dg5:#a78bfa;--dg6:#fb923c;--dg7:#38bdf8;--dg8:#f87171;--dgmix:20%;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f5fb; --bg2:#eeecf7; --panel:#ffffff; --ink:#1c1733; --muted:#5d5877; --line:#e3e0f0;
  --brand:#5b3fe0; --brand-2:#7c3aed; --brand-soft:rgba(91,63,224,.10); --brand-ink:#ffffff; --brand-text:#4c32d6;
  --accent:#f59e0b; --coral:#f43f5e; --teal:#0d9488; --danger:#c92f47; --ok:#0d8a5f;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
  --glow:rgba(91,63,224,.42);
  --ring:rgba(91,63,224,.7);
  --gloss:rgba(255,255,255,.6);
  --glass:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(28,20,70,.05),0 4px 12px -4px rgba(28,20,70,.07),0 14px 32px -16px rgba(28,20,70,.14);
  --shadow-hi:0 2px 6px rgba(28,20,70,.06),0 22px 46px -16px rgba(60,40,150,.26);
  --soft-s:72%; --soft-l:94%; --sat:58%; --lt:44%;
  --dg1:#4f46e5;--dg2:#db2777;--dg3:#0d9488;--dg4:#d97706;--dg5:#7c3aed;--dg6:#ea580c;--dg7:#0284c7;--dg8:#dc2626;--dgmix:12%;
}

/* grounds & type */
html{scrollbar-color:color-mix(in srgb,var(--brand) 40%,var(--line)) transparent}
body{font-family:Heebo,"Segoe UI",Arial,sans-serif;line-height:1.65}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at 100% 0%,color-mix(in srgb,#7c3aed 16%,transparent),transparent 70%),
             radial-gradient(45% 40% at 0% 100%,color-mix(in srgb,#14b8a6 12%,transparent),transparent 70%),
             radial-gradient(35% 30% at 18% 8%,color-mix(in srgb,#fb7185 9%,transparent),transparent 70%)}
::selection{background:color-mix(in srgb,var(--brand) 30%,transparent)}
h1,h2,h3,.brand,.hero h1,.banner h1,.dghead,.ctitle{font-family:var(--display);letter-spacing:-.2px}
h2.sec{font-size:21px;font-weight:700;margin:32px 0 14px}
h2.sec::before{content:"";flex:none;width:6px;height:22px;border-radius:4px;background:linear-gradient(var(--brand),var(--coral))}
:where(a,button,select,input,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--ring);outline-offset:2px}

/* side navigation: frosted glass, pill-shaped gradient active item, icons in tinted circles */
.side{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-inline-end:1px solid color-mix(in srgb,var(--line) 80%,transparent);padding:18px 12px;gap:3px}
.brand{font-size:17.5px;font-weight:800;padding:4px 6px 18px}
.brand .mark{background:var(--grad);color:#fff;border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -6px var(--glow)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{gap:11px;padding:6px 8px;border-radius:14px;font-weight:500;transition:background-color .18s,color .18s,box-shadow .2s}
.nav a .i{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--brand) 11%,transparent);transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s}
.nav a:hover{background:color-mix(in srgb,var(--brand) 9%,transparent);color:var(--ink)}
.nav a:hover .i{transform:scale(1.07)}
.nav a.on{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 10px 22px -10px var(--glow)}
.nav a.on .i{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.sync{border-radius:12px;background:color-mix(in srgb,var(--brand) 7%,var(--bg2))}

/* top bar: a floating frosted strip */
.topbar{top:10px;margin:10px 0 16px;height:62px;padding:0 16px 0 10px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);box-shadow:0 10px 30px -16px rgba(30,20,80,.35)}
.topbar .title{font-family:var(--display);font-weight:700}
.who{border-radius:999px;background:color-mix(in srgb,var(--brand) 6%,var(--panel));border-color:color-mix(in srgb,var(--brand) 16%,var(--line));padding:4px 6px 4px 12px}
.iconbtn{border-radius:14px;background:color-mix(in srgb,var(--brand) 6%,var(--panel));border-color:color-mix(in srgb,var(--brand) 16%,var(--line));transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s}
.iconbtn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--brand) 50%,var(--line));box-shadow:0 6px 16px -8px var(--glow)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.side,.topbar,.tabbar{background:var(--panel)}}

/* hero: vivid gradient band with soft mesh + decorative rings */
.hero{background:linear-gradient(135deg,#1e1b4b 0%,#3b1d8f 42%,#6d28d9 74%,#a23b87 100%);border:0;border-radius:28px;box-shadow:0 26px 60px -28px rgba(76,29,149,.7)}
.hero::before{background:radial-gradient(38% 50% at 88% 18%,rgba(251,113,133,.42),transparent 70%),radial-gradient(34% 46% at 10% 82%,rgba(45,212,191,.32),transparent 70%),radial-gradient(30% 40% at 55% 112%,rgba(251,191,36,.30),transparent 70%)}
.hero::after{content:"";position:absolute;z-index:-1;pointer-events:none;inset:0;
  background:radial-gradient(circle at 4% 8%,transparent 0 70px,rgba(255,255,255,.07) 71px 110px,transparent 111px),
             radial-gradient(circle at 98% 104%,transparent 0 50px,rgba(255,255,255,.06) 51px 80px,transparent 81px),
             radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.6px) 0 0/22px 22px;
  -webkit-mask-image:linear-gradient(to left,#000,transparent 70%);mask-image:linear-gradient(to left,#000,transparent 70%)}
.hero h1{text-shadow:0 2px 18px rgba(20,10,60,.35)}
.hero p{opacity:.95}
.hero .btn,.banner .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .btn:hover,.banner .btn:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.6)}
.hero .btn.primary,.banner .btn.primary{background:#fff;color:#3b22b8;border-color:#fff;font-weight:700;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}

/* page banners & hub headers: hue-driven gradient, glossy emoji badge, rings + a color strip */
.banner{background:#1e1b4b;border:0;border-radius:24px;box-shadow:0 20px 44px -24px hsl(var(--h) 60% 25% / .8);padding:30px 30px 34px}
.banner::before{background:radial-gradient(55% 120% at 100% 0%,hsl(var(--h) 85% 48% / .22),transparent 65%),radial-gradient(40% 110% at 0% 100%,rgba(236,72,153,.28),transparent 70%),linear-gradient(240deg,hsl(var(--h) 72% 26%) 0%,hsl(var(--h) 55% 22%) 40%,#241c5c 100%)}
.banner::after,.hubhero::after{content:"";position:absolute;z-index:-1;pointer-events:none;inset:0;height:auto;
  background:radial-gradient(circle at 8% 22%,transparent 0 46px,rgba(255,255,255,.08) 47px 74px,transparent 75px),
             radial-gradient(circle at 18% 120%,rgba(255,255,255,.07) 0 80px,transparent 81px),
             linear-gradient(to left,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 40) 85% 62%),hsl(calc(var(--h) + 80) 85% 62%)) bottom/100% 5px no-repeat}
.banner h1,.banner p{text-shadow:0 1px 3px rgba(0,0,0,.3)}
.banner p{opacity:.95}
.banner .emoji{border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 26px -10px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hubhero{padding:30px 30px 34px}
.hubhero .emoji{width:80px;height:80px;font-size:42px;border-radius:24px;background:linear-gradient(145deg,hsl(var(--h) 85% 72% / .55),hsl(var(--h) 70% 45% / .25));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 5px hsl(var(--h) 80% 70% / .18),0 14px 30px -10px rgba(0,0,0,.55)}

/* surfaces */
.card,.panel,.toolstage,.stat,.sess,.trsteps,.vcard,.modal .box{border-color:color-mix(in srgb,var(--line) 85%,transparent)}
.card{border-radius:20px;padding:20px;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi),0 14px 34px -18px hsl(var(--h) 75% 50% / .6);border-color:hsl(var(--h) 65% 60% / .55)}
.card.accent::before{height:5px;background:linear-gradient(to left,hsl(var(--h) var(--sat) var(--lt)),hsl(calc(var(--h) + 45) var(--sat) var(--lt)))}
.card .emoji{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--gloss),transparent 60%),hsl(var(--h) var(--soft-s) var(--soft-l));box-shadow:inset 0 1px 0 var(--gloss),0 8px 18px -10px hsl(var(--h) 70% 40% / .6)}
.card .name{font-weight:700}
.card.hubc{background:linear-gradient(160deg,hsl(var(--h) var(--soft-s) var(--soft-l)) 0%,var(--panel) 60%)}
.card.hubc .emoji{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,var(--gloss),transparent 60%),hsl(var(--h) var(--sat) var(--lt) / .30)}
.panel{border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.panel h3{font-weight:700}
.toolstage{border-radius:24px}
.stat{border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--brand) 7%,var(--panel)),var(--panel) 70%);box-shadow:var(--shadow)}
.stat b{font-family:var(--display);font-weight:800;color:var(--brand-text)}
.sess{border-radius:18px;box-shadow:var(--shadow)}
.sess summary .n{background:var(--grad);color:#fff;border-radius:12px}
.sess.done summary .n{background:var(--ok)}
.li{border-radius:14px;background:color-mix(in srgb,var(--panel) 60%,var(--bg));border-color:color-mix(in srgb,var(--line) 85%,transparent)}
.note{border-radius:16px;border:1px solid color-mix(in srgb,var(--brand) 18%,transparent)}
.note.warn{border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.note.danger{border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.modal{background:rgba(15,12,40,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{border-radius:24px;border:1px solid var(--line);box-shadow:0 40px 90px -20px rgba(10,5,40,.6)}
.toast{border-radius:999px;padding:10px 20px}
.progress i{background:var(--grad)}
.chart .ln{stroke:var(--brand-text)}.chart .pt{stroke:var(--brand-text)}

/* buttons, chips, pills, tabs */
.btn{border-radius:999px;padding:9px 18px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--brand) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--brand) 20%,var(--line));transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background-color .18s,border-color .18s}
.btn:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--brand) 15%,var(--panel));border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 8px 20px -10px var(--glow)}
.btn.primary:hover{box-shadow:0 14px 28px -10px var(--glow)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:999px}
.btn.big{padding:13px 26px}
.vrate .btn.on{background:var(--grad);color:#fff;border-color:transparent}
.chip{background:var(--panel);border-color:color-mix(in srgb,var(--brand) 16%,var(--line));padding:7px 15px;font-weight:500;transition:transform .18s,border-color .18s,background-color .18s,box-shadow .18s}
.chip:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));transform:translateY(-1px)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 8px 18px -10px var(--glow)}
.pill{background:color-mix(in srgb,var(--brand) 7%,var(--bg2));font-weight:500}
.pill.brand{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.tabs{border-bottom-color:color-mix(in srgb,var(--line) 85%,transparent);gap:6px}
.tabs a{border-radius:12px 12px 0 0;transition:color .15s,background-color .15s}
.tabs a:hover{color:var(--ink);background:color-mix(in srgb,var(--brand) 6%,transparent)}
.tabs a.on{border-bottom-color:transparent;background:linear-gradient(var(--brand-text),var(--brand-text)) bottom/100% 3px no-repeat,color-mix(in srgb,var(--brand) 7%,transparent);font-weight:700}
.gst{transition:border-color .15s,background-color .15s}
.gst.on b{background:var(--grad);color:#fff}
.wtabs>label{transition:background-color .15s,border-color .15s}
.wtabs>input:checked+label{background:var(--grad);color:#fff;border-color:transparent}
.back{font-weight:500;padding:4px 10px 4px 12px;border-radius:999px;transition:background-color .15s,color .15s}
.back:hover{background:var(--brand-soft)}

/* forms */
label.f input,label.f select,label.f textarea,.inp{border-radius:12px;border-color:color-mix(in srgb,var(--line) 90%,var(--brand));transition:border-color .15s,box-shadow .15s}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{border-color:var(--brand-text);box-shadow:0 0 0 4px var(--brand-soft)}
.search input{border-radius:999px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--brand-text);box-shadow:0 0 0 4px var(--brand-soft),var(--shadow)}
.checks label{transition:border-color .15s,background-color .15s}
.checks label:hover{border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}

/* home tiles */
.htile{border-radius:22px;min-height:112px;background:radial-gradient(130% 95% at 50% 0%,hsl(var(--h) 72% 58% / .30),transparent 72%),linear-gradient(180deg,transparent 40%,hsl(calc(var(--h) + 35) 70% 55% / .10)),var(--panel);border:1px solid hsl(var(--h) var(--sat) var(--lt) / .32);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.htile:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi),0 16px 34px -16px hsl(var(--h) 75% 50% / .65);border-color:hsl(var(--h) var(--sat) var(--lt) / .7)}
.hti{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--gloss),transparent 60%),hsl(var(--h) var(--sat) var(--lt) / .32);box-shadow:inset 0 1px 0 var(--gloss),0 8px 18px -10px hsl(var(--h) 70% 40% / .7);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.htile:hover .hti{transform:scale(1.08) rotate(-4deg)}
.htl{font-weight:700}
.hubmap a{box-shadow:0 2px 8px -4px hsl(var(--h) 60% 40% / .4)}

/* treatment tracks: elegant stepper + step header bands */
.trsteps{top:84px;border-radius:20px;padding:10px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.trsteps a{border-radius:12px;padding:7px 8px;transition:background-color .15s}
.trsteps a:hover{background:hsl(var(--kh,250) 70% 60% / .10)}
.trsteps a .n{width:26px;height:26px}
.trsteps a.on{background:linear-gradient(to left,hsl(var(--kh,250) 75% 58% / .22),hsl(var(--kh,250) 75% 58% / .06));box-shadow:inset -4px 0 0 hsl(var(--kh,250) 72% 58%)}
.trsteps a.on .n{background:hsl(var(--kh,250) 65% 45%);box-shadow:0 4px 10px -3px hsl(var(--kh,250) 70% 45% / .7)}
.trmain h2.trhead{border-radius:16px;padding:14px 16px;background:linear-gradient(to left,hsl(var(--kh,250) 75% 58% / .22),hsl(var(--kh,250) 75% 58% / .04));border-inline-start:6px solid hsl(var(--kh,250) 72% 58%)}
.trkind{font-weight:700;letter-spacing:.2px}
.trcard{border-radius:16px}
.trringw{top:84px}
.so-side{top:84px}

/* diagrams: softer, layered nodes in the new palette */
.dgn{border-radius:16px;box-shadow:0 1px 0 color-mix(in srgb,var(--c) 25%,transparent),0 8px 18px -12px color-mix(in srgb,var(--c) 70%,transparent)}
button.dgn:hover{box-shadow:0 12px 24px -12px color-mix(in srgb,var(--c) 80%,transparent)}
.dgside{border-radius:16px}
.dgside h4{border-radius:13px 13px 0 0}
.dgdet{border-radius:16px}
:root:not([data-theme="light"]) .dgside h4,:root:not([data-theme="light"]) .dgdot,:root:not([data-theme="light"]) .trnum li::before{color:#15112b}

/* library, videos, circulars */
.lib-item{border-radius:14px;background:var(--panel);transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s}
.lib-item{flex-wrap:wrap}.lib-item .grow{flex:1 1 170px}
.lib-item:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 50%,var(--line));box-shadow:var(--shadow)}
.ft{border-radius:6px}
.vcard{border-radius:18px;padding:10px;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.vthumb{border-radius:12px;background:linear-gradient(135deg,#312e81,#6d28d9 60%,#be185d)}
.vplay{background:rgba(255,255,255,.9);color:#4c1d95;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
.circ-quote{border-radius:14px;border-inline-start-color:var(--brand-text)}
.circ-text{border-radius:14px}

/* phones: floating frosted tab bar */
@media (max-width:900px){
  .main{padding:0 16px 108px}
  .topbar{top:8px;margin:8px 0 14px;height:auto;min-height:58px;padding:8px 12px 8px 8px;gap:8px;row-gap:6px;flex-wrap:wrap;border-radius:18px}
  .topbar .title{flex:1 1 auto;min-width:min-content;font-size:17px;line-height:1.3}
  .topbar .who{margin-inline-start:auto}
  .tabbar{bottom:calc(8px + env(safe-area-inset-bottom));inset-inline:8px;padding:6px 4px;border-radius:22px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 14px 34px -12px rgba(20,10,60,.45)}
  .tabbar a{border-radius:14px;gap:3px}
  .tabbar a .i{width:40px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s,transform .2s}
  .tabbar a.on{font-weight:700}
  .tabbar a.on .i{background:var(--brand-soft);transform:translateY(-1px)}
  .hero{border-radius:22px}
  .banner,.hubhero{border-radius:20px;padding:22px 18px 26px}
}
@media (max-width:420px){.topbar{gap:5px;padding-inline:8px}.topbar .title{flex-basis:100%}.iconbtn{width:34px;height:34px;border-radius:12px;font-size:16px}.who{gap:4px;padding:3px 4px 3px 8px}.who select{font-size:14px}}

/* motion: transform/opacity only, and none for those who ask */
@media (prefers-reduced-motion:reduce){
  .page{animation:none}
  .card:hover,.htile:hover,.vcard:hover,.lib-item:hover,.btn:hover,.chip:hover,.iconbtn:hover,.htile:hover .hti,.nav a:hover .i{transform:none}
}

/* print: plain, light and readable whatever the screen theme */
@media print{
  :root,:root[data-theme]{color-scheme:light;--bg:#fff;--bg2:#f3f3f6;--panel:#fff;--ink:#111;--muted:#444;--line:#cfcfd8;--brand-text:#3b22b8;--brand-soft:#efeafe;--glass:#fff;
    --dg1:#4f46e5;--dg2:#db2777;--dg3:#0d9488;--dg4:#d97706;--dg5:#7c3aed;--dg6:#ea580c;--dg7:#0284c7;--dg8:#dc2626;--dgmix:10%}
  body::before,.hero::before,.hero::after,.banner::before,.banner::after{display:none!important}
  .hero,.banner{background:none!important;color:#000!important;border:2px solid #ccc;box-shadow:none!important;border-radius:14px}
  .hero h1,.banner h1,.banner p{text-shadow:none}
  .banner .emoji{background:none;box-shadow:none;border:1px solid #ccc}
  .card,.panel,.htile,.stat,.sess,.vcard,.trsteps,.dgn,.toolstage{box-shadow:none!important}
  .stat b{color:#111}
  .btn.primary,.chip.on{background:none;color:#111;border:1px solid #999;box-shadow:none}
}
/* premium polish: a refined gold hairline, lit top edges, calmer type rhythm */
:root{--gold:#f5c451;--gold-2:#e0913a}
@media screen{
  .hero{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 26px 60px -28px rgba(76,29,149,.7)}
  .hero h1{letter-spacing:-1.2px}
  .hero p{line-height:1.75}
  .banner{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 20px 44px -24px hsl(var(--h) 60% 25% / .8)}
  h2.sec::before{background:linear-gradient(var(--gold),var(--gold-2))}
  .card,.panel,.stat,.htile{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--shadow)}
  .card:hover,.htile:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),var(--shadow-hi),0 14px 34px -18px hsl(var(--h) 75% 50% / .6)}
  .brand .mark{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(245,196,81,.35),0 8px 18px -6px var(--glow)}
}
/* ===== end design refresh 2026 ===== */

/* ===== 🧭 מבט על – the hub infographic (app/infographics.js) ===== */
.infogwrap{margin:6px 0 20px}
.infogwrap>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:10px 16px;border-radius:14px;background:hsl(var(--h,200) var(--soft-s) var(--soft-l));border:1.5px solid hsl(var(--h,200) var(--sat) var(--lt) / .45)}
.infogwrap>summary::-webkit-details-marker{display:none}
.infogwrap>summary::after{content:"▾";margin-inline-start:auto;transition:transform .2s}
.infogwrap:not([open])>summary::after{transform:rotate(90deg)}
.infogwrap>summary:focus-visible{outline:3px solid hsl(var(--h,200) 80% 55%);outline-offset:2px}
.igbar{display:flex;justify-content:flex-end;margin:8px 0}
.infog{--c:hsl(var(--h) var(--sat) var(--lt));position:relative;margin-top:8px;padding:18px;border-radius:24px;border:1.5px solid hsl(var(--h) var(--sat) var(--lt) / .35);
  background:radial-gradient(120% 80% at 50% 0%,hsl(var(--h) var(--soft-s) var(--soft-l)) 0%,var(--panel) 70%);box-shadow:var(--shadow)}
.infog a{color:inherit;text-decoration:none}
.iglk{cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.iglk:focus-visible{outline:3px solid hsl(var(--h) 85% 55%);outline-offset:2px;border-radius:10px}
.igarr{opacity:.5;font-weight:900;margin-inline-start:6px;font-size:.85em;transition:opacity .15s,transform .15s}
.iglk:hover .igarr,.iglk:focus-visible .igarr{opacity:1;transform:translateX(-3px)}
/* hero: the boy with the tagline in a speech bubble */
.ighero{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
.igkid{flex:none;width:78px}
.igkid svg{width:100%;height:auto;display:block}
.igbub{position:relative;flex:1;min-width:0;background:var(--panel);border:2px solid hsl(var(--h) var(--sat) var(--lt) / .5);border-radius:18px;border-bottom-right-radius:4px;padding:12px 16px;box-shadow:0 6px 18px -8px hsl(var(--h) 60% 30% / .45)}
.igtag{font-size:18px;font-weight:700;line-height:1.5}
/* the map: core circle in the middle, pillars around it */
.igmap{display:grid;grid-template-columns:1fr minmax(210px,250px) 1fr;gap:18px 26px;align-items:center}
.igside{display:flex;flex-direction:column;gap:12px}
.igcore{display:flex;justify-content:center}
.igca{position:relative;width:100%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:24px;
  background:radial-gradient(circle at 35% 30%,hsl(var(--h) 70% 52%),hsl(var(--h) 65% 32%));color:#fff;
  box-shadow:0 0 0 8px hsl(var(--h) var(--sat) var(--lt) / .18),0 0 0 17px hsl(var(--h) var(--sat) var(--lt) / .08),0 14px 30px -10px hsl(var(--h) 60% 25% / .6)}
.infog .igca,.infog .igca .igarr{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
a.igca:hover{transform:scale(1.03)}
.igci{font-size:38px;line-height:1}
.igct{font-size:19px;font-weight:900;line-height:1.25;text-wrap:balance}
.igcx{font-size:13.5px;line-height:1.4;opacity:.95}
.igp{position:relative;background:var(--panel);border-radius:16px;padding:10px 12px 10px 12px;border:1.5px solid hsl(calc(var(--h) + var(--k) * 34) var(--sat) var(--lt) / .45);
  border-inline-start:6px solid hsl(calc(var(--h) + var(--k) * 34) var(--sat) var(--lt));box-shadow:0 4px 14px -8px hsl(var(--h) 50% 30% / .45)}
.igp:hover{box-shadow:0 10px 22px -10px hsl(calc(var(--h) + var(--k) * 34) 60% 30% / .6)}

/* re-asserted after the refresh (user rule): never cut a word in the middle, show every title in full */
body,body *{overflow-wrap:normal!important;word-break:normal!important;hyphens:manual!important}
.topbar .title,.modal .mhead h3,.lib-item .t,.cbtrack small,.hmt,.so-bars .nm,.card .name,.card .sub,.hubc .name,.btn,.btn .lbl,.li b,.vcard .vt,.trsteps a,.tabs a,.chip{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;-webkit-line-clamp:unset!important;max-height:none!important}
.hmt{display:block!important}

/* hub map: a symmetric grid – neighbours always share the same height (the tallest text sets the row), text always in full */
.hubmap ol{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:1fr;gap:10px 12px!important;align-items:stretch}
.hubmap li{display:flex!important;align-items:stretch!important;min-width:0}
.hubmap li::after{align-self:center}
.hubmap a{flex:1;max-width:none!important;height:100%;box-sizing:border-box;align-items:center;padding:8px 14px 8px 8px!important}
@media (max-width:520px){.hubmap ol{grid-template-columns:1fr;grid-auto-rows:auto}.hubmap li::after{content:none}}

/* infographic symmetry: tiles side by side / in a column share one height (the fullest tile sets it); text stays complete */
.igside{display:grid!important;grid-auto-rows:1fr;align-items:stretch}
.igside>*{height:100%;box-sizing:border-box}
.igflow>li,.igkeys>*,.igdd>*{height:auto;align-self:stretch}
.igkeys{grid-auto-rows:1fr}
.igdd{align-items:stretch}

/* guided breathing: the boy breathes with the circle – air comes in on the in-breath, puffs out on the out-breath */
.brwrap{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.brkid{position:relative;width:180px;flex:none}
.brkid .brkidsvg{width:100%;height:auto;display:block;transform-origin:50% 90%;transition:transform var(--sec,4s) ease-in-out}
.brkid[data-ph="in"] .brkidsvg,.brkid[data-ph="hold"] .brkidsvg{transform:scale(1.09)}
.brkid[data-ph="out"] .brkidsvg{transform:scale(.96)}
.brkid .air{position:absolute;top:58%;left:44%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#dff3ff 0,#8fd0ff 55%,rgba(143,208,255,0) 72%);opacity:0;pointer-events:none}
.brkid[data-ph="out"] .air{animation:brpuff 1.5s ease-out infinite}
.brkid[data-ph="in"] .air{animation:brsuck 1.5s ease-in infinite;top:52%}
.brkid .a2{animation-delay:.38s!important}.brkid .a3{animation-delay:.76s!important}.brkid .a4{animation-delay:1.14s!important}
@keyframes brpuff{0%{transform:translate(0,0) scale(.4);opacity:.95}100%{transform:translate(-95px,-18px) scale(1.9);opacity:0}}
@keyframes brsuck{0%{transform:translate(-95px,-30px) scale(1.6);opacity:0}35%{opacity:.85}100%{transform:translate(0,0) scale(.3);opacity:0}}
.brlab{text-align:center;font-size:22px;font-weight:800;min-height:1.5em;margin:6px 0}
@media (prefers-reduced-motion:reduce){.brkid .air{animation:none!important}.brkid .brkidsvg{transition:none}}
@media print{.brkid .air{display:none}}

/* breathing boy v2: the chest expands, the head rises; on the out-breath the chest settles, cheeks puff and air leaves the mouth */
.brkid .brkidsvg{transform:none!important;overflow:visible}
.brkid .brchest{transform-box:view-box;transform-origin:100px 206px;transition:transform var(--sec,4s) ease-in-out}
.brkid .brhead{transform-box:view-box;transform-origin:100px 170px;transition:transform var(--sec,4s) ease-in-out}
.brkid[data-ph="in"] .brchest,.brkid[data-ph="hold"] .brchest{transform:scale(1.2,1.16)}
.brkid[data-ph="in"] .brhead,.brkid[data-ph="hold"] .brhead{transform:translateY(-7px)}
.brkid[data-ph="out"] .brchest{transform:scale(.97,.96)}
.brkid .brarrows{fill:none;stroke:#38bdf8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .4s}
.brkid[data-ph="in"] .brarrows{opacity:1;animation:brarr 1.2s ease-in-out infinite}
.brkid .brcheek,.brkid .brmouth{transition:opacity .5s}
.brkid[data-ph="out"] .brcheek{opacity:.55}
.brkid[data-ph="out"] .brmouth{opacity:1}
.brkid .air{top:60%;left:47%}
.brkid[data-ph="in"] .air{top:52%;left:47%}
@keyframes brarr{0%,100%{transform:translateX(0)}50%{transform:translateX(0);stroke-width:5}}
@media (prefers-reduced-motion:reduce){.brkid .brchest,.brkid .brhead{transition:none}.brkid .brarrows{animation:none}}

  return `<p class="no-print" style="margin:0 0 10px"><a class="btn sm" href="${BASE}/${c.id}/guide">📘 איך ממלאים? – ללשונית ההדרכה</a></p>${!c.pupils.length ? '<div class="note" style="margin-bottom:12px">👇 <b>מתחילים כאן:</b> מדביקים את רשימת התלמידים בתיבה ״התלמידים״ ולוחצים ״הוספה לרשימה״. אחר כך בודקים את השאלות – ועוברים ל-🖨️ דוח וטופס כדי להדפיס שאלון ריק.</div>' : ''}<div class="so-grid2"><div>
    <div class="panel"><h3>🏫 פרטי המפה</h3><div class="form"><div class="row2">

      ${c.pupils.length ? `<div class="so-pnames">${c.pupils.map((p, k) => `<div><span class="no">${k + 1}</span><input class="inp" data-so-pn="${p.id}" value="${esc(p.n)}" aria-label="שם"><button class="btn ghost sm" data-act="so-delp" data-id="${p.id}" title="הסרה">✕</button></div>`).join('')}</div>
        <p class="muted" style="font-size:13px;margin:8px 0 0">המספרים משמשים גם בטופס המודפס – תלמיד יכול לכתוב מספר במקום שם.</p>` : ''}

      <div class="actions"><label class="f" style="width:150px">מספר בחירות לשאלה<select class="inp" data-so-f="k">${[1, 2, 3, 4, 5].map(n => `<option ${c.k === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>

        ${x.id === U.round ? '<span class="pill brand">פעילה</span>' : `<button class="btn sm" data-act="so-ruse" data-id="${x.id}">בחירה</button>`}${c.rounds.length > 1 ? `<button class="btn ghost sm" data-act="so-rdel" data-id="${x.id}" title="מחיקת המדידה">✕</button>` : ''}</div>`).join('')}

}

function entryTab(c, r){
  if (!c.pupils.length) return `<div class="panel empty"><span class="big">👥</span>קודם מוסיפים תלמידים. <a class="btn primary" href="${BASE}/${c.id}/setup">להגדרה</a></div>`;
  if (!c.pupils.some(p => p.id === U.pupil)) U.pupil = (c.pupils.find(p => !['done', 'absent'].includes(pstate(c, r, p.id))) || c.pupils[0]).id;
  const me = U.pupil, A = r.ans[me] || {}, stt = pstate(c, r, me), k = no(c, me);
  const done = c.pupils.filter(p => ['done', 'absent'].includes(pstate(c, r, p.id))).length;

    return `<div class="so-q" style="--qh:${h}"><h4>${qi + 1}. ${esc(q.t)} ${q.kind === 'neg' ? '<span class="so-flag">שלילית</span>' : q.kind === 'perc' ? '<span class="so-flag w">תפיסה</span>' : ''}<span class="cnt">${sel.length}/${L}</span></h4>
      <div class="so-chips">${c.pupils.filter(p => p.id !== me).map(p => { const o = sel.indexOf(p.id); return `<button class="so-chip ${o >= 0 ? 'on' : ''} ${q.kind === 'neg' ? 'neg' : ''}" data-act="so-pick" data-q="${q.id}" data-id="${p.id}" ${o < 0 && full ? 'disabled' : ''}>${o >= 0 ? `<span class="ord">${o + 1}</span>` : `<span class="n">${no(c, p.id)}</span>`}${esc(p.n)}</button>`; }).join('')}</div></div>`; };
  return `${c.rounds.length > 1 ? `<div class="so-bar2 no-print"><span class="lbl">מזינים את:</span>${roundSel(c)}</div>` : ''}
    <div class="progress" style="margin:0 0 12px" title="מילאו ${done} מתוך ${c.pupils.length}"><i style="width:${Math.round(100 * done / c.pupils.length)}%"></i></div>
    <div class="so-tip no-print"><span>👆 בחר תלמיד מהרשימה</span><span class="arr">←</span><span>🔢 לחץ על שמות הילדים שבחר, לפי הסדר</span><span class="arr">←</span><span>✅ ״סיימתי – הבא״</span><button class="btn sm ghost" data-act="so-help" data-v="entry">❓ עוד</button></div>
    <div class="so-entry"><div class="panel" style="padding:10px"><div class="muted" style="font-size:13px;margin:0 4px 6px">מילאו ${done}/${c.pupils.length} · ✓ הושלם ◐ חלקי ✖ נעדר</div>
      <div class="so-plist">${c.pupils.map((p, i) => { const s = pstate(c, r, p.id); return `<button class="so-pbtn ${s} ${p.id === me ? 'on' : ''}" data-act="so-pupil" data-id="${p.id}"><span class="no">${i + 1}</span><span class="nm">${esc(p.n)}</span><span class="mk">${MARK[s]}</span></button>`; }).join('')}</div></div>
    <div><div class="panel" style="margin-bottom:12px"><div class="actions"><h3 style="margin:0;font-size:22px">${k}. ${esc(nm(c, me))}</h3>${stt === 'absent' ? '<span class="so-flag">נעדר / לא ענה</span>' : stt === 'done' ? '<span class="pill brand">✓ הושלם</span>' : ''}
        <span style="margin-inline-start:auto"></span><button class="btn sm" data-act="so-prev">→ הקודם</button><button class="btn sm primary" data-act="so-next">הבא ←</button></div>
      <p class="muted" style="margin:8px 0 0;font-size:13.5px">לוחצים על השמות לפי סדר הבחירה (1 = הבחירה הראשונה). לחיצה נוספת מבטלת. אי אפשר לבחור את עצמו, ואי אפשר לבחור פעמיים.</p></div>
      ${stt === 'absent' ? '<div class="note warn" style="margin-bottom:12px">התלמיד מסומן כנעדר – הבחירות שלו לא נספרות. אפשר לבטל את הסימון.</div>' : ''}
      ${qs.map(qbox).join('')}
      <div class="actions" style="margin-top:6px"><button class="btn primary" data-act="so-done">✓ סיימתי עם ${esc(nm(c, me))} – הבא</button><button class="btn" data-act="so-absent">${stt === 'absent' ? '↩️ ביטול ״נעדר״' : '✖ נעדר / לא ענה'}</button><button class="btn ghost" data-act="so-clear">ניקוי הבחירות שלו</button>
        ${done === c.pupils.length ? `<a class="btn primary" href="${BASE}/${c.id}/map">🕸️ לסוציוגרם ←</a>` : ''}</div></div></div>`;
}

function mapTab(c, r){

    ${A.negOn ? `<button class="btn sm" data-act="so-negt">${U.neg ? '🙈 הסתרת שליליות' : '👁️ הצגת שליליות'}</button>` : ''}<button class="btn sm" data-act="so-big">${U.big ? '🔍 הקטנה' : '🔍 הגדלה'}</button>`;
  const R = recs(A);

    ${R.targets.length ? `<h4 style="margin:10px 0 6px">זקוקים לתשומת לב</h4><div class="so-chips">${R.targets.slice(0, 14).map(i => `<button class="so-chip sm ${A.att[i] === 2 ? 'bad' : ''}" data-act="so-sel" data-id="${i}">${esc(nm(c, i))}</button>`).join('')}</div>` : ''}</div>`;
  return filterBar(c, {extra}) + lowResp(A) + `<div class="so-map"><div><div class="so-svgbox ${U.big ? 'big' : ''}">${sociogram(A, {sel: U.sel})}</div>${legend(A)}</div><div class="so-side">${side}</div></div>`;
}

function profile(A, i, R, compact){
  const c = A.c, r = A.r, s = A.st[i], it = interp(A, i, R), ans = r.ans;
  const chips = (arr, cls) => arr.length ? arr.map(b => `<button class="so-chip sm ${cls || ''} ${A.mut[i].has(b) ? 'mut' : ''}" data-act="so-sel" data-id="${b}" title="${A.mut[i].has(b) ? 'בחירה הדדית' : ''}">${A.mut[i].has(b) ? '⇄ ' : ''}${esc(nm(c, b))}</button>`).join('') : '<span class="muted">—</span>';
  const byQ = A.all.map(q => { const gave = ((ans[i] && !ans[i].absent && ans[i][q.id]) || []).filter(b => A.ids.includes(b)), got = A.ids.filter(a => ans[a] && !ans[a].absent && (ans[a][q.id] || []).includes(i));
    return `<tr><td><span class="so-dot" style="--h:${qh(c, q)};display:inline-block"></span> ${esc(q.s)}</td><td>${chips(gave)}</td><td>${chips(got)}</td></tr>`; }).join('');
  const bcL = A.bc[i] >= 0.12 || A.ap.has(i);
  return `<div class="panel so-pro"><div class="actions" style="margin-bottom:6px"><h3 style="margin:0">${no(c, i)}. ${esc(nm(c, i))}</h3>${badge(s)}${A.att[i] === 2 ? '<span class="so-flag">זקוק לתשומת לב</span>' : A.att[i] === 1 ? '<span class="so-flag w">למעקב</span>' : ''}${bcL ? '<span class="pill brand">🌉 גשר</span>' : ''}
      ${compact ? `<button class="btn ghost sm no-print" data-act="so-bg" style="margin-inline-start:auto" title="סגירה">✕</button>` : ''}</div>
    <div class="so-kv"><div><b>${A.recv[i]}</b><span>בחירות שקיבל</span></div><div><b>${A.out[i].size}</b><span>ילדים שבחר</span></div><div><b>${A.mut[i].size}</b><span>הדדיים</span></div><div><b>${A.reach[i]}</b><span>טווח (2 צעדים)</span></div>${A.negOn ? `<div><b style="color:var(--danger)">${A.nIn[i].size}</b><span>סימנו אותו (−)</span></div>` : ''}<div><b>${A.z[i].toFixed(1)}</b><span>ציון תקן</span></div></div>
    <table class="so-tbl"><thead><tr><th>שאלה</th><th>הוא בחר ב…</th><th>בחרו בו…</th></tr></thead><tbody>${byQ}</tbody></table>
    ${A.negOn ? `<div style="margin-top:8px"><b style="font-size:14px">שאלה שלילית:</b> <span class="muted" style="font-size:13px">הוא סימן:</span> ${chips([...A.nOut[i]], 'bad')} <span class="muted" style="font-size:13px">סימנו אותו:</span> ${chips([...A.nIn[i]], 'bad')}</div>` : ''}
    ${A.perc[i] ? `<div style="margin-top:8px"><b style="font-size:14px">מי לדעתו יבחר בו:</b> ${chips(A.perc[i].L.map(x => x))} <span class="muted" style="font-size:13px">– צדק לגבי ${A.perc[i].hits.length}</span></div>` : ''}
    <h4 style="margin:14px 0 4px">🧠 פרשנות ליועץ</h4>${it.L.map(x => `<p style="margin:0 0 6px;font-size:14.5px">${x}</p>`).join('')}
    <h4 style="margin:12px 0 4px">👣 צעדים הבאים</h4><ul class="so-steps">${it.steps.map(x => `<li>${x}</li>`).join('')}</ul>
    ${it.links.length ? `<div class="actions no-print" style="margin-top:10px">${it.links.map(lk).join('')}</div>` : ''}
    <p class="muted no-print" style="font-size:12.5px;margin:10px 0 0">הפרשנות היא השערה לבדיקה, לא אבחנה. מצליבים עם תצפית, שיחה עם הילד והמחנך ומידע מההורים.</p></div>`;
}

function peopleTab(c, r){
  const A = an(c, r, U.q), nd = needData(c, A); if (nd) return filterBar(c) + nd;
  const R = recs(A), ids = A.ids.slice().sort((a, b) => (A.att[b] - A.att[a]) || (A.recv[a] - A.recv[b]));
  if (!U.sel || !A.ids.includes(U.sel)) U.sel = ids[0];
  return filterBar(c) + lowResp(A) + `<div class="so-map"><div class="so-side" style="order:2">${profile(A, U.sel, R)}</div>
    <div class="panel" style="order:1"><h3>👥 כל התלמידים <small class="muted" style="font-weight:400">מי שזקוק לתשומת לב – ראשון</small></h3>
    <select class="inp no-print" id="so-psel" style="margin-bottom:10px">${ids.map(i => `<option value="${i}" ${i === U.sel ? 'selected' : ''}>${esc(nm(c, i))} – ${esc(ST[A.st[i]].l)}</option>`).join('')}</select>
    <table class="so-tbl"><thead><tr><th>תלמיד</th><th>מעמד</th><th>קיבל</th><th>הדדיים</th></tr></thead><tbody>${ids.map(i => `<tr style="cursor:pointer;${i === U.sel ? 'background:var(--brand-soft)' : ''}" data-act="so-sel" data-id="${i}"><td>${esc(nm(c, i))} ${A.att[i] === 2 ? '<span class="so-flag">!</span>' : ''}</td><td>${badge(A.st[i])}</td><td>${A.recv[i]}${A.negOn && A.nIn[i].size ? ` <span style="color:var(--danger)">(−${A.nIn[i].size})</span>` : ''}</td><td>${A.mut[i].size}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function matrix(A, forPrint){
  const c = A.c, ids = A.ids, single = A.qf !== 'all', ans = A.r.ans;
  const cell = (a, b) => { if (a === b) return '<td class="self"></td>';
    const w = A.W[a][b] || 0, ng = A.nOut[a].has(b); let t = '', cls = '';
    if (w) { t = single ? String(((ans[a] && ans[a][A.qf]) || []).indexOf(b) + 1) : String(w); cls = 'v' + Math.min(3, single ? 3 - Math.min(2, +t - 1) : w); if (A.mut[a].has(b)) cls += ' mut'; }
    if (ng) { t = (t ? t + ' ' : '') + '−'; cls += ' ng'; }
    return `<td class="${cls}" title="${esc(nm(c, a))} ← ${esc(nm(c, b))}">${t}</td>`; };
  return `<div class="so-mtxbox"><table class="so-mtx"><thead><tr><th class="rn">בוחר ↓ / נבחר ←</th>${ids.map((b, k) => `<th title="${esc(nm(c, b))}">${k + 1}</th>`).join('')}<th>נתן</th></tr></thead><tbody>
    ${ids.map((a, k) => `<tr><th class="rn">${k + 1}. ${esc(short(nm(c, a)))}</th>${ids.map(b => cell(a, b)).join('')}<td class="tot">${A.resp.has(a) ? A.out[a].size : '—'}</td></tr>`).join('')}
    <tr class="tot"><th class="rn">קיבל (+)</th>${ids.map(b => `<td>${A.recv[b]}</td>`).join('')}<td>${A.idx.choices}</td></tr>
    <tr class="tot"><th class="rn">הדדיים</th>${ids.map(b => `<td>${A.mut[b].size}</td>`).join('')}<td>${A.idx.pairs}</td></tr>
    ${A.negOn ? `<tr class="tot"><th class="rn" style="color:var(--danger)">קיבל (−)</th>${ids.map(b => `<td style="color:var(--danger)">${A.nIn[b].size || ''}</td>`).join('')}<td>${A.idx.negTot}</td></tr>` : ''}</tbody></table></div>
    <p class="muted" style="font-size:12.5px;margin:6px 0 0">${single ? 'המספר בתא = סדר הבחירה (1 = ראשונה).' : 'המספר בתא = בכמה שאלות בחר בו.'} מסגרת ירוקה = הדדי · − אדום = בחירה שלילית.${forPrint ? '' : ' המספרים בכותרת = מספר התלמיד ברשימה.'}</p>`;
}
function bars(A){

function csvExport(c, r){

  const txt = '﻿' + rows.map(rw => rw.map(v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');

/* ---------- events ---------- */
function pick(c, r, qid, id){
  const q = c.qs.find(x => x.id === qid); if (!q || !U.pupil || id === U.pupil) return;
  const A = r.ans[U.pupil] = r.ans[U.pupil] || {}, arr = A[qid] = A[qid] || [], i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1); else { if (arr.length >= lim(c, q)) return toast(`אפשר לבחור עד ${lim(c, q)}`); arr.push(id); }
  delete A.absent; delete A.done; commit();
}
function step(c, r, dir, skipDone){
  const n = c.pupils.length, k = c.pupils.findIndex(p => p.id === U.pupil);
  for (let s = 1; s <= n; s++) { const p = c.pupils[(k + dir * s + n * 2) % n]; if (!skipDone || !['done', 'absent'].includes(pstate(c, r, p.id))) { U.pupil = p.id; return true; } }
  return false;
}
function dropPupil(c, id){
  c.pupils = c.pupils.filter(p => p.id !== id);
  c.rounds.forEach(r => { delete r.ans[id]; Object.values(r.ans).forEach(A => Object.keys(A).forEach(k => { if (Array.isArray(A[k])) A[k] = A[k].filter(x => x !== id); })); });
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act^="so-"]'); if (!el) return;
  const d = el.dataset, act = d.act;

    const name = ($('#so-nname').value || '').trim(); if (!name) { toast('כותבים שם לכיתה'); $('#so-nname').focus(); return; }
    const date = $('#so-ndate').value || today(), c = {id: uid(), name, grade: $('#so-ngrade').value, date, created: Date.now(), pupils: [], qs: DEFQ(), k: 3, kn: 1, rounds: [{id: uid(), date, label: 'מדידה 1', ans: {}}]};
    store().push(c); api.save(); location.hash = BASE + '/' + c.id + '/setup'; return;
  }
  if (act === 'so-help') { helpModal(d.v); return; }
  if (act === 'so-gjump') { e.preventDefault(); const x = document.getElementById('so-g-' + d.v); if (x) x.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  const c = cur(); if (!c) return; const r = roundOf(c);
  switch (act) {
    case 'so-addp': { const t = $('#so-paste'), have = new Set(c.pupils.map(p => p.n)); let n = 0, dup = 0;
      String(t.value || '').split(/\r?\n|,|;|\t/).map(s => s.replace(/^\s*\d+[.)\-]\s*/, '').trim()).filter(Boolean).forEach(s => { if (have.has(s)) { dup++; return; } have.add(s); c.pupils.push({id: uid(), n: s.slice(0, 40)}); n++; });
      if (!n) return toast(dup ? 'השמות כבר ברשימה' : 'מדביקים שם אחד בכל שורה'); commit(); toast(`נוספו ${n} תלמידים${dup ? ` (${dup} כפולים דולגו)` : ''}`); break; }
    case 'so-delp': { const used = c.rounds.some(x => x.ans[d.id] || Object.values(x.ans).some(A => Object.values(A).some(v => Array.isArray(v) && v.includes(d.id))));
      if (used && !await uiConfirm(`להסיר את ${nm(c, d.id)}? גם הבחירות שלו והבחירות בו יימחקו.`)) return; dropPupil(c, d.id); commit(); break; }
    case 'so-sortp': if (!await uiConfirm('למיין לפי א״ב? המספרים ברשימה ישתנו – אם כבר הדפסת טפסים עם מספרים, עדיף לא.')) return; c.pupils.sort((a, b) => a.n.localeCompare(b.n, 'he')); commit(); break;
    case 'so-qadd': c.qs.push({id: 'q' + uid().slice(-6), kind: 'pos', s: 'שאלה ' + (posQs(c).length + 1), t: 'עם מי היית רוצה…?', on: true, custom: true}); commit(); break;

    case 'so-ruse': U.round = d.id; U.pupil = null; redraw(); break;
    case 'so-rdel': { const x = c.rounds.find(y => y.id === d.id); if (!x || c.rounds.length < 2) return; if (!await uiConfirm(`למחוק את ״${x.label}״ ואת כל התשובות שלה?`)) return; c.rounds = c.rounds.filter(y => y.id !== d.id); if (U.round === d.id) U.round = null; commit(); break; }
    case 'so-delcls': if (await uiConfirm(`למחוק את המפה ״${c.name}״ וכל התשובות שבה?`) && await uiConfirm('בטוח? אי אפשר לבטל.')) { const L = store(); L.splice(L.indexOf(c), 1); U.cls = null; api.save(); location.hash = BASE; } break;
    case 'so-pupil': U.pupil = d.id; redraw(); break;
    case 'so-pick': pick(c, r, d.q, d.id); break;
    case 'so-next': step(c, r, 1, false); redraw(); break;
    case 'so-prev': step(c, r, -1, false); redraw(); break;
    case 'so-done': { const A = r.ans[U.pupil] = r.ans[U.pupil] || {}; if (!A.absent) A.done = true; api.save(); if (!step(c, r, 1, true)) toast('כל התלמידים הוזנו ✓'); redraw(); break; }
    case 'so-absent': { const A = r.ans[U.pupil] = r.ans[U.pupil] || {}; A.absent = !A.absent; delete A.done; if (A.absent) { api.save(); step(c, r, 1, true); redraw(); } else commit(); break; }
    case 'so-clear': { if (!await uiConfirm(`לנקות את הבחירות של ${nm(c, U.pupil)}?`)) return; delete r.ans[U.pupil]; commit(); break; }
    case 'so-q': U.q = d.v; redraw(); break;
    case 'so-layout': U.layout = d.v; redraw(); break;
    case 'so-big': U.big = !U.big; redraw(); break;
    case 'so-negt': U.neg = !U.neg; redraw(); break;
    case 'so-node': U.sel = U.sel === d.id ? null : d.id; redraw(); break;
    case 'so-sel': U.sel = d.id; redraw(); if (U.tab === 'people' || U.tab === 'map') { const s = document.querySelector('.so-side'); if (s && window.innerWidth < 860) s.scrollIntoView({behavior: 'smooth', block: 'start'}); } else location.hash = BASE + '/' + c.id + '/people'; break;
    case 'so-bg': if (U.sel) { U.sel = null; redraw(); } break;
    case 'so-pm': U.pm = d.v; redraw(); break;
    case 'so-csv': csvExport(c, r); break;
  }
});

}
function updFx(){ const r = root(); if (!r) return; const L = fxLayers(); const a = r.querySelector('.ro-fxa'), b = r.querySelector('.ro-fxb'), c = r.querySelector('.ro-circ');
  if (a) a.innerHTML = L.arrows; if (b) b.innerHTML = L.badges; if (c) c.classList.toggle('ro-dg', L.danger);

  if (scroll) { const t = root() && root().querySelector(scroll); if (t && t.getBoundingClientRect().top > window.innerHeight * 0.6 || (t && t.getBoundingClientRect().top < 0)) t.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'start'}); } }

function act(b){

    if (k === 'u') { S.danger = 'yes'; S.sub = v; } else { S.danger = null; S.sub = null; }

function libMatches(keywords){
  const kw = (keywords || []).map(k => k.toLowerCase()).filter(Boolean);
  const seen = new Set(), out = [];
  for (const p of LIBDATA) {
    const hay = (p.title + ' ' + (p.sub || '') + ' ' + p.attachments.map(a => a.name).join(' ')).toLowerCase();
    const hits = kw.filter(k => hay.includes(k)).length;
    if (!hits) continue;
    const sig = p.title + '|' + (p.src ? p.size : '') + '|' + p.attachments.map(a => a.name).join(',');
    if (seen.has(sig)) continue; seen.add(sig); out.push({p, hits: hits + (/ילד|הור|בית ספר|כית/.test(hay) ? 0.5 : 0) + (p.src ? 0 : 0.3)});
  }
  return out.sort((a, b) => b.hits - a.hits).map(x => x.p);
}

const ArtSync = {
  db: null, uid: null, status: 'connecting', err: '', last: 0, timer: null, sent: {}, unsub: null, busy: false,
  async init(){

      await this.pull();
      this.unsub = this.col().onSnapshot(snap => this.onRemote(snap), e => { if (e && e.code === 'revoked') { this.status = 'none'; ui(); } });

  col(){ return this.db.collection('data/users/' + this.uid); },
  fromDocs(docs){

    const order = Array.isArray(m.order) ? m.order : Object.keys(byId);
    return {version: 1, updatedAt: m.updatedAt || 0, students: order.map(id => byId[id]).filter(Boolean).map(x => fix(JSON.parse(JSON.stringify(x))))};
  },
  adopt(remote){ S = remote; ls.set(KEY, S); this.sent = Object.fromEntries(S.students.map(s => [s.id, JSON.stringify(s)])); },
  async pull(){
    const snap = await this.col().get();

function ul(arr){ return arr && arr.length ? `<ul class="clean">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted">—</p>'; }
function chart(points, max = 10, label = ''){
  if (points.length < 2) return `<p class="muted">הגרף יופיע אחרי שני רישומים לפחות.</p>`;
  const W = 600, H = 190, pad = 30, n = points.length;
  const x = i => pad + i * (W - pad * 2) / (n - 1), y = v => H - pad - (v / max) * (H - pad * 2);
  const d = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const grid = [0, max/2, max].map(v => `<line class="axis" x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${W-pad+6}" y="${y(v)+4}">${v}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${grid}<path class="ln" d="${d}"/>
    ${points.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="5"><title>${esc(p.t)}: ${p.v}</title></circle>`).join('')}
    <text class="lbl" x="${pad}" y="${H-8}">${esc(points[0].t)}</text><text class="lbl" x="${W-pad}" y="${H-8}" text-anchor="end">${esc(points[n-1].t)}</text></svg>`;
}

function circlesSVG(){
  const rings = [
    {r: 58, label: 'הילד', items: []},
    {r: 118, label: '', items: ['הורים', 'מורים מקצועיים', 'מחנך']},
    {r: 178, label: '', items: ['יועץ', 'מזכירות']},
    {r: 238, label: '', items: ['הנהלה', 'שפ״ח וגורמי חוץ']},
    {r: 298, label: '', items: ['פיקוח']}
  ];
  const C = 310, fills = ['var(--brand)', 'hsl(160 var(--soft-s) var(--soft-l))', 'hsl(200 var(--soft-s) var(--soft-l))', 'hsl(35 var(--soft-s) var(--soft-l))', 'hsl(270 var(--soft-s) var(--soft-l))'];
  let g = '';
  for (let i = rings.length - 1; i >= 0; i--) g += `<circle cx="${C}" cy="${C}" r="${rings[i].r}" fill="${fills[i]}" stroke="var(--panel)" stroke-width="3"/>`;
  g += `<text x="${C}" y="${C + 7}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">הילד</text>`;
  rings.forEach((ring, i) => {
    if (!i) return;
    const mid = (rings[i - 1].r + ring.r) / 2, n = ring.items.length;
    ring.items.forEach((t, k) => {
      const a = -Math.PI / 2 + (k - (n - 1) / 2) * (n > 2 ? 0.95 : 1.1) + (i % 2 ? 0 : Math.PI);
      const x = C + mid * Math.cos(a), y = C + mid * Math.sin(a);
      g += `<text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)">${t}</text>`;
    });
  });
  return `<svg viewBox="0 0 620 620" style="width:100%;max-width:520px;display:block;margin:0 auto" role="img" aria-label="מעגלי הגורמים סביב הילד">${g}</svg>`;
}

function addPlanFrom(s, pid){
  const p = P[pid]; if (!p || !s) return;
  if (!s.problems.includes(pid)) s.problems.push(pid);
  if (!s.goals.length) s.goals = (p.goals || []).slice();
  p.sessions.forEach(x => s.plan.push({title:x.title, goals:(x.goals || []).slice(), activities:(x.activities || []).slice(), homework:x.homework || '', tool:x.tool || null, done:false, date:'', notes:'', from:pid}));
  save();
}

  match: {

        <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px"><label class="f" style="flex:1;min-width:180px">מדרגה משלי<input class="inp" id="gRungT" placeholder="למשל: לענות על שאלה אחת בכיתה"></label><label class="f">כמה קשה (0–10)<input class="inp" id="gRungS" type="number" min="0" max="10" value="5" style="width:80px"></label><button class="btn" data-act="g-rungadd">＋ הוספה</button></div>

        <div class="gwheel"><svg viewBox="0 0 300 312"><g id="gWheel" style="transform:rotate(${st.angle}deg)">${sl}<circle cx="150" cy="150" r="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/></g><path d="M150,6 L138,-14 L162,-14Z" transform="translate(0,22) rotate(180 150 0)" fill="#1e293b"/></svg>

      const names = d.players || ['אני', 'המנחה'];

    }
  }
};

const GTYPE = {sort: '🗂️ מיון', match: '🃏 זיכרון', story: '📖 סיפור בחירה', detective: '🕵️ בלש', catch: '🫧 תופסים מחשבות', ladder: '🪜 סולם', wheel: '🎡 גלגל', board: '🎲 לוח'};

const gCur = () => { const g = GAME(route().id), G0 = GS[g.id], s = g.stages[G0.stage]; return {g, G0, s, d: s.data, st: G0.st[G0.stage]}; };
function catchRun(g, d, st){
  const ar = $('#gArena'); if (!ar) return;

  const pool = shuffle(d.helpful.map(t => ({t, good: true})).concat(d.unhelpful.map(u => ({t: u.t, alt: u.alt, good: false}))));
  let k = 0;

    const it = pool[k++ % pool.length], b = document.createElement('button');
    b.className = 'gbub'; b.textContent = it.t; b.style.left = (4 + Math.random() * 58) + '%'; b.style.animationDuration = (d.speed || 11) + 's';
    b.onclick = () => {
      if (b.dataset.done) return; b.dataset.done = 1;
      if (it.good) { st.score++; b.classList.add('got'); $('#gSc').textContent = st.score; setTimeout(() => b.remove(), 600); }
      else { st.reframes.push({t: it.t, alt: it.alt}); b.textContent = '✨ ' + it.alt; b.classList.add('flip'); $('#gRf').textContent = st.reframes.length; setTimeout(() => b.remove(), 2600); }

  };
  spawn(); GTIMERS.push(setInterval(spawn, d.every || 1700));
  GTIMERS.push(setInterval(() => { left--; const t = $('#gTm'); if (t) t.textContent = left; if (left <= 0) { gClear(); st.running = false; st.done = true; gStar(g); gConfetti(); render(); } }, 1000));
}
function gameAct(act, d, e){

  if (act === 'g-stage') { gClear(); G0.stage = +d.v; render(); return; }
  if (act === 'g-again') { gClear(); G0.st[G0.stage] = GM[s.type].init(D); render(); return; }
  if (act === 'g-sort') { const c = D.cards[st.order[st.i]]; st.fb = {ok: c.bin === d.v}; if (st.fb.ok) st.ok++; render(); return; }
  if (act === 'g-next') {
    if (s.type === 'story') { st.node = st.pend.next; st.pend = null; if (D.nodes[st.node] && D.nodes[st.node].end) { gStar(g); gConfetti(); } render(); return; }
    st.i++; st.fb = null; if (s.type === 'sort' && st.i >= st.order.length) { gStar(g); gConfetti(); } render(); return;
  }
  if (act === 'g-flip') {
    const i = +d.i; if (st.open.length >= 2 || st.open.includes(i) || st.got.includes(i)) return;
    st.open.push(i); render();
    if (st.open.length === 2) { st.moves++; const [a, b] = st.open.map(x => st.deck[x]);
      if (a.k === b.k && a.s !== b.s) { st.got.push(...st.open); st.open = []; setTimeout(() => { if (st.got.length === st.deck.length) { gStar(g); gConfetti(); } render(); }, 450); }
      else setTimeout(() => { st.open = []; render(); }, 1100); }
    return;
  }
  if (act === 'g-choice') { st.pend = D.nodes[st.node].choices[+d.i]; render(); return; }
  if (act === 'g-clue') { const c = D.clues[st.order[st.i]]; st.fb = {ok: c.side === d.v}; if (st.fb.ok) st.ok++; render(); return; }
  if (act === 'g-opt') { st.pick = +d.i; if (D.options[st.pick].good) { gStar(g); gConfetti(); } render(); return; }
  if (act === 'g-catchgo') { st.running = true; st.score = 0; st.reframes = []; render(); return; }
  if (act === 'g-rung') { const k = d.v; st.done = st.done.includes(k) ? st.done.filter(x => x !== k) : st.done.concat(k); const total = D.steps.length + st.custom.length; if (st.done.length === total) { gStar(g); gConfetti(); } render(); return; }
  if (act === 'g-rungadd') { const t = ($('#gRungT').value || '').trim(); if (!t) return toast('כותבים מדרגה'); st.custom.push({t, suds: Math.max(0, Math.min(10, +$('#gRungS').value || 5))}); render(); return; }
  if (act === 'g-spin') {
    if (st.spinning) return; const n = D.slices.length, A = 360 / n, k = Math.floor(Math.random() * n);
    const base = st.angle - (st.angle % 360) + 360 * 5; st.angle = base + (360 - (k + .5) * A); st.spinning = true; st.pick = null;
    const w = $('#gWheel'); if (w) { w.style.transition = 'transform 3.6s cubic-bezier(.17,.67,.2,1)'; w.style.transform = `rotate(${st.angle}deg)`; }
    const b = e.target.closest('button'); if (b) b.disabled = true;
    setTimeout(() => { const sl = D.slices[k], used = st.used[k] = st.used[k] || [], fresh = sl.items.filter(x => !used.includes(x)); const item = pickOne(fresh.length ? fresh : sl.items); used.push(item); st.pick = {k, item}; st.spinning = false; render(); }, 3700);
    return;
  }
  if (act === 'g-roll') {
    if (st.busy || st.win != null) return; st.busy = true; render();
    const N = D.spaces || 24, keys = D.pattern || Object.keys(D.deck);
    setTimeout(() => {
      const n = 1 + Math.floor(Math.random() * 6); st.die = n; let steps = n;
      const walk = () => {
        if (steps <= 0 || st.pos[st.turn] >= N) {
          st.busy = false; const p = st.pos[st.turn];
          if (p >= N) { st.win = st.turn; gStar(g); gConfetti(); render(); return; }
          const k = keys[(p - 1) % keys.length], deck = D.deck[k], used = st.used[k] = st.used[k] || [], fresh = deck.items.filter(x => !used.includes(x));
          const item = pickOne(fresh.length ? fresh : deck.items); used.push(item); st.card = {k, item}; render(); return;
        }
        st.pos[st.turn]++; steps--; render(); GTIMERS.push(setTimeout(walk, 260));
      };
      walk();
    }, 700);
    return;
  }
  if (act === 'g-cardok') { st.card = null; st.turn = 1 - st.turn; render(); return; }
}

/* 📘 חוברות מטופלים – אריאל חן (tracks-ac.js): a hub under 🧭 טיפול לפי בעיה – no NAV entry; the page and its tracks lead back to #/problems */
HUBS.ariel = {flag: 'ariel', guide: 'ac-guide', back: ['problems', 'טיפול לפי בעיה'], title: 'חוברות מטופלים – אריאל חן', icon: '📘', say: 'ארבע חוברות עבודה – ואנחנו מתאימים כל טופס לילד שמולנו 📘', intro: '📘 ארבע חוברות העבודה למטופל מסדרת ״צעד צעד – טיפול התנהגותי-קוגניטיבי״ של אריאל חן: פאניקה ואגורפוביה, דיכאון, חרדה חברתית ו-OCD. המדריך (מה בחוברות, מה משותף לכולן, איך משלבים טופס במפגש, התאמה לפי גיל, להורים ולמחנך, ומה לא לוקחים ליסודי), ומסלול אינטראקטיבי לכל חוברת: מבנה הטיפול מפגש אחרי מפגש, המודל הפסיכו-חינוכי בתרשימים, הטפסים המרכזיים כטפסים למילוי (בניסוח שלנו), משימות בית, להורים ומניעת הישנות. לכל פריט מצוינים הטופס והעמוד, וכל טופס נפתח בעמוד שלו בקובץ. החוברות נכתבו למבוגרים – ההתאמות לילדים מסומנות; הצד הטיפולי והצד המשמעתי-מנהלי מופרדים.', extra: [['#/problem/social-anxiety', '🙈', 'מפה: חרדה חברתית'], ['#/problem/low-mood', '🌧️', 'מפה: מצב רוח ירוד'], ['#/problem/ocd', '🔁', 'מפה: OCD'], ['#/problem/gad', '💭', 'מפה: דאגנות וחרדה'], ['#/quest', '📋', 'שאלונים ומדדים'], ['#/circ/c11', '📜', 'אובדנות – חוזר 0473'], ['#/circ/c07/c07-emotional-support-parent-consent', '📜', 'הסכמת הורים למענה רגשי (0482)']]};
function hubView(R){
  const h = HUBS[R.r]; const all = TRACKS().filter(t => t[h.flag]), guide = h.guide && all.find(t => t.id === h.guide), list = all.filter(t => t !== guide);
  const H = hubHue(R.r), card = t => `<a class="card accent hubc" href="#/track/${t.id}" style="--h:${t.hue ?? H}"><span class="emoji">${t.icon || h.icon}</span><span class="name">${esc(t.title)}</span><span class="sub">${esc(t['for'] || '')} · ${t.steps.length} שלבים</span></a>`;
  return {title: h.title, html: `${h.back ? `<a class="back no-print" href="#/${h.back[0]}">→ ${esc(h.back[1])}</a>` : ''}${hubHero(R.r, h.icon, h.title, all.length)}${gGuide(h.say, 'שמחה', 6)}<div class="note" style="margin:4px 0 16px">${h.intro} ${active() ? `הכול נשמר בתיק של <b>${esc(active().alias)}</b>.` : ''}</div>${infog(R.r, all)}${hubMap([guide, ...list].filter(Boolean), H)}
    ${guide ? `<a class="card" href="#/track/${guide.id}" style="margin-bottom:16px;border:2px solid var(--brand)"><span class="emoji">${guide.icon}</span><span class="name">${esc(guide.title)}</span><span class="sub">${guide.steps.length} שלבים · מתחילים כאן</span></a>${h.areas ? '' : '<h2 class="sec">📚 לפי נושאים</h2>'}` : ''}
    ${h.areas && list.length ? h.areas.map(([k, i, l]) => { const inA = list.filter(t => t.distArea === k), ov = inA.find(t => t.distOverview), rest = inA.filter(t => t !== ov);
      return `<h2 class="sec">${i} ${esc(l)}</h2>${ov ? `<a class="card" href="#/track/${ov.id}" style="margin-bottom:10px;border:2px solid var(--brand)"><span class="emoji">${ov.icon || i}</span><span class="name">${esc(ov.title)}</span><span class="sub">${ov.steps.length} שלבים · סקירת התחום</span></a>` : ''}${rest.length ? `<div class="grid" style="margin-bottom:16px">${rest.map(card).join('')}</div>` : ''}`; }).join('')
    : list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<div class="empty">🛠️ התוכן של המדור הזה בהכנה ויעלה בקרוב.</div>'}

/* .ics for Google Calendar / Outlook – floating local times; the student link and category stay out of the file */
function dyICS(){
  const L = dyList(); if (!L.length) return toast('אין עדיין רשומות לייצוא');
  const ic = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const dt = s => s.replace(/-/g, ''), tm = t => t.replace(':', '') + '00';
  const plus1h = t => { const [h, m] = t.split(':').map(Number); const x = Math.min(h * 60 + m + 60, 23 * 60 + 59); return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CBT school counseling//Diary//HE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + ic('יומן ייעוץ')];
  for (const e of L) {
    if (!dyParse(e.date)) continue;
    out.push('BEGIN:VEVENT', 'UID:' + e.id + '@cbt-diary', 'DTSTAMP:' + stamp);
    if (e.time) { out.push('DTSTART:' + dt(e.date) + 'T' + tm(e.time), 'DTEND:' + dt(e.date) + 'T' + tm(e.end && e.end > e.time ? e.end : plus1h(e.time))); }
    else out.push('DTSTART;VALUE=DATE:' + dt(e.date), 'DTEND;VALUE=DATE:' + dt(dyYmd(dyAdd(dyParse(e.date), 1))));
    out.push('SUMMARY:' + ic(e.title));
    if (e.notes) out.push('DESCRIPTION:' + ic(e.notes));
    if (e.rep) {
      out.push('RRULE:FREQ=' + (e.rep.freq === 'weekly' ? 'WEEKLY' : 'MONTHLY') + ';UNTIL=' + dt(e.rep.until) + (e.time ? 'T235959' : ''));
      (e.skip || []).forEach(s => out.push(e.time ? 'EXDATE:' + dt(s) + 'T' + tm(e.time) : 'EXDATE;VALUE=DATE:' + dt(s)));
    }
    out.push('END:VEVENT');
  }
  out.push('END:VCALENDAR');
  const enc = new TextEncoder();   // fold lines at 75 octets without splitting a character
  const fold = line => { const parts = []; let cur = '', n = 0; for (const ch of line) { const b = enc.encode(ch).length; if (n + b > (parts.length ? 74 : 75)) { parts.push(cur); cur = ''; n = 0; } cur += ch; n += b; } parts.push(cur); return parts.join('\r\n '); };
  const blob = new Blob([out.map(fold).join('\r\n') + '\r\n'], {type: 'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'יומן-ייעוץ-' + dyNow() + '.ics'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(`יוצאו ${L.length} רשומות – פותחים את הקובץ ב-Google Calendar או ב-Outlook`);
}
function dySelect(s, el){
  DY_SEL = s;
  document.querySelectorAll('.dycell.sel').forEach(c => c.classList.remove('sel')); if (el) el.classList.add('sel');
  const p = $('#dysel'); if (!p) return;
  p.innerHTML = dyDayHTML(s); try { kidifyEmojis(p); } catch(e){}
  if (innerWidth <= 760) p.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dy]'); if (!b) return;
  const a = b.dataset.dy, d = b.dataset.d;
  if (a === 'done') return;
  if (a === 'sel') return dySelect(d, b);
  if (a === 'add') { e.stopPropagation(); return dyForm(null, d); }
  if (a === 'edit') { e.stopPropagation(); return dyForm(b.dataset.id, d); }
  if (a === 'ics') return dyICS();
});
document.addEventListener('dblclick', e => { const c = e.target.closest('.dycell[data-d]'); if (c && !e.target.closest('[data-dy="edit"],[data-dy="add"]')) dyForm(null, c.dataset.d); });
document.addEventListener('keydown', e => { const c = e.target.closest && e.target.closest('.dycell[data-d]'); if (!c || e.target !== c) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dySelect(c.dataset.d, c); }
  else if (e.key === 'n' || e.key === '+') { e.preventDefault(); dyForm(null, c.dataset.d); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-dyl]')) { DY_L[t.dataset.dyl] = t.checked; ls.set('cbtapp.diary.layers', DY_L); render(); }
  else if (t.matches('[data-dy="done"]')) {
    const x = dyList().find(y => y.id === t.dataset.id); if (!x) return;
    if (x.rep) { const set = new Set(x.doneOn || []); t.checked ? set.add(t.dataset.d) : set.delete(t.dataset.d); x.doneOn = [...set]; } else x.done = t.checked;
    save();
    document.querySelectorAll(`[data-id="${CSS.escape(x.id)}"][data-d="${t.dataset.d}"]`).forEach(n => { const r = n.closest('.dyrow') || (n.classList.contains('dyent') ? n : null); if (r) r.classList.toggle('done', t.checked); });
  }
  else if (t.id === 'dyjump' && /^\d{4}-\d{2}$/.test(t.value)) location.hash = `#/diary/month/${t.value}`;
});
