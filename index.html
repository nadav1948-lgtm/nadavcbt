<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d1a">
<title>האתר של נדב דוד – יועץ חינוכי ומטפל CBT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235b3fe0'/><text x='50' y='68' font-size='56' text-anchor='middle'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Dark-first, matching the library site (Artlist-inspired): near-black grounds, bold white type, one yellow accent. */
:root{
  color-scheme: dark;
  --bg:#0d0d0d; --bg2:#171717; --panel:#1c1c1c; --ink:#ffffff; --muted:#9a9a9a; --line:#2c2c2c;
  --brand:#ffda2a; --brand-2:#e6c21f; --brand-soft:rgba(255,218,42,.13); --brand-ink:#171717; --brand-text:#ffda2a;
  --accent:#f2a93b; --danger:#ff6b61; --ok:#3fb56c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --shadow-hi:0 14px 40px rgba(0,0,0,.55);
  --r:14px; --soft-s:35%; --soft-l:20%; --sat:60%; --lt:62%;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ffffff; --bg2:#f4f4f4; --panel:#ffffff; --ink:#171717; --muted:#6b6b6b; --line:#e7e7e7;
  --brand:#ffda2a; --brand-2:#e6c21f; --brand-soft:rgba(255,218,42,.25); --brand-ink:#171717; --brand-text:#8a6a00;
  --danger:#c8423b; --ok:#2f9a5a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
  --shadow-hi:0 14px 36px rgba(0,0,0,.14);
  --soft-s:70%; --soft-l:93%; --sat:58%; --lt:42%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Heebo,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;text-wrap:balance;font-weight:800}

/* layout */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:18px 14px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 18px;text-decoration:none}
.brand .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-size:20px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.nav a .i{font-size:19px;width:24px;text-align:center}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding:0 28px 90px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:66px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.topbar .title{font-weight:700;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px}
.who select{border:0;background:none;max-width:170px;outline:none;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--bg2);cursor:pointer;border:0;text-align:start}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#aaa;flex:0 0 auto}
.sync.ok .dot{background:var(--ok)} .sync.warn .dot{background:var(--accent)} .sync.err .dot{background:var(--danger)}
.tabbar{display:none}

/* common */
.page{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:44px 40px;color:#fff;margin:6px 0 22px;isolation:isolate;background:#0a0a0a;border:1px solid #222}
.hero::before{content:'';position:absolute;inset:-40%;z-index:-1;background:radial-gradient(40% 50% at 80% 25%,rgba(255,218,42,.20),transparent 70%),radial-gradient(35% 45% at 15% 75%,rgba(74,156,138,.30),transparent 70%),radial-gradient(30% 40% at 55% 115%,rgba(120,90,255,.22),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.05)}}
@media (prefers-reduced-motion: reduce){.hero::before{animation:none}}
.hero h1{margin:0 0 10px;font-size:clamp(30px,4.6vw,54px);font-weight:900;letter-spacing:-1px;line-height:1.05}
.hero p{margin:0;opacity:.92;max-width:640px}
.hero .actions{margin-top:20px}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.hero .btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
h2.sec{font-size:20px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec small{font-size:14px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.card{--h:160;position:relative;display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;cursor:pointer;overflow:hidden;min-width:0}
.card.accent::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:hsl(var(--h) var(--sat) var(--lt))}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.card .emoji{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:hsl(var(--h) var(--soft-s) var(--soft-l))}
.card .name{font-weight:600;font-size:16.5px}
.card .sub{font-size:13.5px;color:var(--muted)}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel + .panel{margin-top:14px}
.panel h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--bg2);border-radius:30px;padding:8px 16px;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .12s,border-color .12s,background .12s;white-space:nowrap}
.btn:hover{border-color:var(--brand-text);transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand-text);color:#fff;font-weight:500}

.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand-text);color:#fff}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 18px;scrollbar-width:thin}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--brand-text);border-bottom-color:var(--brand-text)}
ul.clean{margin:0;padding:0 18px 0 0}
ul.clean li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:46px;display:block;margin-bottom:6px}
.banner{--h:160;position:relative;overflow:hidden;isolation:isolate;border-radius:18px;padding:30px 30px;color:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 18px;background:#0a0a0a;border:1px solid #222}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 100% at 85% 0%,hsl(var(--h) 60% 35% / .75),transparent 70%),radial-gradient(40% 80% at 10% 100%,hsl(calc(var(--h) + 40) 60% 30% / .5),transparent 70%)}
.banner h1{font-weight:900;letter-spacing:-.5px}
.banner .emoji{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:32px;flex:0 0 auto}
.banner h1{margin:0;font-size:clamp(21px,3vw,29px)}
.banner p{margin:4px 0 0;opacity:.9}
.banner .actions{margin-inline-start:auto}
.banner .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.back{display:inline-flex;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-top:4px}
.back:hover{color:var(--brand-text)}
.note{background:var(--brand-soft);border-radius:14px;padding:12px 16px;font-size:14.5px}
.note.warn{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.note.danger{background:color-mix(in srgb,var(--danger) 14%,var(--panel))}

/* model diagram */
.model{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.model .box{border-radius:14px;padding:12px 14px;background:var(--bg2);font-size:14px}
.model .box b{display:block;margin-bottom:6px;font-size:14.5px}
.model .box.t{background:hsl(210 var(--soft-s) var(--soft-l))}
.model .box.f{background:hsl(0 var(--soft-s) var(--soft-l))}
.model .box.b{background:hsl(35 var(--soft-s) var(--soft-l))}
.model .box.a{background:hsl(145 var(--soft-s) var(--soft-l))}
.model .trig{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line)}

/* sessions */
.sess{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.sess summary{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;font-weight:600;list-style:none}
.sess summary::-webkit-details-marker{display:none}
.sess summary .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:14px;flex:0 0 auto}
.sess summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--muted)}
.sess[open] summary .chev{transform:rotate(-90deg)}
.sess .body{padding:0 16px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sess .body h4{margin:4px 0;font-size:13.5px;color:var(--muted)}
.sess.done summary .n{background:var(--ok);color:#fff}

/* forms */
.form{display:grid;gap:12px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:15px;outline:none;width:100%}
label.f textarea,.inp.ta{min-height:80px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{border-color:var(--brand-text)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--brand-text)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:20px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .2s ease}
.modal.big .box{width:min(1100px,100%);height:92vh;padding:0;display:flex;flex-direction:column;overflow:hidden}
.modal .mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal.big .mhead{padding:10px 14px;margin:0;border-bottom:1px solid var(--line)}
.modal .mhead h3{margin:0;flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal iframe{flex:1;border:0;width:100%;background:#fff}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

/* student */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.li .grow{flex:1;min-width:0}
.li .date{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:190px}
.chart .axis{stroke:var(--line)}
.chart .lbl{fill:var(--muted);font-size:11px}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5}
.chart .pt{fill:var(--panel);stroke:var(--brand);stroke-width:2.5}

/* kid tools */
.toolstage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);min-height:420px}
.kid{font-size:19px}
.kid h2{font-size:26px;margin:0 0 6px;text-align:center}
.kid .lead{text-align:center;color:var(--muted);margin:0 0 18px}
.thermo{display:flex;gap:26px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.thermo .bar{display:flex;flex-direction:column-reverse;gap:4px;width:120px}
.thermo .lvl{height:36px;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer;font-weight:700;color:#fff;transition:transform .12s;opacity:.45}
.thermo .lvl.on{opacity:1;transform:scale(1.06);border-color:var(--ink)}
.thermo .lvl.fill{opacity:1}
.thermo .face{font-size:90px;text-align:center;line-height:1}
.emos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.emos button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 14px;font-size:17px;cursor:pointer}
.emos button.on{border-color:var(--brand-text);background:var(--brand-soft)}
/* the living scene: a Hardal boy in a park next to a big thermometer; everything follows data-emo + --k (0–1) */
.scenewrap{position:relative;max-width:640px;margin:0 auto}
.scene{width:100%;height:auto;display:block;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.25);touch-action:none;user-select:none}
.scene .thermo{cursor:pointer}
.scene .thtick:hover text{fill:#2563eb}
#thMerc{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s cubic-bezier(.34,1.56,.64,1),fill .7s}
#thBulb{transition:fill .7s}
.bubble{position:relative;display:table;margin:0 auto 14px;max-width:92%;z-index:2;background:#fff;color:#1f2937;border:2px solid #e2e8f0;border-radius:18px;padding:9px 13px;font-size:16px;line-height:1.45;text-align:center;box-shadow:0 6px 18px rgba(15,23,42,.18)}
.bubble:after{content:'';position:absolute;bottom:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.pop{animation:k-pop .45s ease}
.emos button{transition:transform .15s}
.emos button:active{transform:scale(.94)}
.emos button .em{display:inline-block}
.emos button.on .em{animation:k-pop .5s ease}
/* poses: arm angles, head tilt */
.scene{--aR:-6deg;--aL:6deg;--hy:0px;--ht:0deg}
.scene .armL,.scene .armR,.scene .headg,.scene .kidmove{transform-box:view-box}
.scene .armR{transform-origin:0 0;transform:rotate(var(--aR));transition:transform .8s cubic-bezier(.34,1.3,.64,1)}
.scene .armL{transform-origin:0 0;transform:rotate(var(--aL));transition:transform .8s cubic-bezier(.34,1.3,.64,1)}
.scene .headg{transform-origin:0 -112px;transform:translateY(var(--hy)) rotate(var(--ht));transition:transform .8s ease}
.scene .kidmove{transform-origin:0 0;animation:k-idle 3.2s ease-in-out infinite}
.scene[data-emo="שמחה"]{--aR:calc(-35deg - 115deg * var(--k));--aL:calc(35deg + 115deg * var(--k));--ht:calc(-4deg * var(--k))}
.scene[data-emo="רוגע"]{--aR:-16deg;--aL:16deg}
.scene[data-emo="פחד"]{--aR:calc(30deg + 128deg * var(--k));--aL:calc(-30deg - 128deg * var(--k));--hy:calc(4px * var(--k))}
.scene[data-emo="דאגה"]{--aR:calc(18deg + 28deg * var(--k));--aL:calc(-18deg - 28deg * var(--k));--ht:calc(-7deg * var(--k))}
.scene[data-emo="כעס"]{--aR:calc(-8deg - 22deg * var(--k));--aL:calc(8deg + 22deg * var(--k))}
.scene[data-emo="עצב"]{--aR:4deg;--aL:-4deg;--hy:calc(8px * var(--k));--ht:calc(10deg * var(--k))}
.scene[data-emo="בושה"]{--aR:calc(50deg + 115deg * var(--k));--aL:-8deg;--hy:calc(6px * var(--k));--ht:calc(-12deg * var(--k))}
.scene[data-emo="תסכול"]{--aR:calc(-30deg - 75deg * var(--k));--aL:calc(30deg + 75deg * var(--k));--ht:calc(5deg * var(--k))}
/* movement: the stronger the feeling, the bigger the motion */
.scene[data-emo="שמחה"] .kidmove{animation:k-jump .75s ease-in-out infinite}
.scene[data-emo="רוגע"] .kidmove{animation:k-breathe 4.5s ease-in-out infinite}
.scene[data-emo="פחד"] .kidmove{animation:k-tremble .11s linear infinite alternate}
.scene[data-emo="דאגה"] .kidmove{animation:k-pace 3s ease-in-out infinite}
.scene[data-emo="כעס"] .kidmove{animation:k-stomp .55s ease-in-out infinite}
.scene[data-emo="עצב"] .kidmove{animation:k-slump 4s ease-in-out infinite}
.scene[data-emo="בושה"] .kidmove{animation:k-shrink 3s ease-in-out infinite}
.scene[data-emo="תסכול"] .kidmove{animation:k-stomp .9s ease-in-out infinite}
@keyframes k-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes k-jump{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(calc(1 - .05 * var(--k)))}50%{transform:translateY(calc(-30px * var(--k))) scaleY(1.02)}}
@keyframes k-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,1.035)}}
@keyframes k-tremble{from{transform:translateX(calc(-3px * var(--k)))}to{transform:translateX(calc(3px * var(--k)))}}
@keyframes k-pace{0%,100%{transform:translateX(calc(-20px * var(--k)))}50%{transform:translateX(calc(20px * var(--k)))}}
@keyframes k-stomp{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(calc(-9px * var(--k))) rotate(calc(-3deg * var(--k)))}60%{transform:translateY(0) rotate(calc(3deg * var(--k)))}}
@keyframes k-slump{0%,100%{transform:translateY(calc(5px * var(--k))) rotate(-1.5deg)}50%{transform:translateY(calc(7px * var(--k))) rotate(1.5deg)}}
@keyframes k-shrink{0%,100%{transform:scale(calc(1 - .07 * var(--k)))}50%{transform:scale(calc(1 - .09 * var(--k))) translateX(-2px)}}
/* face life: blinking and looking around */
.scene .k-eyes{transform-box:fill-box;transform-origin:center;animation:k-blink 4.2s infinite}
.scene .k-look{animation:k-look 6s ease-in-out infinite}
.scene .k-tear{animation:k-fall 1.6s ease-in infinite}
.scene .k-sweat{animation:k-fall 2s ease-in infinite}
.scene .k-d2{animation-delay:.8s}
.scene .k-steam circle{animation:k-rise 1.4s ease-out infinite}
.scene .k-steam circle:nth-child(even){animation-delay:.7s}
.scene .k-stars path{transform-box:fill-box;transform-origin:center;animation:k-twinkle 1.2s ease-in-out infinite}
.scene .k-stars path:nth-child(2n){animation-delay:.6s}
.scene .tzitzit{animation:k-swing 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
/* weather and background */
.scene .sky-gray,.scene .sky-hot,.scene .sky-night,.scene .sky-dim,.scene .night,.scene .darkclouds,.scene .rain,.scene .heat,.scene .storm,.scene .birds,.scene .rainbow{opacity:0;transition:opacity 1.1s}
.scene .sun{transition:opacity 1.1s;opacity:1}
.scene .rays{transform-box:fill-box;transform-origin:center;animation:k-spin 24s linear infinite}
.scene .cloud{animation:k-drift 26s ease-in-out infinite alternate}
.scene .c2{animation-duration:34s;animation-direction:alternate-reverse}
.scene .rain line{animation:k-rain .6s linear infinite}
.scene .tw{animation:k-twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .bolt{animation:k-flash 2.4s infinite}
.scene .birds path{animation:k-fly 9s linear infinite}
.scene .flower .fl{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.45);transition:transform 1s cubic-bezier(.34,1.56,.64,1)}
.scene .tree{transform-box:fill-box;transform-origin:50% 100%}
.scene[data-emo="שמחה"] .rainbow{opacity:calc(var(--k) * 1.2 - .15)}
.scene[data-emo="שמחה"] .birds{opacity:calc(var(--k) * 1.5 - .3)}
.scene[data-emo="שמחה"] .flower .fl{transform:scale(calc(.5 + .8 * var(--k)))}
.scene[data-emo="רוגע"] .flower .fl{transform:scale(.8)}
.scene[data-emo="עצב"] .sky-gray{opacity:calc(.15 + .7 * var(--k))}
.scene[data-emo="עצב"] .darkclouds{opacity:calc(var(--k) * 1.3)}
.scene[data-emo="עצב"] .rain{opacity:calc((var(--k) - .3) * 1.7)}
.scene[data-emo="עצב"] .sun{opacity:calc(1 - 1.2 * var(--k))}
.scene[data-emo="עצב"] .flower .fl{transform:scale(.35) rotate(18deg)}
.scene[data-emo="דאגה"] .sky-gray{opacity:calc(.1 + .45 * var(--k))}
.scene[data-emo="דאגה"] .darkclouds{opacity:calc(var(--k) * .8)}
.scene[data-emo="דאגה"] .sun{opacity:calc(1 - .8 * var(--k))}
.scene[data-emo="דאגה"] .tree{animation:k-wind 1.5s ease-in-out infinite}
.scene[data-emo="פחד"] .sky-night{opacity:calc(.2 + .75 * var(--k))}
.scene[data-emo="פחד"] .night{opacity:calc(var(--k) * 1.4)}
.scene[data-emo="פחד"] .sun{opacity:calc(1 - 1.4 * var(--k))}
.scene[data-emo="פחד"] .tree{animation:k-wind 2.4s ease-in-out infinite}
.scene[data-emo="כעס"] .sky-hot{opacity:calc(.1 + .65 * var(--k))}
.scene[data-emo="כעס"] .heat{opacity:calc(var(--k) - .25)}
.scene[data-emo="כעס"] .flower .fl{transform:scale(.4)}
.scene[data-emo="בושה"] .sky-dim{opacity:calc(.1 + .8 * var(--k))}
.scene[data-emo="תסכול"] .storm{opacity:calc(var(--k) * 1.3 - .1)}
.scene[data-emo="תסכול"] .sky-gray{opacity:calc(.35 * var(--k))}
@keyframes k-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

@keyframes k-rise{0%{transform:translateY(8px) scale(.6);opacity:0}30%{opacity:.95}100%{transform:translateY(-26px) scale(1.2);opacity:0}}
@keyframes k-twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.6}50%{transform:scale(1.2) rotate(20deg);opacity:1}}
@keyframes k-swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes k-spin{to{transform:rotate(360deg)}}

button.econ:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.econ.on{border-style:solid;color:var(--ink);box-shadow:var(--shadow)}
.econ.es-sup{border-color:#22c55e;background:color-mix(in srgb,#22c55e 16%,var(--panel))}
.econ.es-mix{border-color:#f59e0b;background:color-mix(in srgb,#f59e0b 16%,var(--panel))}
.econ.es-str{border-color:#ef4444;background:color-mix(in srgb,#ef4444 14%,var(--panel))}
/* treatment agreement + parent-meeting timeline */
.agree{max-width:560px;margin:0 auto;border-radius:18px;padding:14px 16px;background:color-mix(in srgb,#c4b5fd 14%,var(--panel));border:2px solid color-mix(in srgb,#a78bfa 55%,var(--line));box-shadow:var(--shadow)}
.agh{font-weight:800;font-size:17px;text-align:center;margin-bottom:8px}
.agr{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.agr span{color:var(--muted)}.agr b{font-weight:600;white-space:pre-wrap}
.agsig{display:flex;justify-content:space-around;gap:6px;margin-top:12px;font-size:13px;color:var(--muted)}
.agsig span{border-top:1.5px solid var(--muted);padding-top:3px;min-width:25%;text-align:center}
.wvtime{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.wvtime li label{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;cursor:pointer;padding:6px 0;position:relative}
.wvtime li input{position:absolute;opacity:0}
.wvtime li:not(:last-child) label::after{content:'';position:absolute;inset-inline-start:14px;top:34px;bottom:-6px;width:2px;background:var(--line)}
.tdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg);border:2px solid var(--line);position:relative;z-index:1}
.wvtime li.on .tdot{background:#22c55e;border-color:#22c55e;color:#fff}
.wvtime li label:has(input:focus-visible) .tdot{outline:2px solid var(--brand-text)}
/* baseline gauge */
.gauge{display:grid;grid-template-columns:70px 1fr 54px;gap:14px;align-items:center}
.thermo{display:flex;flex-direction:column;align-items:center}
.thermo .tube{width:20px;height:130px;border-radius:10px 10px 0 0;background:var(--bg);border:2px solid var(--line);border-bottom:0;position:relative;overflow:hidden}
.thermo .tube i{position:absolute;bottom:0;left:0;right:0;transition:height .4s,background .4s}
.thermo .bulb{width:42px;height:42px;border-radius:50%;margin-top:-4px;display:grid;place-items:center;color:#fff;font-weight:800;border:2px solid var(--line)}
.thermo small{font-size:11.5px;color:var(--muted);margin-top:3px;text-align:center}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(70px,30%) 1fr 58px;gap:8px;align-items:center;font-size:13.5px}
.bt{position:relative;height:14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bt i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:8px;background:linear-gradient(90deg,#7dd3fc,#38bdf8);transition:width .4s}
.bt i.over{background:linear-gradient(90deg,#fca5a5,#ef4444)}
.bt u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.tlight{display:grid;gap:6px;background:#1f2937;padding:8px;border-radius:14px;justify-items:center}
.tlight i{width:24px;height:24px;border-radius:50%;opacity:.22}
.tlight .r{background:#ef4444}.tlight .y{background:#facc15}.tlight .g{background:#22c55e}
.tlight.l-r .r,.tlight.l-y .y,.tlight.l-g .g{opacity:1;box-shadow:0 0 12px currentColor}
.tlight.l-r .r{color:#ef4444}.tlight.l-y .y{color:#facc15}.tlight.l-g .g{color:#22c55e}
/* formulation overview: the 5P flower + cycle + goals */
.fflow{position:relative;display:grid;grid-template-columns:1fr 1.15fr 1fr;grid-template-rows:auto auto;gap:14px 16px;align-items:stretch}
.fflines{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.fflines path{stroke:var(--muted);stroke-width:.5;stroke-dasharray:1.5 1.5;fill:none;opacity:.7}
.fpet,.fcore{position:relative;z-index:1;border-radius:22px;padding:10px 12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 30%,var(--panel));display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;box-shadow:var(--shadow);transition:background .3s}
.fpet b,.fcore b{font-size:14px}
.fp-predisposing{grid-column:1;grid-row:1;border-start-start-radius:6px}.fp-precipitating{grid-column:1;grid-row:2;border-end-start-radius:6px}
.fp-perpetuating{grid-column:3;grid-row:1;border-start-end-radius:6px}.fp-protective{grid-column:3;grid-row:2;border-end-end-radius:6px}
.fcore{grid-column:2;grid-row:1/3;justify-content:center;text-align:center;border-radius:50%/42%;border-width:3px;min-height:170px;padding:18px}
.fcore b{font-size:15.5px}
.fvcyc .cycwrap{max-width:480px}
.fgoals{display:grid;gap:8px}
.fgoal{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid #22c55e;border-radius:14px;padding:8px 10px}
.fgoal small{display:block;font-size:13px;margin-top:2px}
.fgn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#22c55e 22%,var(--panel));font-weight:800}
/* session roadmap (stepping stones) */
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 10px;padding:6px 0}
.stone{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px;line-height:1.3}
.stone:nth-child(even){margin-top:18px}
.stone:not(:last-child)::after{content:'';position:absolute;top:21px;inset-inline-start:calc(50% + 24px);width:calc(100% - 38px);border-top:2px dashed var(--line)}
.stone .sn{width:44px;height:44px;border-radius:46% 54% 52% 48%;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,#a7f3d0 40%,var(--panel));border:2px solid #34d399;box-shadow:var(--shadow);transition:transform .2s}
.stone.empty .sn{background:var(--bg);border-color:var(--line);border-style:dashed}
.stone.empty .stt{color:var(--muted)}
.stone.done .sn{background:#22c55e;border-color:#16a34a;color:#fff}
.stone.here .sn{background:var(--brand);border-color:var(--brand-text);color:var(--brand-ink);transform:scale(1.12)}
.smil{font-size:11.5px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,#c4b5fd 30%,var(--panel))}
.shere{font-size:11.5px;font-weight:700;color:var(--brand-text)}
/* treatment progress */
.streak{display:flex;flex-wrap:wrap;gap:6px}
.sk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);font-weight:800;color:var(--muted)}
.sk.on{background:color-mix(in srgb,#f97316 22%,var(--panel));border-color:#f97316;color:#ea580c}
/* before/after comparison + decision light */
.cmp{display:grid;gap:12px}
.cmpm{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:5px}
.cmph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmph .pill.up{background:color-mix(in srgb,#22c55e 20%,var(--panel));color:#16a34a}.cmph .pill.down{background:color-mix(in srgb,#ef4444 18%,var(--panel));color:#dc2626}
.cb{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.cb.b0 .bt i{background:linear-gradient(90deg,#cbd5e1,#94a3b8)}.cb.b1 .bt i{background:linear-gradient(90deg,#bae6fd,#38bdf8)}.cb.b2 .bt i{background:linear-gradient(90deg,#bbf7d0,#22c55e)}
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.decb{display:flex;flex-direction:column;gap:3px;text-align:start;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;opacity:.78;transition:opacity .15s,transform .15s}
.decb:hover{opacity:1;transform:translateY(-1px)}
.decb .di{font-size:22px}.decb small{color:var(--muted);line-height:1.45}.decb em{font-style:normal;font-size:12px;font-weight:700;color:var(--brand-text)}
.decb.sug{opacity:1;border-style:dashed;border-color:var(--brand-text)}
.decb.on{opacity:1;border-style:solid;box-shadow:var(--shadow)}
.decb.d-go.on{border-color:#22c55e;background:color-mix(in srgb,#22c55e 14%,var(--panel))}
.decb.d-adj.on{border-color:#f59e0b;background:color-mix(in srgb,#f59e0b 14%,var(--panel))}
.decb.d-ref.on{border-color:#ef4444;background:color-mix(in srgb,#ef4444 12%,var(--panel))}
/* coping card + relapse-prevention stairs */
.lad{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.ccard{border-radius:18px;padding:12px 14px;background:linear-gradient(150deg,color-mix(in srgb,#fde68a 35%,var(--panel)),color-mix(in srgb,#a7f3d0 25%,var(--panel)));border:2px solid color-mix(in srgb,#f59e0b 45%,var(--line));box-shadow:var(--shadow)}
.cch{font-weight:800;font-size:16px;text-align:center;margin-bottom:6px}
.ccr{display:grid;gap:1px;padding:5px 0;border-bottom:1px dashed color-mix(in srgb,var(--ink) 18%,transparent);font-size:14px}
.ccr:last-child{border-bottom:0}.ccr span{font-size:12.5px;color:var(--muted)}.ccr b{font-weight:600;white-space:pre-wrap}
.stairs{display:flex;flex-direction:column-reverse;gap:6px}
.stair{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:center;margin-inline-start:calc(var(--i) * 9%);padding:8px 10px;border-radius:12px 12px 4px 4px;background:color-mix(in srgb,#7dd3fc calc(14% + var(--i) * 8%),var(--panel));border:1px solid color-mix(in srgb,#38bdf8 45%,var(--line));border-bottom:4px solid #38bdf8;font-size:13.5px}
.stair b{display:block}.stair .sn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel);font-weight:800}
@media (max-width:640px){
  .wfsay,.lad{grid-template-columns:1fr}
  .dec{grid-template-columns:1fr}
  .gauge{grid-template-columns:56px 1fr 44px;gap:8px}
  .fflow{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .fflines{display:none}
  .fcore{grid-column:1/3;grid-row:1;min-height:0;border-radius:22px}
  .fp-predisposing{grid-column:1;grid-row:2}.fp-precipitating{grid-column:2;grid-row:2}.fp-perpetuating{grid-column:1;grid-row:3}.fp-protective{grid-column:2;grid-row:3}
  .econ{width:22%;min-height:48px;font-size:11px;border-radius:12px}.econ i{font-size:15px}.econ small{font-size:10px}
  .ecoc{font-size:11.5px}
  .wvrow.q,.wvrow.c{grid-template-columns:repeat(3,1fr);padding:6px;border:1px solid var(--line);border-radius:12px}
  .wvrow.q>.wvn,.wvrow.c>.wvn{display:none}
  .wvrow.q>.inp:nth-child(2),.wvrow.c>.inp:nth-child(2){grid-column:1/-1}
  .wvrow.c .wvck{grid-column:span 2}
  .road{grid-template-columns:repeat(3,1fr)}
  .stone:not(:last-child)::after{display:none}
  .stair{margin-inline-start:calc(var(--i) * 5%)}
}
.wvdraw,.wvin{container-type:inline-size}
@container (max-width:560px){
  .fflow{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .fflines{display:none}
  .fcore{grid-column:1/3;grid-row:1;min-height:0;border-radius:22px}
  .fp-predisposing{grid-column:1;grid-row:2}.fp-precipitating{grid-column:2;grid-row:2}.fp-perpetuating{grid-column:1;grid-row:3}.fp-protective{grid-column:2;grid-row:3}
  .lad,.dec{grid-template-columns:1fr}
  .wvrow.q,.wvrow.c{grid-template-columns:repeat(3,1fr);padding:6px;border:1px solid var(--line);border-radius:12px}
  .wvrow.q>.wvn,.wvrow.c>.wvn{display:none}
  .wvrow.q>.inp:nth-child(2),.wvrow.c>.inp:nth-child(2){grid-column:1/-1}
  .wvrow.c .wvck{grid-column:span 2}
}

/* ===== special-ed hub (tracks-sped.js): file buttons, process map, form cards, cut-off bars ===== */
.tfile{display:inline-flex;align-items:stretch;max-width:100%;margin:3px 0 3px 6px;border-radius:10px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c,var(--brand)) 55%,var(--line));background:color-mix(in srgb,var(--c,var(--brand)) 14%,var(--panel));vertical-align:middle}
.tfile .tfopen{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:14px;font-weight:700;text-align:start;color:var(--ink);line-height:1.35}
.tfile .tfopen:hover,.tfile .tfopen:focus-visible{background:color-mix(in srgb,var(--c,var(--brand)) 30%,var(--panel))}
.tfile .tfdl{display:flex;align-items:center;padding:0 10px;border-inline-start:1px solid color-mix(in srgb,var(--c,var(--brand)) 45%,var(--line));text-decoration:none;font-size:15px}
.tfile .tfdl:hover{background:color-mix(in srgb,var(--c,var(--brand)) 30%,var(--panel))}
.tfile.off{padding:5px 10px;font-size:14px;color:var(--muted)}
.spflow{list-style:none;margin:0;padding:0;display:grid;gap:14px;position:relative}
.spflow::before{content:'';position:absolute;inset-inline-start:25px;top:26px;bottom:26px;width:4px;border-radius:2px;background:linear-gradient(#60a5fa,#a78bfa,#f472b6,#fb923c,#34d399)}
.spst{position:relative;display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start}
.spnum{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:var(--c);box-shadow:0 0 0 4px var(--panel),0 4px 14px color-mix(in srgb,var(--c) 45%,transparent)}
.spbody{border-radius:16px;padding:10px 14px;background:color-mix(in srgb,var(--c) 15%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:var(--shadow)}
.spbody>b{font-size:16.5px}
.spbody p{margin:5px 0}
.spwhen{display:inline-block;margin-inline-start:8px;padding:1px 9px;border-radius:99px;background:var(--c);color:#171717;font-weight:700;font-size:12px;vertical-align:middle}
.spfiles{display:flex;flex-wrap:wrap;margin-top:6px}
.splink{margin-top:4px;font-size:14px}
.spst.done .spbody{border-style:dashed;opacity:.85}
.spck{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted);cursor:pointer}
.spprog{position:relative;height:26px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.spprog i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,#34d399,#60a5fa)}
.spprog span{position:relative;display:block;text-align:center;font-size:13px;font-weight:700;line-height:24px}
.spfg{margin-bottom:16px}
.spfg h4{display:inline-block;margin:0 0 8px;padding:4px 14px;border-radius:99px;background:var(--c);color:#171717;font-size:15px}
.spfcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.spfc{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--c) 9%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 50%,var(--line));border-top:6px solid var(--c)}
.spfc.on{box-shadow:0 0 0 2px var(--ok)}
.spfc .tfile{margin-inline-start:0}
.spfc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;margin:8px 0 4px;font-size:14px;line-height:1.45}
.spfc dt{font-weight:700;color:var(--muted)}
.spfc dd{margin:0}
.spnote{font-size:13px;margin:6px 0 0;padding:5px 8px;border-radius:8px;background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.cbar{margin:4px 0 18px}
.cbar h4{margin:0 0 8px}
.cbtrack{position:relative;display:flex;min-height:50px;border-radius:12px;overflow:visible;border:1px solid var(--line)}
.cbtrack>span{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 2px;background:var(--c);color:#171717;text-align:center;line-height:1.15}
.cbtrack>span:first-child{border-start-start-radius:11px;border-end-start-radius:11px}
.cbtrack>span:last-of-type{border-start-end-radius:11px;border-end-end-radius:11px}
.cbtrack b{font-size:13px}
.cbtrack small{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbmark{position:absolute;top:-8px;bottom:-8px;width:5px;margin-inline-start:-2px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--panel)}
.cbends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.cbres{margin:8px 0 0;padding:7px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,var(--panel));border-inline-start:6px solid var(--c)}
@media (max-width:560px){.spst{grid-template-columns:42px 1fr;gap:8px}.spnum{width:42px;height:42px;font-size:20px}.spflow::before{inset-inline-start:19px}.cbtrack small{display:none}}
@media print{.spflow::before{display:none}.spck{display:none}}
/* parents + reports hubs: progress ring checklist, side-by-side comparison, colored phrase bank */
.pring{position:relative;width:132px;height:132px;margin:4px auto 10px}
.pring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:11}
.pring .pr0{stroke:var(--line)}
.pring .pr1{stroke:#34d399;stroke-linecap:round;transition:stroke-dasharray .4s}
.prc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.prc b{font-size:26px}.prc small{font-size:12px;color:var(--muted)}
.pgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pgrp{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--c) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-top:5px solid var(--c)}
.pgrp h4{margin:2px 0 8px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.pgrp h4 small{font-weight:700;color:var(--c)}
.pgi{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:14.5px}
.pgi input{margin-top:4px;accent-color:var(--c)}
.pgi.on span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent);opacity:.75}
.sbs{display:grid;gap:8px}
.sbrow{display:grid;grid-template-columns:minmax(90px,.8fr) 1fr 1fr;gap:8px;align-items:stretch}
.sbh{border-radius:14px;padding:10px;text-align:center;background:var(--c);color:#111;display:grid;gap:2px}
.sbh span{font-size:24px}.sbh small{font-size:12px;opacity:.8}
.sbl{font-weight:700;display:flex;align-items:center;font-size:14.5px}
.sbc{border-radius:12px;padding:9px 11px;background:color-mix(in srgb,var(--c) 16%,var(--panel));border-inline-start:5px solid var(--c);font-size:14.5px}
.pbank{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pbd{border-radius:16px;padding:12px 14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--panel)),color-mix(in srgb,var(--c) 8%,var(--panel)));border:1px solid color-mix(in srgb,var(--c) 50%,var(--line))}
.pbd h4{margin:0 0 8px;display:flex;gap:8px;align-items:center}
.pbd h4 span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:19px}
.pbd ul{margin:0;padding-inline-start:18px;display:grid;gap:5px;font-size:14.5px}
.pbd li::marker{color:var(--c)}
.pbav{margin:8px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:640px){.sbrow{grid-template-columns:1fr 1fr}.sbrow .sbl{grid-column:1/-1;margin-top:6px}.sbhead>span{display:none}}
@media print{.pring .pr1{transition:none}.pbd,.pgrp,.sbc{break-inside:avoid}}
/* ---------- diagram: content made visual (diagramHTML in app.js) ---------- */
:root{--dg1:#60a5fa;--dg2:#f472b6;--dg3:#34d399;--dg4:#fbbf24;--dg5:#a78bfa;--dg6:#fb923c;--dg7:#22d3ee;--dg8:#f87171;--dgmix:20%}
:root[data-theme="light"]{--dg1:#2563eb;--dg2:#db2777;--dg3:#059669;--dg4:#d97706;--dg5:#7c3aed;--dg6:#ea580c;--dg7:#0891b2;--dg8:#dc2626;--dgmix:13%}
.dg{margin:10px 0 18px;padding:0;container-type:inline-size}
.dghead{font-weight:800;font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.dghead::before{content:"";flex:none;width:6px;height:22px;border-radius:3px;background:linear-gradient(var(--dg1),var(--dg5))}
.dgintro{margin:0 0 10px;color:var(--muted)}
.dgn{--c:var(--dg1);position:relative;display:flex;align-items:center;gap:8px;min-width:0;font:inherit;font-size:14.5px;font-weight:700;line-height:1.3;color:var(--ink);text-align:start;
  background:color-mix(in srgb,var(--c) var(--dgmix),var(--panel));border:2px solid color-mix(in srgb,var(--c) 75%,transparent);border-radius:14px;padding:8px 10px;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s}
button.dgn{cursor:pointer}
button.dgn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.2)}
button.dgn:focus-visible,.dgall:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.dgn.sel{box-shadow:0 0 0 3px var(--c)}
.dgi{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c) 32%,var(--panel))}
.dgt{flex:1;min-width:min-content}
.dgm{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--c);color:#fff;transition:transform .2s}
.dgn.sel .dgm{transform:rotate(45deg)}
.dgc{font-weight:800;font-size:14px;text-align:center;color:var(--ink);line-height:1.35}
/* circular: cycle · wheel · triangle */
.dgring{position:relative;width:100%;max-width:600px;aspect-ratio:1/.94;margin:0 auto}
.dgsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dgring path{fill:none;stroke-width:1.3;stroke-linecap:round}
.dg-cycle path{stroke-dasharray:3 2;animation:c-flow 1.8s linear infinite}
.dg-cycle marker path{stroke:none;stroke-dasharray:none;animation:none}
.dgring .dgw{stroke:var(--panel);stroke-width:.8;fill-opacity:.2}
.dghub{fill:var(--panel);stroke:var(--line);stroke-width:.6}
.dgring .dgn{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:var(--w,30%);flex-direction:column;text-align:center;justify-content:center;padding:8px 6px}
.dgring button.dgn:hover{transform:translate(-50%,-50%) scale(1.04)}
.dgring .dgm{position:absolute;top:-8px;inset-inline-end:-6px}
.dgring>.dgc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%}
.dg-cycle>.dgc{font-size:26px}
.dg-triangle{aspect-ratio:1/.9;max-width:520px}
.dg-triangle line{stroke:var(--muted);stroke-width:1.2;color:var(--muted)}
.dgtri{fill:none;stroke:color-mix(in srgb,var(--dg5) 35%,transparent);stroke-width:.6;stroke-dasharray:2 2}
.dg-triangle .dgn{width:34%}
.dg-triangle>.dgc{top:57%;width:34%;font-size:13px}
/* flow */
.dgflow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dgflow .dgn{flex:1 1 120px;max-width:220px}
.dgar{flex:none;color:var(--muted);font-size:22px;font-weight:900}
.dgar::before{content:"←"}
/* ladder (item 0 = bottom) */
.dgladder{list-style:none;margin:0;padding:0 0 0 0;display:flex;flex-direction:column-reverse;gap:6px;position:relative}
.dgladder li{display:flex;align-items:center;gap:8px;margin-inline-start:calc(var(--k) * min(7%, 46% / var(--n)))}
.dgladder .dgn{flex:1;max-width:460px}
.dgstep{flex:none;width:30px;height:30px;border-radius:8px 8px 0 0;background:var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;border-bottom:4px solid var(--muted)}
/* pyramid (item 0 = top) */
.dgpyr{list-style:none;margin:0 auto;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;max-width:640px}
.dgpyr li{display:flex}
.dgpyr .dgn{flex:1;justify-content:center;text-align:center;border-radius:10px}
.dgpyr li:first-child .dgn{border-radius:40px 40px 10px 10px}
/* timeline */
.dgtime{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.dgtime::before{content:"";position:absolute;top:13px;inset-inline:6%;height:4px;border-radius:2px;background:linear-gradient(to left,var(--dg1),var(--dg5),var(--dg2))}
.dgtime li{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.dgdot{position:relative;z-index:1;flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;box-shadow:0 0 0 4px var(--panel)}
.dgtime .dgn{flex-direction:column;text-align:center;width:100%}
/* compare */
.dgcmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.dgside{border-radius:14px;padding:10px 12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) var(--dgmix),var(--panel))}
.dgside-a{--c:var(--dg7)}.dgside-b{--c:var(--dg6)}
.dgside h4{margin:-10px -12px 8px;padding:8px 12px;background:var(--c);color:#fff;border-radius:11px 11px 0 0;font-size:15.5px}
.dgside ul{margin:0;padding-inline-start:18px}.dgside li{margin:3px 0}
.dgvs{align-self:center;font-size:24px;color:var(--muted)}
.dgcmp+.dggrid{margin-top:10px}
/* iceberg */
.dgice{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.dgice small{display:block;font-weight:800;font-size:13px;margin-bottom:8px;position:relative}
.dgice-top,.dgice-bot{position:relative;padding:12px 12px 16px;isolation:isolate}
.dgice-top{background:linear-gradient(color-mix(in srgb,#7dd3fc 8%,var(--panel)),color-mix(in srgb,#7dd3fc 22%,var(--panel)))}
.dgice-top::before{content:"";position:absolute;z-index:-1;inset:10px 22% 0;background:color-mix(in srgb,#e0f2fe 50%,transparent);clip-path:polygon(0 100%,30% 30%,48% 0,62% 22%,76% 12%,100% 100%)}
.dgice-bot{background:linear-gradient(color-mix(in srgb,#0284c7 45%,var(--panel)),color-mix(in srgb,#1e3a8a 75%,var(--panel)));border-top:3px dashed color-mix(in srgb,#e0f2fe 70%,transparent);padding-bottom:26px}
.dgice-bot small{color:#e0f2fe}
.dgice-bot::before{content:"";position:absolute;z-index:-1;inset:0 6% 8px;background:color-mix(in srgb,#e0f2fe 18%,transparent);clip-path:polygon(12% 0,88% 0,100% 45%,82% 100%,20% 100%,0 40%)}
.dgwrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:relative}
.dgwrap .dgn{flex:0 1 auto;max-width:280px}
/* scale 0–10 */
.dgzones{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.dgzones .dgn{flex-direction:column;text-align:center;justify-content:center;border-radius:12px 12px 4px 4px}
.dgbar{height:16px;border-radius:99px;margin-top:6px;background:linear-gradient(to left,#dc2626,#f97316,#eab308,#84cc16,#22c55e)}
.dgticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 4px 0;font-weight:700}
/* tree */
.dgtree{display:flex;flex-direction:column;align-items:center}
.dgroot{padding:10px 18px;border-radius:14px;font-weight:900;background:linear-gradient(135deg,var(--dg5),var(--dg1));color:#fff;text-align:center;max-width:90%}
.dgbr{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px;padding-top:16px;border-top:3px solid var(--line);width:100%}
.dgbr::before{content:"";position:absolute;top:-27px;left:50%;width:3px;height:24px;background:var(--line)}
.dgleaf{position:relative;flex:1 1 150px;max-width:240px;display:flex}
.dgleaf::before{content:"";position:absolute;top:-16px;left:50%;width:3px;height:16px;background:var(--line)}
.dgleaf .dgn{flex:1;flex-direction:column;text-align:center}
/* venn */
.dgvenn{position:relative;width:100%;max-width:560px;aspect-ratio:100/80;margin:0 auto}
.dgvenn circle{fill-opacity:.2;stroke-width:.7}
.dgvenn .dgn{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);max-width:34%;flex-direction:column;text-align:center}
.dgvenn.v3 .dgn{max-width:30%}
.dgvenn>.dgc{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:18%;font-size:12.5px;background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:10px;padding:2px 4px}
/* grid */
.dggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:8px}
.dggrid .dgn{padding:12px}
/* explanations */
.dgbar2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
.dgdets{display:grid;gap:8px;margin-top:8px}
.dgdet{display:none;border-radius:14px;padding:10px 14px;border-inline-start:6px solid var(--c);background:color-mix(in srgb,var(--c) var(--dgmix),var(--panel));animation:dg-in .25s ease-out}
@keyframes dg-in{from{transform:translateY(-6px)}to{transform:none}}
.dgdet.on{display:block}
.dgdet p{margin:6px 0 0;line-height:1.65}
.dgex{font-style:italic;color:var(--muted)}
.dgnote{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--brand-soft);font-size:14.5px}
/* narrow boxes: every layout becomes a colored vertical list */
@container (max-width:520px){
  .dgring,.dg-triangle,.dgvenn{aspect-ratio:auto;display:flex;flex-direction:column;gap:20px;max-width:none}
  .dgring .dgsvg,.dgvenn .dgsvg{display:none}
  .dg .dgring .dgn,.dg .dgvenn .dgn,.dg .dgring>.dgc,.dg .dgvenn>.dgc{position:relative;left:auto;top:auto;transform:none;width:100%;max-width:none;flex-direction:row;text-align:start}
  .dgring button.dgn:hover{transform:none}
  .dgring .dgm{position:static}
  .dgring>.dgc,.dgvenn>.dgc{order:99;border:2px dashed var(--line);border-radius:12px;padding:8px;background:var(--bg2);font-size:14px}
  .dg-cycle .dgn::after,.dg-triangle .dgn::after{content:"⬇";position:absolute;bottom:-20px;inset-inline-start:50%;font-size:14px;color:var(--muted)}
  .dg-cycle>.dgc:empty{display:none}
  .dg-cycle>.dgc{font-size:14px}
  .dg-cycle .dgn:last-child::after{content:"🔄 וחוזר חלילה"}
  .dg-triangle .dgn:last-child::after{content:"↕ כל אחד משפיע על האחרים";inset-inline-start:30%;font-size:12px;white-space:nowrap}
  .dgflow{flex-direction:column;align-items:stretch}
  .dgflow .dgn{max-width:none;flex:none}
  .dgar{align-self:center;font-size:18px;line-height:1}
  .dgar::before{content:"⬇"}
  .dgladder li{margin-inline-start:calc(var(--k) * min(4%, 28% / var(--n)))}
  .dgtime{grid-template-columns:1fr;gap:10px}
  .dgtime::before{top:6px;bottom:6px;inset-inline:auto;inset-inline-start:13px;width:4px;height:auto;background:linear-gradient(var(--dg1),var(--dg5),var(--dg2))}
  .dgtime li{flex-direction:row;align-items:center}
  .dgtime .dgn{flex-direction:row;text-align:start}
  .dgcmp{grid-template-columns:1fr}
  .dgvs{justify-self:center;transform:rotate(90deg)}
  .dgzones{grid-template-columns:1fr}
  .dgzones .dgn{flex-direction:row;text-align:start;border-radius:12px}
  .dgpyr li{min-width:55%}
  .dgleaf{flex-basis:100%;max-width:none}
}
@media (prefers-reduced-motion:reduce){.dg-cycle path{animation:none}.dgdet{animation:none}button.dgn,.dgm{transition:none}}
@media print{
  .dg{break-inside:avoid}
  .dgdet{display:block!important;animation:none}
  .dgn{box-shadow:none}
  .dg-cycle path{animation:none}
}
/* SEL hub – class SEL radar (WV.selradar) */
.selrad{display:grid;gap:10px;justify-items:center}
.selrad svg{width:100%;max-width:340px;height:auto;overflow:visible}
.selrad .srg{fill:none;stroke:var(--line);stroke-width:1}
.selrad .sra{stroke-width:1.6;opacity:.75}
.selrad .srp{fill-opacity:.2;stroke-width:2.4;stroke-linejoin:round}
.selrad .srl{font-size:16px}
.srleg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:13.5px}
.srleg span{border-inline-start:4px solid var(--c);padding-inline-start:6px}
.srleg.rounds span{border:0;padding:0;color:var(--c);font-weight:800}
.srleg.rounds span.off{opacity:.4}
.srin{display:grid;grid-template-columns:minmax(120px,1.5fr) repeat(3,minmax(56px,1fr));gap:6px 8px;align-items:center}
.srin>span{border-inline-start:4px solid var(--c);padding-inline-start:6px;font-size:14px}
.srin>b{font-size:13px;text-align:center}
.srin .inp{min-width:0;text-align:center}
@media (max-width:480px){.srin{grid-template-columns:1fr repeat(3,50px);font-size:13px}.srin>b{font-size:11.5px}}

/* print / PDF / slideshow */
.outmenu{position:fixed;z-index:1000;display:flex;flex-direction:column;gap:2px;background:var(--card,#fff);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.outmenu button{all:unset;cursor:pointer;padding:9px 14px;border-radius:8px;font-size:15px;white-space:nowrap}
.outmenu button:hover,.outmenu button:focus-visible{background:var(--brand-soft)}
.slideshow{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column}
.slideshow .sl-stage{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px}
.slideshow .sl-body{width:min(1100px,94vw);font-size:20px;transform-origin:center center}
.slideshow .sl-body details>summary{list-style:none}
.slideshow .sl-title{text-align:center;padding:40px}.slideshow .sl-title h1{font-size:44px;margin:10px 0}.slideshow .sl-emo{font-size:70px}
.slideshow .sl-bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;border-top:1px solid var(--line);background:var(--card,#fff)}
.slideshow .sl-bar button{border:1px solid var(--line);background:var(--brand-soft);border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer}
.slideshow .sl-bar button:disabled{opacity:.4;cursor:default}
@media print{.outmenu,.slideshow,[data-act="outmenu"]{display:none!important}}

/* ---------- visual upgrade: hubs, home tiles, track stepper, info shapes, cards, checklist ring, scale ---------- */
.dgbar{background:linear-gradient(to left,#22c55e,#84cc16,#eab308,#f97316,#dc2626)}
.hubhero{padding:26px 26px;min-height:110px}
.hubhero .emoji{width:74px;height:74px;font-size:40px;background:hsl(var(--h) 70% 55% / .35);box-shadow:0 0 0 4px hsl(var(--h) 70% 60% / .25)}
.hubhero h1{font-size:clamp(22px,3.4vw,32px)}
.hubhero::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(to left,hsl(var(--h) 80% 60%),hsl(calc(var(--h) + 40) 80% 60%),hsl(calc(var(--h) + 80) 80% 60%))}
.card.hubc{background:linear-gradient(160deg,hsl(var(--h) var(--soft-s) var(--soft-l)) 0%,var(--panel) 55%)}
.card.hubc .emoji{width:56px;height:56px;font-size:30px;background:hsl(var(--h) var(--sat) var(--lt) / .28)}
/* hub map: a numbered colored path of the hub's tracks */
.hubmap ol{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:10px 6px;counter-reset:none}
.hubmap li{position:relative;flex:0 1 auto;min-width:0}
.hubmap li:not(:last-child)::after{content:"←";margin-inline-start:6px;color:hsl(var(--h) var(--sat) var(--lt));font-weight:900}
.hubmap li{display:flex;align-items:center}
.hubmap a{display:flex;align-items:center;gap:6px;text-decoration:none;padding:5px 12px 5px 6px;border-radius:99px;font-size:14px;font-weight:600;max-width:260px;
  background:hsl(calc(var(--h) + var(--k) * 9) var(--soft-s) var(--soft-l));border:1.5px solid hsl(calc(var(--h) + var(--k) * 9) var(--sat) var(--lt) / .6);transition:transform .15s}
.hubmap a:hover{transform:translateY(-2px)}
.hmn{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;background:hsl(calc(var(--h) + var(--k) * 9) 65% 45%)}
.hmi{font-size:17px}
.hmt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* home: a colored tile for every section */
.hometiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,46%),1fr));gap:10px}
.htile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;padding:12px 8px;border-radius:16px;text-decoration:none;text-align:center;
  background:linear-gradient(150deg,hsl(var(--h) var(--sat) var(--lt) / .30),hsl(calc(var(--h) + 35) var(--soft-s) var(--soft-l)));border:1px solid hsl(var(--h) var(--sat) var(--lt) / .45);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.htile:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.hti{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:hsl(var(--h) var(--sat) var(--lt) / .35)}
.htl{font-weight:700;font-size:14.5px;line-height:1.25}
/* track stepper: each step colored by its kind */
.trsteps a .n{background:hsl(var(--kh,210) 60% 50% / .28);color:var(--ink)}
.trsteps a.on{background:hsl(var(--kh,210) 70% 55% / .18);box-shadow:inset -4px 0 0 hsl(var(--kh,210) 70% 55%)}
.trsteps a.on .n{background:hsl(var(--kh,210) 65% 48%);color:#fff}
.trsteps a.ok .n{background:#22c55e;color:#fff}
.trmain h2.trhead{display:flex;flex-direction:column;gap:4px;margin:-6px -6px 14px;padding:12px 14px;border-radius:12px;background:linear-gradient(to left,hsl(var(--kh,210) 70% 55% / .22),transparent);border-inline-start:6px solid hsl(var(--kh,210) 70% 55%)}
.trkind{font-size:13px;font-weight:600;color:var(--muted)}
/* info shapes */
.trauto{margin:8px 0 12px}
.trauto .dg{margin:4px 0}
.trpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.trside{border-radius:14px;padding:10px 12px;border-top:5px solid var(--c);background:color-mix(in srgb,var(--c) var(--dgmix),var(--panel))}
.trside.ther{--c:var(--dg3)}.trside.disc{--c:var(--dg6)}
.trside b{display:block;font-size:15.5px}
.trside p{margin:6px 0 0;line-height:1.65}
.trnum{list-style:none;margin:8px 0 12px;padding:0;display:grid;gap:8px;counter-reset:trn}
.trnum li{counter-increment:trn;display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;--c:var(--dg1);background:color-mix(in srgb,var(--c) var(--dgmix),var(--panel));border-inline-start:5px solid var(--c)}
.trnum li:nth-child(8n+2){--c:var(--dg2)}.trnum li:nth-child(8n+3){--c:var(--dg3)}.trnum li:nth-child(8n+4){--c:var(--dg4)}.trnum li:nth-child(8n+5){--c:var(--dg5)}.trnum li:nth-child(8n+6){--c:var(--dg6)}.trnum li:nth-child(8n+7){--c:var(--dg7)}.trnum li:nth-child(8n+8){--c:var(--dg8)}
.trnum li::before{content:counter(trn);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;background:var(--c)}
.trnum li span{line-height:1.6;padding-top:2px}
.trdo li{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:10px;margin-bottom:5px}
.trdo li.yes{background:color-mix(in srgb,#22c55e 12%,var(--panel))}
.trdo li.no{background:color-mix(in srgb,#ef4444 12%,var(--panel))}
.trmk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff}
.trdo li.yes .trmk{background:#22c55e}.trdo li.no .trmk{background:#ef4444}
.trdots li{position:relative;padding-inline-start:20px}
.trdots li::before{content:"";position:absolute;inset-inline-start:2px;top:.6em;width:10px;height:10px;border-radius:50%;background:var(--dg1)}
.trdots li:nth-child(4n+2)::before{background:var(--dg2)}.trdots li:nth-child(4n+3)::before{background:var(--dg3)}.trdots li:nth-child(4n+4)::before{background:var(--dg4)}
/* cards: a tint per card (and red/green for don't/do, teal/orange for therapeutic/disciplinary) */
.trcard{--c:var(--dg1);border-inline-start-color:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) var(--dgmix),var(--panel)),var(--panel) 70%)}
.trcard b{color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.trcard:nth-child(8n+2){--c:var(--dg2)}.trcard:nth-child(8n+3){--c:var(--dg3)}.trcard:nth-child(8n+4){--c:var(--dg4)}.trcard:nth-child(8n+5){--c:var(--dg5)}.trcard:nth-child(8n+6){--c:var(--dg6)}.trcard:nth-child(8n+7){--c:var(--dg7)}.trcard:nth-child(8n+8){--c:var(--dg8)}
.trcard.yes{--c:#22c55e}.trcard.no{--c:#ef4444}.trcard.ther{--c:var(--dg3)}.trcard.disc{--c:var(--dg6)}
/* checklist ring */
.trchkw{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}

.trringn{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.trringw.full .trringn::after{content:" 🎉"}
@media (max-width:520px){.trchkw{grid-template-columns:1fr}.trringw{position:relative;top:0;width:64px;height:64px;justify-self:center}.trpair{grid-template-columns:1fr}}
/* scale: a thermometer-colored slider */
.trscale input[type=range]{-webkit-appearance:none;appearance:none;height:12px;border-radius:99px;background:linear-gradient(to left,#22c55e,#eab308,#f97316,#dc2626);accent-color:var(--brand)}

@media (max-width:560px){.trsrow{grid-template-columns:1fr 34px}.trsrow input{grid-column:1/-1;grid-row:2}}
/* problem map & maintaining cycle polish */
.model .box{border-top:4px solid transparent}
.model .box.t{border-top-color:hsl(210 70% 55%)}.model .box.f{border-top-color:hsl(0 70% 58%)}.model .box.b{border-top-color:hsl(35 80% 55%)}.model .box.a{border-top-color:hsl(145 60% 45%)}
.cyc{background:radial-gradient(circle at 50% 48%,color-mix(in srgb,var(--dg5) 10%,transparent),transparent 62%);border-radius:18px;padding:8px 0}
.cnode{border-radius:18px}
.cnode b{font-size:14px}
@media (prefers-reduced-motion:reduce){.hubmap a,.htile,.trring .fg{transition:none}}
@media print{.trringw{display:none}.trchkw{display:block}.hubhero::after{display:none}}

/* never cut a word in the middle – the box grows to fit the word instead (user rule, everywhere) */

/* ---------- aklim hub (tracks-aklim.js): ladder, event finder, criteria meter, suspension bars, class survey ---------- */

.akc{white-space:nowrap}
.akladder{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.akrungs{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border-radius:18px;background:linear-gradient(0deg,color-mix(in srgb,#22c55e 10%,var(--panel)),color-mix(in srgb,#ef4444 12%,var(--panel)));border:1px solid var(--line)}

.akrung:hover{transform:translateX(-3px)}

.akpanel{border-radius:18px;padding:14px;background:color-mix(in srgb,var(--c) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-top:7px solid var(--c);display:grid;gap:12px;min-width:0}
.akph{display:flex;gap:12px;align-items:flex-start}.akph h4{margin:0 0 4px;font-size:18px}.akph p{margin:0;line-height:1.6}
.akbadge{flex:none;display:grid;place-items:center;min-width:46px;height:46px;padding:0 8px;border-radius:14px;background:var(--c);color:#111;font-weight:900;font-size:20px}

.akchip{padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 50%,transparent);font-size:13.5px}
.akfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.akfact{border-radius:12px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--c)}
.akfact b{font-size:13.5px}.akfact p{margin:3px 0 2px;font-size:14px;line-height:1.5}.akfi{margin-inline-end:4px}
.aktwo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.akcol{border-radius:14px;padding:10px 12px;border-top:6px solid var(--k)}
.akcol.ther{--k:#34d399;background:color-mix(in srgb,#34d399 12%,var(--panel))}
.akcol.disc{--k:#60a5fa;background:color-mix(in srgb,#60a5fa 12%,var(--panel))}
.akcol h5{margin:0 0 6px;font-size:15.5px}
.akul{margin:0;padding:0;display:grid;gap:6px}.akul li{font-size:14.5px;line-height:1.55;padding-inline-start:14px;position:relative}
.akul li::before{content:'•';position:absolute;inset-inline-start:0;color:var(--k,var(--c));font-weight:900}
.akmust{background:color-mix(in srgb,#ef4444 20%,var(--panel));color:var(--ink);font-weight:700}
.akopt{background:var(--bg2);color:var(--muted)}
.akgk{background:color-mix(in srgb,#a78bfa 22%,var(--panel));color:var(--ink)}
.aknote{margin:0;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,#f59e0b 14%,var(--panel));font-size:14px;line-height:1.55}
.aksits{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}
.aksit{padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);text-decoration:none}

.akevgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}

.akevi{font-size:30px;line-height:1.1}.akev b{font-size:14.5px;line-height:1.3}.akev small{font-size:12px;opacity:.85}
.akvtabs{display:flex;flex-wrap:wrap;gap:6px}
.akvt{position:relative;display:flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;cursor:pointer;border:2px solid var(--c);background:var(--panel);font-size:14px}

.akvb{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border-radius:8px;background:var(--c);color:#111;font-weight:800;font-size:13px}

.aklevel{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,var(--panel));border-inline-start:6px solid var(--c)}

.aknowwrap{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:start}

.akcritl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px}

.akbars{display:grid;gap:8px;position:relative}

.akbt i{position:absolute;inset-block:0}
.akbt i.base{background:var(--c);border-radius:6px}
.akbt i.ext{background:repeating-linear-gradient(45deg,var(--c) 0 5px,transparent 5px 10px);border:2px solid var(--c);border-radius:6px;box-sizing:border-box}

.akleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* show every title in full – never cut with … (user rule) */
.topbar .title,.modal .mhead h3,.lib-item .t,.cbtrack small,.hmt,.so-bars .nm,.card .name,.card .sub,.hubc .name,.btn,.btn .lbl,.li b,.vcard .vt,.trsteps a,.tabs a,.chip{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;-webkit-line-clamp:unset!important;max-height:none!important}
