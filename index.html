<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>CBT בבית הספר</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232f6f62'/><text x='50' y='68' font-size='56' text-anchor='middle'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Dark-first, matching the library site (Artlist-inspired): near-black grounds, bold white type, one yellow accent. */
:root{
  color-scheme: dark;
  --bg:#0d0d0d; --bg2:#171717; --panel:#1c1c1c; --ink:#ffffff; --muted:#9a9a9a; --line:#2c2c2c;
  --brand:#ffda2a; --brand-2:#e6c21f; --brand-soft:rgba(255,218,42,.13); --brand-ink:#171717; --brand-text:#ffda2a;
  --accent:#f2a93b; --danger:#ff6b61; --ok:#3fb56c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --shadow-hi:0 14px 40px rgba(0,0,0,.55);
  --r:14px; --soft-s:35%; --soft-l:20%; --sat:60%; --lt:62%;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ffffff; --bg2:#f4f4f4; --panel:#ffffff; --ink:#171717; --muted:#6b6b6b; --line:#e7e7e7;
  --brand:#ffda2a; --brand-2:#e6c21f; --brand-soft:rgba(255,218,42,.25); --brand-ink:#171717; --brand-text:#8a6a00;
  --danger:#c8423b; --ok:#2f9a5a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
  --shadow-hi:0 14px 36px rgba(0,0,0,.14);
  --soft-s:70%; --soft-l:93%; --sat:58%; --lt:42%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Heebo,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;text-wrap:balance;font-weight:800}

/* layout */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 18px;text-decoration:none}
.brand .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-size:20px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.nav a .i{font-size:19px;width:24px;text-align:center}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding:0 28px 90px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:66px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.topbar .title{font-weight:700;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px}
.who select{border:0;background:none;max-width:170px;outline:none;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--bg2);cursor:pointer;border:0;text-align:start}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#aaa;flex:0 0 auto}
.sync.ok .dot{background:var(--ok)} .sync.warn .dot{background:var(--accent)} .sync.err .dot{background:var(--danger)}
.tabbar{display:none}

/* common */
.page{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:44px 40px;color:#fff;margin:6px 0 22px;isolation:isolate;background:#0a0a0a;border:1px solid #222}
.hero::before{content:'';position:absolute;inset:-40%;z-index:-1;background:radial-gradient(40% 50% at 80% 25%,rgba(255,218,42,.20),transparent 70%),radial-gradient(35% 45% at 15% 75%,rgba(74,156,138,.30),transparent 70%),radial-gradient(30% 40% at 55% 115%,rgba(120,90,255,.22),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.05)}}
@media (prefers-reduced-motion: reduce){.hero::before{animation:none}}
.hero h1{margin:0 0 10px;font-size:clamp(30px,4.6vw,54px);font-weight:900;letter-spacing:-1px;line-height:1.05}
.hero p{margin:0;opacity:.92;max-width:640px}
.hero .actions{margin-top:20px}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.hero .btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
h2.sec{font-size:20px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec small{font-size:14px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr))}
.card{--h:160;position:relative;display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;cursor:pointer;overflow:hidden;min-width:0}
.card.accent::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:hsl(var(--h) var(--sat) var(--lt))}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.card .emoji{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:hsl(var(--h) var(--soft-s) var(--soft-l))}
.card .name{font-weight:600;font-size:16.5px}
.card .sub{font-size:13.5px;color:var(--muted)}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel + .panel{margin-top:14px}
.panel h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--bg2);border-radius:30px;padding:8px 16px;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .12s,border-color .12s,background .12s;white-space:nowrap}
.btn:hover{border-color:var(--brand-text);transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand-text);color:#fff;font-weight:500}

.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand-text);color:#fff}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 18px;scrollbar-width:thin}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--brand-text);border-bottom-color:var(--brand-text)}
ul.clean{margin:0;padding:0 18px 0 0}
ul.clean li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:46px;display:block;margin-bottom:6px}
.banner{--h:160;position:relative;overflow:hidden;isolation:isolate;border-radius:18px;padding:30px 30px;color:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 18px;background:#0a0a0a;border:1px solid #222}`n.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 100% at 85% 0%,hsl(var(--h) 60% 35% / .75),transparent 70%),radial-gradient(40% 80% at 10% 100%,hsl(calc(var(--h) + 40) 60% 30% / .5),transparent 70%)}`n.banner h1{font-weight:900;letter-spacing:-.5px}
.banner .emoji{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:32px;flex:0 0 auto}
.banner h1{margin:0;font-size:clamp(21px,3vw,29px)}
.banner p{margin:4px 0 0;opacity:.9}
.banner .actions{margin-inline-start:auto}
.banner .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.back{display:inline-flex;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-top:4px}
.back:hover{color:var(--brand-text)}
.note{background:var(--brand-soft);border-radius:14px;padding:12px 16px;font-size:14.5px}
.note.warn{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.note.danger{background:color-mix(in srgb,var(--danger) 14%,var(--panel))}

/* model diagram */
.model{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.model .box{border-radius:14px;padding:12px 14px;background:var(--bg2);font-size:14px}
.model .box b{display:block;margin-bottom:6px;font-size:14.5px}
.model .box.t{background:hsl(210 var(--soft-s) var(--soft-l))}
.model .box.f{background:hsl(0 var(--soft-s) var(--soft-l))}
.model .box.b{background:hsl(35 var(--soft-s) var(--soft-l))}
.model .box.a{background:hsl(145 var(--soft-s) var(--soft-l))}
.model .trig{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line)}

/* sessions */
.sess{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.sess summary{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;font-weight:600;list-style:none}
.sess summary::-webkit-details-marker{display:none}
.sess summary .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:14px;flex:0 0 auto}
.sess summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--muted)}
.sess[open] summary .chev{transform:rotate(-90deg)}
.sess .body{padding:0 16px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sess .body h4{margin:4px 0;font-size:13.5px;color:var(--muted)}
.sess.done summary .n{background:var(--ok);color:#fff}

/* forms */
.form{display:grid;gap:12px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:15px;outline:none;width:100%}
label.f textarea,.inp.ta{min-height:80px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{border-color:var(--brand-text)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--brand-text)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:20px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .2s ease}
.modal.big .box{width:min(1100px,100%);height:92vh;padding:0;display:flex;flex-direction:column;overflow:hidden}
.modal .mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal.big .mhead{padding:10px 14px;margin:0;border-bottom:1px solid var(--line)}
.modal .mhead h3{margin:0;flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal iframe{flex:1;border:0;width:100%;background:#fff}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

/* student */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.li .grow{flex:1;min-width:0}
.li .date{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:190px}
.chart .axis{stroke:var(--line)}
.chart .lbl{fill:var(--muted);font-size:11px}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5}
.chart .pt{fill:var(--panel);stroke:var(--brand);stroke-width:2.5}

/* kid tools */
.toolstage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);min-height:420px}
.kid{font-size:19px}
.kid h2{font-size:26px;margin:0 0 6px;text-align:center}
.kid .lead{text-align:center;color:var(--muted);margin:0 0 18px}
.thermo{display:flex;gap:26px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.thermo .bar{display:flex;flex-direction:column-reverse;gap:4px;width:120px}
.thermo .lvl{height:36px;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer;font-weight:700;color:#fff;transition:transform .12s;opacity:.45}
.thermo .lvl.on{opacity:1;transform:scale(1.06);border-color:var(--ink)}
.thermo .lvl.fill{opacity:1}
.thermo .face{font-size:90px;text-align:center;line-height:1}
.emos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.emos button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 14px;font-size:17px;cursor:pointer}
.emos button.on{border-color:var(--brand-text);background:var(--brand-soft)}
.breath{display:grid;place-items:center;height:330px}
.breath .circle{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#bfe9df,#4a9c8a);box-shadow:0 0 0 18px rgba(74,156,138,.15),0 0 0 36px rgba(74,156,138,.08);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;text-align:center;transition:transform 4s ease-in-out}
.bigtext{font-size:28px;font-weight:700;text-align:center;min-height:44px}
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.light{border-radius:20px;padding:18px;border:2px solid var(--line);background:var(--bg);opacity:.55;transition:opacity .2s,transform .2s}
.light.on{opacity:1;transform:translateY(-4px)}
.light .bulb{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;box-shadow:inset 0 -6px 12px rgba(0,0,0,.2)}
.light.r .bulb{background:#e04a3f}.light.y .bulb{background:#f2b632}.light.g .bulb{background:#3aa65c}
.light h3{text-align:center;margin:0 0 8px}
.ladder{display:flex;flex-direction:column-reverse;gap:8px;max-width:560px;margin:0 auto}
.rung{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.rung .suds{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto}
.rung.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.rung .grow{flex:1}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;max-width:640px;margin:0 auto}
.slot{aspect-ratio:1;border-radius:16px;border:2px dashed var(--line);display:grid;place-items:center;font-size:34px;cursor:pointer;background:var(--bg);transition:transform .15s}
.slot:hover{transform:scale(1.06)}
.slot.full{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.slot.prize{border-color:var(--brand-text);font-size:30px}
.pmr .step{font-size:24px;text-align:center;margin:10px 0}
.progress{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);transition:width .3s}
.copecard{max-width:460px;margin:0 auto;border-radius:24px;padding:24px;color:#1c2230;box-shadow:var(--shadow-hi)}
.copecard h3{margin:0 0 12px;font-size:22px;text-align:center}
.copecard ol{font-size:19px;margin:0;padding-inline-start:26px}
.swatches{display:flex;gap:8px;justify-content:center;margin:12px 0}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
.detective{display:grid;gap:14px;max-width:720px;margin:0 auto}
.stepcard{border-radius:16px;padding:14px 16px;background:var(--bg);border:2px solid var(--line)}
.stepcard h4{margin:0 0 8px;font-size:18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-size:26px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:90;font-size:14.5px;box-shadow:var(--shadow-hi);animation:rise .2s}
.lib-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.lib-item:hover{border-color:var(--brand-text)}
.lib-item .grow{flex:1;min-width:0}
.lib-item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .s{font-size:12.5px;color:var(--muted)}
.ft{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;color:#fff;background:#667085}
.ft.pdf{background:#d6453d}.ft.doc{background:#2b64c7}.ft.ppt{background:#d9731f}.ft.img{background:#2f9a5a}
.search{position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 40px 0 14px;font-size:15px;outline:none}
.search .ic{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);opacity:.5}
.print-only{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:0 16px 96px}
  .tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:11px;color:var(--muted);padding:4px 0}
  .tabbar a .i{font-size:21px}
  .tabbar a.on{color:var(--brand-text)}
  .two,.sess .body,.form .row2{grid-template-columns:1fr}
  .three{gap:8px}
  .stat{padding:10px 12px}
  .stat b{font-size:20px}
  .stat span{font-size:12px}
  .model{grid-template-columns:1fr 1fr}
  .lights{grid-template-columns:1fr}
  .who select{max-width:110px}
  .hero{padding:24px 20px}
  .toolstage{padding:18px}
}
@media print{
  .side,.tabbar,.topbar,.no-print,.modal,.tabs,.back{display:none!important}
  .shell{display:block}
  .main{padding:0}
  body{background:#fff;color:#000}

<script>
/* CBT app – school counseling. Plain JS, no dependencies. */
(function(){
'use strict';

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { if (!d) return ''; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString('he-IL', {day:'numeric', month:'short', year:'numeric'}); };
const lines = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
const href = p => p.split('/').map(encodeURIComponent).join('/');
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function confetti(){ const c = document.createElement('div'); c.className = 'confetti'; const em = ['🎉','⭐','🌟','🎈','✨','🏆'];
  for (let i = 0; i < 40; i++) { const e = document.createElement('i'); e.textContent = em[i % em.length]; e.style.left = Math.random()*100 + '%'; e.style.animationDelay = Math.random()*0.8 + 's'; c.appendChild(e); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3500); }
const ls = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const GRADES = ['א','ב','ג','ד','ה','ו'];
const hueOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

/* ================= content ================= */
let PROBLEMS = (window.PROBLEMS || []);
const AREAS = ['חרדות','רגש והתנהגות','חברה','למידה וקשב','גוף והרגלים','משבר ואובדן','צוות, כיתה והורים'];
const STAFF_AREA = 'צוות, כיתה והורים';
PROBLEMS.sort((a, b) => AREAS.indexOf(a.area) - AREAS.indexOf(b.area));
let P = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
function setContent(arr){ PROBLEMS = (arr || []).slice().sort((a, b) => AREAS.indexOf(a.area) - AREAS.indexOf(b.area)); P = Object.fromEntries(PROBLEMS.map(p => [p.id, p])); try { ASK_INDEX = null; } catch(e){} }
function runContent(txt){ window.PROBLEMS = []; try { new Function(txt)(); setContent(window.PROBLEMS); return true; } catch(e){ return false; } }
const unwrap = r => Array.isArray(r) ? r : (r && r.value) || [];
const WEB = location.protocol !== 'file:';
let LIBDATA = [], LIBTOPICS = [];
const topicName = id => (LIBTOPICS.find(t => t.id === id) || {}).name || '';
const topicIcon = id => (LIBTOPICS.find(t => t.id === id) || {}).icon || '📄';
function setLib(d, t){ LIBDATA = unwrap(d); LIBTOPICS = unwrap(t);
  LIBDATA.forEach((p, i) => { p.title = String(p.page || '').replace(/\s+/g,' ').trim(); p.attachments = (p.attachments || []).filter(a => a.path); p.key = p.pdf || (p.attachments[0] || {}).path || ('k' + i); }); }
if (!PROBLEMS.length && location.protocol !== 'file:') { try { const c = localStorage.getItem('cbtapp.content'); if (c) { window.PROBLEMS = []; new Function(c)(); setContent(window.PROBLEMS); } } catch(e){} }
if (window.LIB) setLib(window.LIB.data, window.LIB.topics); else { const c = ls.get('cbtapp.lib', null); if (c) setLib(c.data, c.topics); }
function libMatches(keywords){
  const kw = (keywords || []).map(k => k.toLowerCase()).filter(Boolean);
  const seen = new Set(), out = [];
  for (const p of LIBDATA) {
    const hay = (p.title + ' ' + (p.sub || '') + ' ' + p.attachments.map(a => a.name).join(' ')).toLowerCase();
    const hits = kw.filter(k => hay.includes(k)).length;
    if (!hits) continue;
    const sig = p.title + '|' + (p.src ? p.size : '') + '|' + p.attachments.map(a => a.name).join(',');
    if (seen.has(sig)) continue; seen.add(sig); out.push({p, hits: hits + (/ילד|הור|בית ספר|כית/.test(hay) ? 0.5 : 0) + (p.src ? 0 : 0.3)});
  }
  return out.sort((a, b) => b.hits - a.hits).map(x => x.p);
}
function ftype(name){ const e = (String(name).split('.').pop() || '').toLowerCase();
  if (e === 'pdf') return ['pdf','PDF']; if (e.startsWith('doc')) return ['doc','WORD']; if (e.startsWith('ppt')) return ['ppt','PPT'];
  if (['jpg','jpeg','png','gif'].includes(e)) return ['img','תמונה']; if (['mp4','m4v','webm','mov'].includes(e)) return ['img','וידאו']; if (['mp3','m4a','wav','ogg'].includes(e)) return ['img','שמע']; return ['', e.toUpperCase()]; }

const TOOLS = [
  {id:'thermometer', name:'מדחום רגשות', icon:'🌡️', desc:'הילד מזהה רגש ומדרג את עוצמתו מ-0 עד 10', h:10},
  {id:'breathing', name:'נשימה מונחית', icon:'🎈', desc:'נשימת בלון, נשימת ריבוע ו״מריחים פרח – מכבים נר״', h:170},
  {id:'thoughts', name:'בלש המחשבות', icon:'🕵️', desc:'מצב ← מחשבה ← רגש ← התנהגות, ושאלות בלש למחשבה חלופית', h:215},
  {id:'trafficlight', name:'רמזור לפתרון בעיות', icon:'🚦', desc:'עוצרים, חושבים על פתרונות, בוחרים ועושים', h:45},
  {id:'ladder', name:'סולם חשיפה', icon:'🪜', desc:'בונים מדרגות מהקל לקשה ומסמנים כל מדרגה שטיפסנו', h:260},
  {id:'rewards', name:'טבלת מדבקות', icon:'⭐', desc:'מטרה, מדבקות ופרס – עם חגיגה בסוף', h:35},
  {id:'pmr', name:'הרפיית שרירים', icon:'🐢', desc:'לימון, צב, מסטיק ובוץ – הרפיה מונחית לילדים', h:130},
  {id:'copingcard', name:'כרטיס התמודדות', icon:'🃏', desc:'כרטיס אישי ״כשאני מרגיש… אני יכול…״ להדפסה', h:300}
];
const TOOL = Object.fromEntries(TOOLS.map(t => [t.id, t]));
const MEASURES = ['SCARED','SCAS – ספנס','SDQ','CDI – דיכאון ילדים','מדחום פחד','שאלון ויסות רגשי (DERS)','רוזנברג – ערך עצמי','YGTSS – טיקים','CPSS – טראומה','CY-BOCS','דירוג מחנכת'];

/* ================= storage & sync ================= */
const KEY = 'cbtapp.state.v1';
const blank = () => ({version:1, updatedAt:0, students:[]});
let S = ls.get(KEY, null) || blank();
function fix(s){ ['plan','sessions','measures','ratings','thoughts','solutions','ladders','rewards','cards','problems','goals'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; }); return s; }
S.students.forEach(fix);
function save(){ S.updatedAt = Date.now(); ls.set(KEY, S); SYNC.schedule(); }
const student = id => S.students.find(s => s.id === id);
let activeId = ls.get('cbtapp.active', null);
const active = () => student(activeId);
function setActive(id){ activeId = id || null; ls.set('cbtapp.active', activeId); }

const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('cbtapp', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch(e){ return null; } },
  async set(k, v){ try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch(e){} },
  async del(k){ try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch(e){} }
};
const Sync = {
  supported: 'showSaveFilePicker' in window && 'showOpenFilePicker' in window,
  handle: null, status: 'none', last: 0, timer: null, err: '',
  types: [{description:'קובץ נתונים', accept:{'application/json':['.json']}}],
  async init(){
    if (!this.supported) { this.status = 'unsupported'; return ui(); }
    this.handle = await idb.get('sync');
    if (!this.handle) { this.status = 'none'; return ui(); }
    try { const p = await this.handle.queryPermission({mode:'readwrite'}); if (p === 'granted') await this.pull(); else this.status = 'permission'; }
    catch(e){ this.status = 'error'; this.err = e.message; }
    ui();
  },
  async resume(){ try { const p = await this.handle.requestPermission({mode:'readwrite'}); if (p === 'granted') await this.pull(); } catch(e){ this.status = 'error'; this.err = e.message; } ui(); },
  async create(){ try { const h = await window.showSaveFilePicker({suggestedName:'נתוני-מטופלים-CBT.json', types:this.types}); this.handle = h; await idb.set('sync', h); await this.push(); toast('קובץ הסנכרון נוצר'); } catch(e){ if (e.name !== 'AbortError') { this.status = 'error'; this.err = e.message; } } ui(); },
  async open(){ try { const [h] = await window.showOpenFilePicker({types:this.types}); this.handle = h; await idb.set('sync', h); await this.pull(); toast('מחובר לקובץ הסנכרון'); } catch(e){ if (e.name !== 'AbortError') { this.status = 'error'; this.err = e.message; } } ui(); },
  async disconnect(){ this.handle = null; this.status = 'none'; await idb.del('sync'); ui(); },
  async pull(){
    const f = await this.handle.getFile(); const txt = await f.text();
    let remote = null; try { remote = txt.trim() ? JSON.parse(txt) : null; } catch(e){ remote = null; }
    if (remote && remote.students && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
      S = remote; S.students.forEach(fix); ls.set(KEY, S); this.status = 'ok'; this.last = Date.now();
      if (S.updatedAt) toast('נטענו הנתונים העדכניים מהקובץ ב-OneDrive'); render();
    } else if (!remote || (remote.updatedAt || 0) < (S.updatedAt || 0)) { await this.push(); }
    else { this.status = 'ok'; this.last = Date.now(); }
  },
  schedule(){ if (this.status !== 'ok') return ui(); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 700); },
  async push(){ try { const w = await this.handle.createWritable(); await w.write(JSON.stringify(S, null, 1)); await w.close(); this.status = 'ok'; this.last = Date.now(); this.err = ''; } catch(e){ this.status = 'error'; this.err = e.message; } ui(); }
};
/* ================= cloud sync via Microsoft Graph (web version) ================= */
const DATAFILE = 'נתוני-מטופלים-CBT.json';
const Cloud = {
  msal: null, account: null, folderId: null, status: 'none', err: '', last: 0, timer: null,
  scopes: ['Files.ReadWrite', 'User.Read'],
  cfg(){ return window.CBT_CONFIG || {}; },
  async init(){
    const c = this.cfg();
    if (!c.clientId || !window.msal) { this.status = 'noconfig'; return ui(); }
    try {
      this.msal = new msal.PublicClientApplication({auth:{clientId:c.clientId, authority:'https://login.microsoftonline.com/consumers', redirectUri: location.origin + location.pathname, navigateToLoginRequestUrl:false},
        cache:{cacheLocation:'localStorage', storeAuthStateInCookie:true}});
      if (this.msal.initialize) await this.msal.initialize();
      const res = await this.msal.handleRedirectPromise().catch(e => { this.err = (e && (e.errorMessage || e.message)) || String(e); return null; });
      if (res && res.account) { this.msal.setActiveAccount(res.account); history.replaceState(null, '', location.pathname + '#/home'); }
      this.account = (res && res.account) || this.msal.getActiveAccount() || this.msal.getAllAccounts()[0] || null;
    } catch(e){ this.status = 'error'; this.err = e.message; return ui(); }
    if (!this.account) { this.status = 'signedout'; return ui(); }
    await this.connect();
  },
  login(){ if (this.msal) this.msal.loginRedirect({scopes: this.scopes, redirectUri: location.origin + location.pathname}); else toast('חסרה הגדרת התחברות'); },
  logout(){ ['cbtapp.folderId','cbtapp.content','cbtapp.lib',KEY,'cbtapp.asks','cbtapp.active'].forEach(k => { try { localStorage.removeItem(k); } catch(e){} }); if (this.msal) this.msal.logoutRedirect({account: this.account}); },
  async getText(rel){
    const m = await this.g(this.itemPath(rel) + ':');
    if (m.status === 404) return null;
    const j = await m.json();
    const r = await fetch(j['@microsoft.graph.downloadUrl']);
    if (!r.ok) throw new Error('OneDrive ' + r.status);
    return await r.text();
  },
  async loadContent(){
    const txt = await this.getText('app-content.js');
    if (txt == null) throw new Error('לא מצאתי ב-OneDrive את קובץ התוכן של האפליקציה');
    if (runContent(txt)) { try { localStorage.setItem('cbtapp.content', txt); } catch(e){} }
  },
  async token(){
    try { return (await this.msal.acquireTokenSilent({scopes: this.scopes, account: this.account})).accessToken; }
    catch(e){ await this.msal.acquireTokenRedirect({scopes: this.scopes, account: this.account}); throw e; }
  },
  async g(path, opt = {}){
    const t = await this.token();
    const r = await fetch('https://graph.microsoft.com/v1.0' + path, {...opt, headers: {Authorization: 'Bearer ' + t, ...(opt.headers || {})}});
    if (!r.ok && r.status !== 404) throw new Error('OneDrive ' + r.status);
    return r;
  },
  itemPath(rel){ return `/me/drive/items/${this.folderId}:/${rel.split('/').map(encodeURIComponent).join('/')}`; },
  async findFolder(){
    const cached = ls.get('cbtapp.folderId', null);
    if (cached) { const r = await this.g('/me/drive/items/' + cached + '?$select=id'); if (r.ok) return cached; }
    const name = this.cfg().folderName || 'אתר לימודי סיביטי';
    const r = await this.g(`/me/drive/root/search(q='${encodeURIComponent(name)}')?$select=id,name,folder`);
    const j = await r.json();
    const f = (j.value || []).find(x => x.folder && x.name === name);
    if (!f) throw new Error('לא מצאתי ב-OneDrive את התיקייה ״' + name + '״');
    ls.set('cbtapp.folderId', f.id); return f.id;
  },
  async connect(){
    try {
      this.status = 'connecting'; ui();
      this.folderId = await this.findFolder();
      await this.loadContent();
      try { const cfg = await this.getText('app-config.json'); window.CBT_AI_CONFIG = cfg ? JSON.parse(cfg) : null; } catch(e){ window.CBT_AI_CONFIG = null; }
      await AI.init();
      await this.loadLib();
      await this.pull();
      this.status = 'ok';
    } catch(e){ if (this.status !== 'ok') { this.status = 'error'; this.err = e.message; } }
    ui(); render();
  },
  async loadLib(){
    const t = await this.getText('app-library.json');
    if (t == null) return;
    const j = JSON.parse(t);
    setLib(j.data, j.topics);
    try { localStorage.setItem('cbtapp.lib', JSON.stringify(j)); } catch(e){}
  },
  async pull(){
    const t = await this.getText(DATAFILE);
    if (t == null) { await this.push(); return; }
    let remote = null; try { remote = JSON.parse(t); } catch(e){ remote = null; }
    if (remote && remote.students && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
      S = remote; S.students.forEach(fix); ls.set(KEY, S);
      if (S.updatedAt) toast('נטענו הנתונים העדכניים מ-OneDrive');
      render();
    } else if (!remote || (remote.updatedAt || 0) < (S.updatedAt || 0)) { await this.push(); }
    this.status = 'ok'; this.last = Date.now(); ui();
  },
  async push(){
    await this.g(this.itemPath(DATAFILE) + ':/content', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(S)});
    this.status = 'ok'; this.last = Date.now(); this.err = ''; ui();
  },
  schedule(){ if (this.status !== 'ok') return ui(); clearTimeout(this.timer); this.timer = setTimeout(() => this.push().catch(e => { this.status = 'error'; this.err = e.message; ui(); }), 1000); },
  async openFile(rel){
    if (this.status !== 'ok') return toast('כדי לפתוח קבצים מהספרייה צריך להתחבר עם חשבון מיקרוסופט');
    const w = window.open('', '_blank');
    try {
      const r = await this.g(this.itemPath(rel) + ':?$select=webUrl');
      if (!r.ok) throw new Error('הקובץ לא נמצא ב-OneDrive');
      const j = await r.json();
      if (w) w.location.href = j.webUrl; else location.href = j.webUrl;
    } catch(e){ if (w) w.close(); toast('לא הצלחתי לפתוח את הקובץ: ' + e.message); }
  }
};
/* ================= claude.ai artifact sync (per-viewer private db) ================= */
const ArtSync = {
  db: null, uid: null, status: 'connecting', err: '', last: 0, timer: null, sent: {}, unsub: null, busy: false,
  async init(){
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { this.status = 'none'; return ui(); }
      this.db = db; this.uid = uid;
      await this.pull();
      this.unsub = this.col().onSnapshot(snap => this.onRemote(snap), e => { if (e && e.code === 'revoked') { this.status = 'none'; ui(); } });
    } catch(e){ this.status = 'error'; this.err = (e && (e.message || e.code)) || String(e); }
    ui(); render();
  },
  col(){ return this.db.collection('data/users/' + this.uid); },
  fromDocs(docs){
    const meta = docs.find(d => d.id === 'meta'); if (!meta) return null;
    const m = meta.data() || {};
    const byId = Object.fromEntries(docs.filter(d => d.id.startsWith('s_')).map(d => [d.id.slice(2), d.data()]));
    const order = Array.isArray(m.order) ? m.order : Object.keys(byId);
    return {version: 1, updatedAt: m.updatedAt || 0, students: order.map(id => byId[id]).filter(Boolean).map(x => fix(JSON.parse(JSON.stringify(x))))};
  },
  adopt(remote){ S = remote; ls.set(KEY, S); this.sent = Object.fromEntries(S.students.map(s => [s.id, JSON.stringify(s)])); },
  async pull(){
    const snap = await this.col().get();
    const remote = this.fromDocs(snap.docs);
    if (remote && remote.updatedAt > (S.updatedAt || 0)) { this.adopt(remote); if (S.students.length) toast('נטענו הנתונים העדכניים'); }
    else if (!remote || remote.updatedAt < (S.updatedAt || 0)) { await this.push(); }
    else this.sent = Object.fromEntries(S.students.map(s => [s.id, JSON.stringify(s)]));
    this.status = 'ok'; this.last = Date.now(); ui();
  },
  onRemote(snap){
    if (this.busy || snap.metadata.hasPendingWrites) return;
    const remote = this.fromDocs(snap.docs);
    if (remote && remote.updatedAt > (S.updatedAt || 0)) { this.adopt(remote); this.last = Date.now(); render(); toast('עודכן ממכשיר אחר'); }
  },
  async push(){
    if (!this.db) return;
    this.busy = true;
    try {
      const col = this.col(), ids = new Set(S.students.map(s => s.id));
      for (const s of S.students) { const j = JSON.stringify(s); if (this.sent[s.id] !== j) { await col.doc('s_' + s.id).set(JSON.parse(j)); this.sent[s.id] = j; } }
      for (const id of Object.keys(this.sent)) if (!ids.has(id)) { await col.doc('s_' + id).delete(); delete this.sent[id]; }
      await col.doc('meta').set({updatedAt: S.updatedAt || Date.now(), order: S.students.map(s => s.id)});
      this.status = 'ok'; this.last = Date.now(); this.err = '';
    } catch(e){ this.status = 'error'; this.err = e.code === 'quota_exceeded' ? 'נגמר המקום לשמירה' : (e.message || e.code); }
    this.busy = false; ui();
  },
  schedule(){ if (!this.db) return ui(); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1200); }
};

function chart(points, max = 10, label = ''){
  if (points.length < 2) return `<p class="muted">הגרף יופיע אחרי שני רישומים לפחות.</p>`;
  const W = 600, H = 190, pad = 30, n = points.length;
  const x = i => pad + i * (W - pad * 2) / (n - 1), y = v => H - pad - (v / max) * (H - pad * 2);
  const d = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const grid = [0, max/2, max].map(v => `<line class="axis" x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${W-pad+6}" y="${y(v)+4}">${v}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${grid}<path class="ln" d="${d}"/>
    ${points.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="5"><title>${esc(p.t)}: ${p.v}</title></circle>`).join('')}
    <text class="lbl" x="${pad}" y="${H-8}">${esc(points[0].t)}</text><text class="lbl" x="${W-pad}" y="${H-8}" text-anchor="end">${esc(points[n-1].t)}</text></svg>`;
}

const TOOLAFTER = {
  breathing(){ if (T.running) runBreath(); },

function runBreath(){
  const m = BREATH[T.mode]; let k = 0;
  const circle = $('#bcircle'), ph = $('#bphase'), cnt = $('#bcount');
  const step = () => {
    if (!T.running || !circle) return;
    const [txt, sec, scale] = m.steps[k];
    circle.style.transitionDuration = sec + 's'; circle.style.transform = `scale(${scale})`; ph.textContent = txt;
    let left = sec; cnt.textContent = left;
    const iv = setInterval(() => { left--; if (left > 0) cnt.textContent = left; else clearInterval(iv); }, 1000); timers.push(iv);
    k = (k + 1) % m.steps.length;
    if (k === 0) timers.push(setTimeout(() => { T.cycles++; const c = $('#bcycles'); if (c) c.textContent = 'סבבים: ' + T.cycles; }, sec * 1000));
    timers.push(setTimeout(step, sec * 1000));
  };
  step();
}
function runPmr(){
  if (T.i < 0) { T.i = 0; T.phase = 'tense'; render(); return; }
  if (T.i >= PMR.length) { T.running = false; render(); return; }
  const sec = T.phase === 'tense' ? 5 : 8; let left = sec;
  const c = $('#pmrcount'); if (c) c.textContent = left + ' שניות';
  const iv = setInterval(() => { left--; const c2 = $('#pmrcount'); if (c2) c2.textContent = left > 0 ? left + ' שניות' : ''; }, 1000); timers.push(iv);
  timers.push(setTimeout(() => { if (T.phase === 'tense') T.phase = 'relax'; else { T.i++; T.phase = 'tense'; if (T.i >= PMR.length) T.running = false; } render(); }, sec * 1000));
}
function toolSave(kind){
  const a = active(); if (!a) return toast('בחרו תלמיד בראש המסך');
  const d = today();
  if (kind === 'thermometer') { if (T.level == null) return toast('בוחרים קודם רמה'); a.ratings.push({id:uid(), date:d, emotion:T.emotion, level:T.level}); }
  if (kind === 'thoughts') { if (!T.situation && !T.thought) return toast('ממלאים לפחות מצב ומחשבה'); a.thoughts.push({id:uid(), date:d, situation:T.situation, thought:T.thought, feeling:T.feeling, before:T.before, behavior:T.behavior, alt:T.alt, after:T.after}); }
  if (kind === 'trafficlight') { if (!T.problem) return toast('כותבים קודם מה הבעיה'); a.solutions.push({id:uid(), date:d, feel:T.feel, problem:T.problem, options:T.options, chosen:T.chosen, plan:T.plan}); }
  const upsert = (arr, obj) => { if (!obj.id) obj.id = uid(); const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); };
  const pick = keys => Object.fromEntries(keys.map(k => [k, JSON.parse(JSON.stringify(T[k]))]));
  if (kind === 'ladder') { if (!T.steps.length) return toast('מוסיפים קודם מדרגות'); const o = pick(['id','title','steps']); o.title = o.title || 'סולם חשיפה'; upsert(a.ladders, o); T.id = o.id; }
  if (kind === 'rewards') { const o = pick(['id','title','goal','filled','prize','sticker']); o.title = o.title || 'טבלת מדבקות'; upsert(a.rewards, o); T.id = o.id; }
  if (kind === 'copingcard') { if (!T.items.length) return toast('בוחרים לפחות דבר אחד'); const o = pick(['id','feeling','items','color']); upsert(a.cards, o); T.id = o.id; }
  save(); toast('נשמר בתיק של ' + a.alias + ' ✓');
}

/* ================= AI assistant (grounded in the maps) ================= */
const AI = {
  backend: null, status: 'unknown', sample: null, err: '',
  async init(){
    if (ARTIFACT) {
      try { this.sample = await claude.use('sample'); } catch(e){ this.sample = null; }
      this.backend = this.sample ? 'sample' : null;
    } else if (WEB && window.CBT_AI_CONFIG && window.CBT_AI_CONFIG.anthropicKey) {
      this.backend = 'api';
    }
    this.status = this.backend ? 'ready' : 'none';
  },
  available(){ return this.status === 'ready' && !!this.backend; },
  disable(reason){ this.status = 'off'; this.err = reason || ''; },
  async ask(prompt, {quick = false, signal, onText} = {}){
    if (this.backend === 'sample') {
      return await this.sample.json(prompt, {modelTier: quick ? 'quick' : 'default', signal, onText, cache: false});
    }
    if (this.backend === 'api') {
      const c = window.CBT_AI_CONFIG;
      const r = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', signal,
        headers: {'content-type': 'application/json', 'x-api-key': c.anthropicKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
        body: JSON.stringify({model: quick ? (c.quickModel || 'claude-haiku-4-5-20251001') : (c.model || 'claude-opus-5'), max_tokens: quick ? 400 : 4000, messages: [{role: 'user', content: prompt}]})});
      if (!r.ok) { const t = await r.text().catch(() => ''); throw {code: r.status === 401 ? 'not_granted' : r.status === 429 ? 'rate_limited' : 'upstream_error', message: 'API ' + r.status + ' ' + t.slice(0, 200)}; }
      const j = await r.json();
      const text = (j.content || []).filter(x => x.type === 'text').map(x => x.text).join('');
      return parseJsonLoose(text);
    }
    throw {code: 'not_granted', message: 'no backend'};
  }
};
function parseJsonLoose(t){
  try { return JSON.parse(t); } catch(e){}
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) { try { return JSON.parse(m[1]); } catch(e){} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  throw {code: 'invalid_json', message: 'no json', text: t};
}

function compactMap(p){
  const R = (window.CBT_MAP_ROLES || {})[p.id] || {};
  const m = p.model || {};
  return {id: p.id, name: p.name, area: p.area, summary: p.summary, signs: p.signs, assessment: p.assessment,
    model: {triggers: m.triggers, thoughts: m.thoughts, feelings: m.feelings, body: m.body, behaviors: m.behaviors, maintaining: m.maintaining},
    goals: p.goals, sessions: (p.sessions || []).map((s, i) => ({n: i + 1, title: s.title, goals: s.goals, activities: s.activities, homework: s.homework})),
    techniques: p.techniques, parents: p.parents, teachers: p.teachers, redFlags: p.redFlags, sources: p.sources, whoDoesWhat: R};
}
function rolesCompact(){
  const G = window.CBT_ROLES || {};
  return {intro: G.intro, roles: (G.roles || []).map(r => ({name: r.name, who: r.who, owns: r.owns, contactsParentsWhen: r.parents, notParentsWhen: r.notParents, next: r.next})), ladder: G.ladder, emergency: G.emergency, whoCallsParents: G.whoCallsParents, teacherToHomeroom: G.teacherToHomeroom, rules: G.rules};
}

let aiCtl = null;
async function aiAnswerRun(q){
  const box = $('#aiPanel'); if (!box) return;
  aiCtl = new AbortController();
  const busy = t => { box.innerHTML = `<div class="panel" style="border-inline-start:5px solid var(--brand)"><h3>🤖 Claude עונה מתוך מפות הטיפול</h3><p class="muted" style="margin:0">${esc(t)}</p><div class="actions" style="margin-top:10px"><button class="btn sm" data-act="ai-stop">⏹ עצירה</button></div></div>`; };
  busy('קורא את השאלה ובוחר מפה מתאימה…');
  try {
    const c = await AI.ask(aiClassifyPrompt(q), {quick: true, signal: aiCtl.signal});
    const ids = Array.isArray(c && c.mapIds) ? c.mapIds.map(String).filter(id => P[id]).slice(0, 2) : [];
    const rolesQ = !!(c && c.roles);
    if (!ids.length && !rolesQ) { box.innerHTML = aiNotFoundHTML(q, !!(c && c.safety)); return; }
    const maps = ids.map(id => P[id]);
    busy(maps.length ? `מצאתי: ${maps.map(p => p.icon + ' ' + p.name).join(', ')}. כותב תשובה מותאמת ל${askerOf().label}…` : 'כותב תשובה מתוך מדריך התפקידים…');
    const ans = await AI.ask(aiAnswerPrompt(q, maps, rolesQ), {signal: aiCtl.signal});
    if (ans && typeof ans === 'object' && c && c.safety) ans.safety = true;
    box.innerHTML = aiAnswerHTML(q, ans, maps, rolesQ || !!(c && c.safety) || !!(ans && ans.safety));
  } catch(e){
    if (e && e.code === 'cancelled') { box.innerHTML = ''; return; }
    const code = (e && e.code) || 'upstream_error';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) AI.disable(code);
    const msg = AI_ERR[code] || AI_ERR.upstream_error;
    box.innerHTML = `<div class="note warn" style="margin-bottom:12px">🤖 ${esc(msg)}${AI.available() ? ` <button class="btn sm" data-act="ai-retry">נסו שוב</button>` : ''}</div>` + (AI.available() ? '' : answerHTML(answer(q)));
  }
}

    <p class="muted" style="margin:0;font-size:14px">אפשר לנסח שוב (מי מתקשה, מה קורה, מתי), או לעיין ברשימת המפות.</p><div class="actions" style="margin-top:12px"><a class="btn" href="#/problems">🧭 כל המפות</a><a class="btn" href="#/roles">👥 מי פונה למי</a></div></div>`;

function aiAnswerHTML(q, A, maps, rolesQ){
  if (!A || typeof A !== 'object') return `<div class="note warn">התשובה הגיעה בפורמט לא צפוי. <button class="btn sm" data-act="ai-retry">נסו שוב</button></div>`;
  const p = P[A.mapId] || maps[0] || null;
  const a = askerOf();
  let h = '';
  if (A.safety) h += answerHTML({safety: true, top: null, others: [], snip: [], intents: [], roles: false, q}).split('<div class="panel"><h3>🤔')[0];
  if (A.notFound) return h + aiNotFoundHTML(q, false).replace('<h3>🤔 השאלה לא מכוסה במפות הטיפול</h3>', `<h3>🤔 ${esc(A.headline || 'השאלה לא מכוסה במפות הטיפול')}</h3>`) + (A.note ? `<div class="note">${esc(A.note)}</div>` : '');
  h += `<div class="panel" style="border-inline-start:5px solid hsl(${p ? hueOf(p.area) : 160} 55% 45%)"><h3>${p ? p.icon + ' ' : '🤖 '}${esc(A.headline || '')}</h3>
    ${p ? `<p class="muted" style="margin:0;font-size:14px">מפת הטיפול: <a href="#/problem/${p.id}">${esc(p.name)}</a>${maps.length > 1 ? ' · קשור גם: ' + maps.filter(x => x !== p).map(x => `<a href="#/problem/${x.id}">${esc(x.name)}</a>`).join(', ') : ''}</p>` : ''}
    <p class="pill brand" style="margin:8px 0 0;display:inline-block">${a.icon} תשובה מותאמת ל${a.label}</p></div>`;
  if (Array.isArray(A.steps) && A.steps.length) h += `<div class="panel"><h3>✅ מה עושים עכשיו – צעד אחר צעד</h3><ol style="margin:0;padding-inline-start:22px;display:grid;gap:8px">${A.steps.map(s => `<li><b>${esc(s.t || '')}:</b> ${esc(s.d || '')}</li>`).join('')}</ol></div>`;
  if (A.contacts) h += `<div class="panel"><h3>📞 מי פונה למי</h3><p style="margin:0">${esc(A.contacts)}</p><p style="margin:10px 0 0"><a class="btn sm" href="#/roles">👥 המדריך המלא</a>${p ? ` <a class="btn sm" href="#/problem/${p.id}/roles">מי עושה מה במפה הזו</a>` : ''}</p></div>`;
  if (Array.isArray(A.watch) && A.watch.length) h += `<div class="panel" style="border-color:color-mix(in srgb,var(--danger) 40%,var(--line))"><h3>🚩 לשים לב / מתי להפנות</h3>${ul(A.watch)}</div>`;
  if (A.note) h += `<div class="note">${esc(A.note)}</div>`;
  if (p) {
    const tl = (p.tools || []).filter(t => TOOL[t]);
    h += `<div class="panel"><div class="actions"><a class="btn primary" href="#/problem/${p.id}">🧭 מפת הטיפול המלאה</a>${!LITE && a.id === 'counselor' ? `<button class="btn" data-act="planfor" data-id="${p.id}">📋 תוכנית טיפול לתלמיד</button>` : ''}<a class="btn" href="#/problem/${p.id}/sessions">🗓️ המפגשים</a>${tl.map(t => `<a class="btn" href="#/tool/${t}">${TOOL[t].icon} ${TOOL[t].name}</a>`).join('')}</div></div>`;
    const lib = libFor(q, p);
    if (lib.length) h += `<div class="panel"><h3>📚 חומרים מהספרייה שלך</h3><div class="list">${lib.map(libItem).join('')}</div></div>`;
  }
  h += `<p class="muted" style="font-size:13px">התשובה נכתבה על ידי Claude מתוך מפות הטיפול והמדריך שבאפליקציה בלבד. היא כלי עזר, ושיקול הדעת המקצועי נשאר של השואל/ת. <a href="#" data-act="ai-fast">להצגת התשובה מהמנוע המהיר</a></p>`;
  return h;
}

function circlesSVG(){
  const rings = [
    {r: 58, label: 'הילד', items: []},
    {r: 118, label: '', items: ['הורים', 'מורים מקצועיים', 'מחנך/ת']},
    {r: 178, label: '', items: ['יועץ/ת', 'מזכירות']},
    {r: 238, label: '', items: ['הנהלה', 'שפ״ח וגורמי חוץ']},
    {r: 298, label: '', items: ['פיקוח']}
  ];
  const C = 310, fills = ['var(--brand)', 'hsl(160 var(--soft-s) var(--soft-l))', 'hsl(200 var(--soft-s) var(--soft-l))', 'hsl(35 var(--soft-s) var(--soft-l))', 'hsl(270 var(--soft-s) var(--soft-l))'];
  let g = '';
  for (let i = rings.length - 1; i >= 0; i--) g += `<circle cx="${C}" cy="${C}" r="${rings[i].r}" fill="${fills[i]}" stroke="var(--panel)" stroke-width="3"/>`;
  g += `<text x="${C}" y="${C + 7}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">הילד</text>`;
  rings.forEach((ring, i) => {
    if (!i) return;
    const mid = (rings[i - 1].r + ring.r) / 2, n = ring.items.length;
    ring.items.forEach((t, k) => {
      const a = -Math.PI / 2 + (k - (n - 1) / 2) * (n > 2 ? 0.95 : 1.1) + (i % 2 ? 0 : Math.PI);
      const x = C + mid * Math.cos(a), y = C + mid * Math.sin(a);
      g += `<text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)">${t}</text>`;
    });
  });
  return `<svg viewBox="0 0 620 620" style="width:100%;max-width:520px;display:block;margin:0 auto" role="img" aria-label="מעגלי הגורמים סביב הילד">${g}</svg>`;
}

  else h += `<div class="list">${G.ladder.map(l => `<div class="li"><span class="pill brand">${l.level}</span><div class="grow"><b>${esc(l.who)}</b><div style="font-size:14.5px">${esc(l.what)}</div></div></div>`).join('')}</div>`;
  h += `</div><div class="panel"><h3>📞 מי פונה להורים</h3><div class="list">${G.whoCallsParents.map(x => `<div class="li"><div class="grow"><b>${esc(x.situation)}</b><div>➡️ ${esc(x.who)} <span class="muted" style="font-size:14px">· ${esc(x.note)}</span></div></div></div>`).join('')}</div>
    <p class="note danger" style="margin:12px 0 0">🚨 ${esc(G.emergency)}</p><p style="margin:12px 0 0"><a class="btn primary" href="#/roles">👥 המדריך המלא – תפקידים, מדרגות ותרשים</a></p></div>`;
  return h;
}

/* ================= modals & forms ================= */
function modal(title, html, onsubmit){
  const m = $('#modal'); m.className = 'modal open';
  m.innerHTML = `<div class="box"><div class="mhead"><h3>${esc(title)}</h3><button class="iconbtn" data-act="close">✕</button></div><form class="form" id="mform">${html}
    <div class="actions" style="justify-content:flex-start"><button class="btn primary" type="submit">שמירה</button><button class="btn" type="button" data-act="close">ביטול</button></div></form></div>`;
  $('#mform').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target); const o = {}; for (const [k, v] of fd.entries()) { if (o[k] !== undefined) { o[k] = [].concat(o[k], v); } else o[k] = v; } if (onsubmit(o) !== false) closeModal(); };
  const first = m.querySelector('input,textarea,select'); if (first) first.focus();
}
function viewer(title, url, kind){
  const m = $('#modal'); m.className = 'modal open big';
  m.innerHTML = `<div class="box"><div class="mhead"><h3>${esc(title)}</h3><a class="btn sm" href="${url}" target="_blank">↗ לשונית חדשה</a><button class="iconbtn" data-act="close">✕</button></div>
    ${kind === 'pdf' || kind === 'img' ? `<iframe src="${url}"></iframe>` : `<div class="empty"><span class="big">📂</span>את הקובץ הזה לא ניתן להציג בדפדפן.<br><br><a class="btn primary" href="${url}" target="_blank">פתיחה בתוכנה</a></div>`}</div>`;
}
function closeModal(){ const m = $('#modal'); m.className = 'modal'; m.innerHTML = ''; }
function studentForm(s){
  const x = s || {alias:'', grade:'', classroom:'', problems:[], start:today(), referral:'', goals:[], notes:''};
  modal(s ? 'עריכת תלמיד' : 'תלמיד חדש', `
    <label class="f">כינוי / ראשי תיבות *<input name="alias" required value="${esc(x.alias)}" placeholder="למשל: ד״ל או ״הכוכב״"></label>
    <div class="row2"><label class="f">שכבה<select name="grade"><option value="">—</option>${GRADES.map(g => `<option ${x.grade === g ? 'selected' : ''}>${g}</option>`).join('')}</select></label>
    <label class="f">כיתה<input name="classroom" value="${esc(x.classroom || '')}" placeholder="למשל: 2"></label></div>
    <div class="row2"><label class="f">תחילת טיפול<input type="date" name="start" value="${esc(x.start || '')}"></label>
    <label class="f">הופנה ע״י<select name="referral">${['','מחנכ/ת','הורים','יוזמת הילד','צוות','פסיכולוג/ית','אחר'].map(r => `<option ${x.referral === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label></div>
    <label class="f">בעיות מרכזיות</label><div class="checks">${PROBLEMS.map(p => `<label><input type="checkbox" name="problems" value="${p.id}" ${x.problems.includes(p.id) ? 'checked' : ''}> ${p.icon} ${esc(p.name)}</label>`).join('')}</div>
    <label class="f">מטרות (שורה לכל מטרה)<textarea name="goals">${esc((x.goals || []).join('\n'))}</textarea></label>
    <label class="f">רקע והערות<textarea name="notes">${esc(x.notes || '')}</textarea></label>`, o => {
      const data = {alias:o.alias.trim(), grade:o.grade, classroom:o.classroom, start:o.start, referral:o.referral, problems:[].concat(o.problems || []), goals:lines(o.goals), notes:o.notes};
      if (s) Object.assign(s, data); else { const n = fix({id:uid(), created:today(), ...data}); S.students.push(n); setActive(n.id); location.hash = '#/student/' + n.id; }
      save(); render();
    });
}
function sessionForm(s, sess, prefill){
  const x = sess || {date:today(), num:String(s.sessions.length + 1), rating:'', content:'', homework:'', notes:'', ...(prefill || {})};
  modal(sess ? 'עריכת מפגש' : 'רישום מפגש', `
    <div class="row2"><label class="f">תאריך<input type="date" name="date" value="${esc(x.date)}"></label><label class="f">מספר מפגש<input name="num" value="${esc(x.num || '')}"></label></div>
    <label class="f">עוצמת הקושי היום (0–10, לפי דיווח הילד או הערכתך)<input type="number" min="0" max="10" name="rating" value="${esc(x.rating ?? '')}"></label>
    <label class="f">מה עשינו<textarea name="content">${esc(x.content || '')}</textarea></label>
    <label class="f">משימת בית<input name="homework" value="${esc(x.homework || '')}"></label>
    <label class="f">הערות ותובנות<textarea name="notes">${esc(x.notes || '')}</textarea></label>`, o => {
      const d = {date:o.date, num:o.num, rating:o.rating === '' ? '' : Math.max(0, Math.min(10, +o.rating)), content:o.content, homework:o.homework, notes:o.notes};
      if (sess) Object.assign(sess, d); else s.sessions.push({id:uid(), ...d});
      save(); render();
    });
}
function planForm(s, i){
  const x = i != null ? s.plan[i] : {title:'', goals:[], activities:[], homework:'', tool:null};
  modal(i != null ? 'עריכת מפגש בתוכנית' : 'מפגש חדש בתוכנית', `
    <label class="f">כותרת<input name="title" required value="${esc(x.title)}"></label>
    <label class="f">מטרות (שורה לכל אחת)<textarea name="goals">${esc(x.goals.join('\n'))}</textarea></label>
    <label class="f">פעילויות (שורה לכל אחת)<textarea name="activities">${esc(x.activities.join('\n'))}</textarea></label>
    <label class="f">משימת בית<input name="homework" value="${esc(x.homework || '')}"></label>
    <label class="f">כלי במפגש<select name="tool"><option value="">—</option>${TOOLS.map(t => `<option value="${t.id}" ${x.tool === t.id ? 'selected' : ''}>${t.icon} ${t.name}</option>`).join('')}</select></label>`, o => {
      const d = {title:o.title, goals:lines(o.goals), activities:lines(o.activities), homework:o.homework, tool:o.tool || null};
      if (i != null) Object.assign(s.plan[i], d); else s.plan.push({...d, done:false, date:'', notes:''});
      save(); render();
    });
}
function measureForm(s){
  modal('ציון שאלון / מדד', `
    <label class="f">שם השאלון או המדד<input name="name" list="mlist" required placeholder="בחירה או הקלדה"><datalist id="mlist">${MEASURES.map(m => `<option value="${esc(m)}">`).join('')}${[...new Set(s.measures.map(m => m.name))].map(m => `<option value="${esc(m)}">`).join('')}</datalist></label>
    <div class="row2"><label class="f">ציון<input type="number" step="any" name="score" required></label><label class="f">תאריך<input type="date" name="date" value="${today()}"></label></div>`, o => {
      s.measures.push({id:uid(), name:o.name.trim(), score:+o.score, date:o.date}); save(); render();
    });
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, act = d.act, s = d.s ? student(d.s) : null;
  const need = ['copyq','ai-stop','ai-retry','ai-fast','asker','cloud-login','cloud-logout','cloud-sync','cloud-retry','askex','newstudent','close','print','fullscreen','area','arch','libtopic','libopen','attopen','planfor','printproblem','export','wipe','usefor'].includes(act) || act.startsWith('sync') || act.startsWith('th-') || act.startsWith('br-') || act.startsWith('tl-') || act.startsWith('ld-') || act.startsWith('rw-') || act.startsWith('pmr') || act.startsWith('cc-') || act === 'dq' || act === 'toolsave';
  if (!need && !s && d.s) return;
  switch (act) {
    case 'newstudent': studentForm(); break;
    case 'editstudent': studentForm(s); break;
    case 'close': closeModal(); break;
    case 'print': window.print(); break;
    case 'fullscreen': { const st = $('#stage'); if (document.fullscreenElement) document.exitFullscreen(); else if (st && st.requestFullscreen) st.requestFullscreen(); break; }
    case 'area': areaFilter = d.v; render(); break;
    case 'arch': showArchived = d.v === '1'; render(); break;
    case 'libtopic': libTopic = d.v; render(); break;
    case 'libopen': if (e.target.closest('[data-act="attopen"]')) return; if (WEB) Cloud.openFile(d.pdf); else viewer(d.title, href(d.pdf), 'pdf'); break;
    case 'attopen': e.preventDefault(); e.stopPropagation(); if (WEB) Cloud.openFile(d.path); else viewer(d.title, href(d.path), ftype(d.path)[0]); break;
    case 'cloud-login': Cloud.login(); break;
    case 'art-sync': await ArtSync.pull().catch(err => { ArtSync.status = 'error'; ArtSync.err = err.message || err.code; }); render(); toast('סונכרן'); break;
    case 'cloud-logout': if (await uiConfirm('להתנתק מחשבון המיקרוסופט במכשיר הזה?')) Cloud.logout(); break;
    case 'cloud-sync': await Cloud.pull().catch(err => { Cloud.status = 'error'; Cloud.err = err.message; }); render(); toast('סונכרן'); break;
    case 'cloud-retry': await Cloud.connect(); break;
    case 'planfor': {
      const list = S.students.filter(x => !x.archived);
      modal('תוכנית טיפול לתלמיד', `<label class="f">לאיזה תלמיד?<select name="sid"><option value="__new">＋ תלמיד חדש…</option>${list.map(x => `<option value="${x.id}" ${x.id === activeId ? 'selected' : ''}>${esc(x.alias)}</option>`).join('')}</select></label>
        <p class="muted" style="margin:0">המפגשים של ״${esc(P[d.id].name)}״ יתווספו לתוכנית שלו.</p>`, o => {
          if (o.sid === '__new') { closeModal(); studentForm(); return false; }
          const st = student(o.sid); addPlanFrom(st, d.id); location.hash = '#/student/' + st.id + '/plan';
        });
      break; }
    case 'printproblem': location.hash = '#/problem/' + d.id + '/print'; break;
    case 'setactive': setActive(s.id); render(); toast('⭐ ' + s.alias + ' נבחר לעבודה'); break;
    case 'usefor': setActive(d.s); break;
    case 'archive': s.archived = !s.archived; if (s.archived && activeId === s.id) setActive(null); save(); render(); break;
    case 'mkplan': addPlanFrom(s, d.p); render(); toast('התוכנית נוצרה'); break;
    case 'addplan': planForm(s); break;
    case 'editplan': planForm(s, +d.i); break;
    case 'delplan': if (await uiConfirm('למחוק את המפגש מהתוכנית?')) { s.plan.splice(+d.i, 1); save(); render(); } break;
    case 'clearplan': if (await uiConfirm('למחוק את כל תוכנית הטיפול?')) { s.plan = []; save(); render(); } break;
    case 'plandone': { const x = s.plan[+d.i]; x.done = !x.done; if (x.done && !x.date) x.date = today(); save(); render(); if (x.done && s.plan.every(p => p.done)) confetti(); break; }
    case 'logfromplan': { const x = s.plan[+d.i]; sessionForm(s, null, {num:String(+d.i + 1), date:x.date || today(), content:x.title + (x.activities.length ? '\n' + x.activities.join('\n') : ''), homework:x.homework}); break; }
    case 'addsession': sessionForm(s); break;
    case 'editsession': sessionForm(s, s.sessions.find(x => x.id === d.id)); break;
    case 'delsession': if (await uiConfirm('למחוק את רישום המפגש?')) { s.sessions = s.sessions.filter(x => x.id !== d.id); save(); render(); } break;
    case 'addmeasure': measureForm(s); break;
    case 'delmeasure': e.preventDefault(); if (await uiConfirm('למחוק את הציון?')) { s.measures = s.measures.filter(x => x.id !== d.id); save(); render(); } break;
    case 'delwork': if (await uiConfirm('למחוק?')) { s[d.k] = s[d.k].filter(x => x.id !== d.id); save(); render(); } break;
    case 'toolsave': toolSave(d.k); break;
    case 'asker': ASKER = d.v; ls.set('cbtapp.asker', ASKER); aiFast = false; render(); break;
    case 'copyq': try { navigator.clipboard.writeText(d.v).then(() => toast('השאלה הועתקה – הדביקו אותה בעמוד של Claude'), () => {}); } catch(err){} break;
    case 'ai-stop': if (aiCtl) aiCtl.abort(); break;
    case 'ai-retry': if (lastAsk || route().id) aiAnswerRun(route().id || lastAsk); break;
    case 'ai-fast': e.preventDefault(); aiFast = true; render(); break;
    case 'askex': location.hash = '#/ask/' + encodeURIComponent(d.v); break;
    case 'stage': { const st = STAGES.find(x => x.id === d.id); s.stages = s.stages || {}; s.stages[st.id] = !stageDone(s, st); save(); render(); break; }
    // tools
    case 'th-emo': T.emotion = d.v; render(); break;
    case 'th-lvl': T.level = +d.v; render(); break;
    case 'br-mode': T.mode = d.v; T.running = false; T.cycles = 0; render(); break;
    case 'br-toggle': T.running = !T.running; render(); break;
    case 'dq': { const i = +d.i; T.q = el.checked ? [...T.q, i] : T.q.filter(x => x !== i); break; }
    case 'tl-add': { const i = $('#tlopt'); if (i.value.trim()) { T.options.push({t:i.value.trim(), v:0}); render(); } break; }
    case 'tl-vote': T.options[+d.i].v = +d.v; render(); break;
    case 'ld-add': { const t = $('#ldtext'); if (!t.value.trim()) return toast('כותבים את המדרגה'); T.steps.push({id:uid(), text:t.value.trim(), suds:+$('#ldsuds').value, done:false}); render(); break; }
    case 'ld-done': { const st = T.steps.find(x => x.id === d.id); st.done = !st.done; render(); if (st.done) { confetti(); if (active() && T.id) toolSave('ladder'); } break; }
    case 'ld-del': T.steps = T.steps.filter(x => x.id !== d.id); render(); break;
    case 'rw-st': T.sticker = d.v; render(); break;
    case 'rw-fill': { const i = +d.i; T.filled = i < T.filled ? i : i + 1; render(); if (T.filled >= T.goal) confetti(); if (active() && T.id) toolSave('rewards'); break; }
    case 'pmr-go': T.running = !T.running; render(); break;
    case 'pmr-reset': T.i = -1; T.phase = ''; T.running = false; render(); break;
    case 'cc-item': T.items = el.checked ? [...T.items, d.v] : T.items.filter(x => x !== d.v); render(); break;
    case 'cc-add': { const i = $('#ccown'); if (i.value.trim()) { T.items.push(i.value.trim()); render(); } break; }
    case 'cc-color': T.color = d.v; render(); break;
    // settings
    case 'sync-create': await Sync.create(); render(); break;
    case 'sync-open': await Sync.open(); render(); break;
    case 'sync-resume': await Sync.resume(); render(); break;
    case 'sync-now': await Sync.pull().catch(err => { Sync.status = 'error'; Sync.err = err.message; }); render(); toast('סונכרן'); break;
    case 'sync-off': if (await uiConfirm('לנתק את קובץ הסנכרון? הנתונים יישארו במחשב הזה.')) { await Sync.disconnect(); render(); } break;
    case 'syncbtn': if (WEB && Cloud.status === 'signedout') Cloud.login(); else if (!WEB && Sync.status === 'permission') { await Sync.resume(); render(); } else location.hash = '#/settings'; break;
    case 'export': { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'גיבוי-CBT-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); break; }
    case 'wipe': if (await uiConfirm('למחוק את כל התלמידים והרישומים מהמחשב הזה?') && await uiConfirm('בטוח? אי אפשר לבטל. אם יש קובץ סנכרון, גם הוא יתעדכן.')) { S = blank(); save(); setActive(null); render(); } break;
    case 'theme': { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'; ls.set('cbtapp.theme', r.dataset.theme); break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
  const v = el.dataset.num ? +el.value : el.value;
  if (b.startsWith('T.')) { const k = b.slice(2); T[k] = v; const lab = $('#v-' + k); if (lab) lab.textContent = v; if (el.tagName === 'SELECT' || (el.type === 'range' && false)) render(); }
  if (b.startsWith('plan.')) { const s = student(el.dataset.s); if (s) { s.plan[+el.dataset.i][b.slice(5)] = v; save(); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'who') { setActive(el.value); render(); if (el.value) toast('⭐ עבודה עם ' + active().alias); }
  if (el.dataset && el.dataset.bind && el.tagName === 'SELECT' && el.dataset.bind.startsWith('T.')) render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function addPlanFrom(s, pid){
  const p = P[pid]; if (!p || !s) return;
  if (!s.problems.includes(pid)) s.problems.push(pid);
  if (!s.goals.length) s.goals = (p.goals || []).slice();
  p.sessions.forEach(x => s.plan.push({title:x.title, goals:(x.goals || []).slice(), activities:(x.activities || []).slice(), homework:x.homework || '', tool:x.tool || null, done:false, date:'', notes:'', from:pid}));
  save();
}

/* ================= boot ================= */
{ const t = ls.get('cbtapp.theme', null); if (t) document.documentElement.dataset.theme = t; }
$('#nav').innerHTML = NAV.filter(n => !LITE || !['students','library'].includes(n[0])).map(([k, i, l]) => `<a href="#/${k}" data-nav="${k}"><span class="i">${i}</span>${l}</a>`).join('');
$('#tabbar').innerHTML = NAV.filter(n => !['library','settings','workflow','roles'].concat(LITE ? ['students'] : []).includes(n[0])).map(([k, i, l]) => `<a href="#/${k}" data-nav="${k}"><span class="i">${i}</span>${l}</a>`).join('');
render();
AI.init().then(() => { if (route().r === 'ask') render(); });
document.body.classList.toggle('artifact', ARTIFACT); document.body.classList.toggle('lite', LITE);
SYNC.init();
if (WEB && !ARTIFACT && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
